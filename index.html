function wzGoStep(n){ wz.draftGen++; wz.step = n; renderWizardStep(); }

async function submitWizard(){
  const by = document.getElementById('wz_by').value.trim();
  const memo = document.getElementById('wz_memo').value.trim();
  if(!by){ document.getElementById('wz4_err').style.display = 'block'; return; }

  const btn = document.getElementById('wz4SubmitBtn');
  btn.disabled = true;
  btn.textContent = '사진 압축·업로드 중...';

  const id = genId();
  const now = new Date().toISOString();
  const itemPhotoTotal = wz.items.reduce((sum, it) => sum + it.photos.length, 0);
  const totalPhotos = 1 + (wz.zoomImage ? 1 : 0) + itemPhotoTotal;

  const rec = {
    id, returnNumber: wz.returnNumber, hospitalName: wz.hospitalName,
    memo,
    items: wz.items.map(it => ({ id: it.id, productCode: it.productCode, productName: it.productName, lot: it.lot, expiryDate: it.expiryDate, quantity: it.quantity, status: it.status || 'A' })),
    status: 'pending', registeredBy: by, registeredAt: now,
    confirmedBy: null, confirmedAt: null, confirmMemo: null,
    photoCount: totalPhotos
  };
  records.push(rec);
  render();
  closeOverlay('wizardOverlay');
  await saveMyName(by);
  const ok = await window.fbAddRecord(rec);

  try{
    const receiptCompressed = await compressPhoto(wz.receiptImage);
    await window.fbAddPhoto(id, null, 'receipt', receiptCompressed);
    if(wz.zoomImage){
      const zoomCompressed = await compressPhoto(wz.zoomImage);
      await window.fbAddPhoto(id, null, 'zoom', zoomCompressed);
    }
    for(const it of wz.items){
      for(const p of it.photos){
        const c = await compressPhoto(p.data);
        await window.fbAddPhoto(id, it.id, 'product', c);
      }
    }
    showToast(ok ? '반품 등록 완료' : '등록됐지만 일부 저장에 실패했어요');
  }catch(e){
    console.error('사진 업로드 실패:', e);
    showToast('기록은 등록됐지만 일부 사진 업로드에 실패했어요');
  }
}

// ===================== 엑셀 내보내기 (품목 기준 1행) ===================== //

function exportToExcel(){
  const list = getFiltered();
  if(list.length === 0){ showToast('내보낼 항목이 없어요'); return; }
  const rows = [];
  list.forEach(r => {
    const its = itemsOf(r);
    const base = {
      '반품번호': r.returnNumber || '', '상태': STATUS_LABEL[r.status] || r.status,
      '병원명': r.hospitalName || '',
      '등록자': r.registeredBy || '', '등록일시': r.registeredAt ? fmtDate(r.registeredAt) : '',
      '검수자': r.confirmedBy || '', '검수일시': r.confirmedAt ? fmtDate(r.confirmedAt) : '', '메모': r.memo || ''
    };
    if(its.length === 0){
      rows.push({ ...base, '제품코드':'', '제품명':'', '제조번호':'', '유효기간':'', '수량':'', '품목상태값':'' });
    } else {
      its.forEach(it => {
        const st = it.status || 'A';
        rows.push({ ...base, '제품코드': it.productCode||'', '제품명': it.productName||'', '제조번호': it.lot||'', '유효기간': it.expiryDate||'', '수량': it.quantity||'', '품목상태값': `${st} (${ITEM_STATUS_LABEL[st] || st})` });
      });
    }
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:10},{wch:20},{wch:14},{wch:10},{wch:16},{wch:10},{wch:16},{wch:24},{wch:22},{wch:20},{wch:14},{wch:12},{wch:8},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '반품검수기록');
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `반품검수기록_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.xlsx`);
  showToast(`${rows.length}건 엑셀로 다운로드 완료`);
}

// ===================== 초기화 / 로그인 ===================== //

function applyGuestModeUI(){
  const subtitle = document.getElementById('subtitle');
  const wizardBtn = document.getElementById('openWizard');
  const masterBtn = document.getElementById('masterBtn');
  const partnerBtn = document.getElementById('partnerBtn');
  const productCatalogBtn = document.getElementById('productCatalogBtn');
  if(isGuestMode){
    if(wizardBtn) wizardBtn.style.display = 'none';
    if(masterBtn) masterBtn.style.display = 'none';
    if(partnerBtn) partnerBtn.style.display = 'none';
    if(productCatalogBtn) productCatalogBtn.style.display = 'none';
    if(subtitle) subtitle.textContent = '반품인수증 · 실물 대조 검수 관리 (게스트)';
  } else {
    if(wizardBtn) wizardBtn.style.display = '';
    if(masterBtn) masterBtn.style.display = '';
    if(partnerBtn) partnerBtn.style.display = '';
    if(productCatalogBtn) productCatalogBtn.style.display = '';
    if(subtitle) subtitle.textContent = '반품인수증 · 실물 대조 검수 관리';
  }
}

document.getElementById('openWizard').addEventListener('click', openWizardModal);
document.getElementById('masterBtn').addEventListener('click', openMasterModal);
document.getElementById('partnerBtn').addEventListener('click', openPartnerModal);
document.getElementById('productCatalogBtn').addEventListener('click', openProductCatalogModal);
document.getElementById('exportExcel').addEventListener('click', exportToExcel);
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  showAppConfirm('로그아웃 할까요?', '로그아웃', async ()=>{ await window.fbLogout(); });
});
document.getElementById('searchInput').addEventListener('input', (e)=>{ searchTerm = e.target.value; render(); });
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});

function showSetupNeeded(){
  document.getElementById('app').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'setup-screen';
  el.innerHTML = `<div class="setup-box">
    <div class="setup-icon">🔧</div>
    <h2>Firebase 설정이 필요해요</h2>
    <p>이 파일의 &lt;script type="module"&gt; 안 <code>firebaseConfig</code> 값을<br>
    새로 만든 Firebase 프로젝트 설정값으로 채워야 앱이 동작해요.</p>
  </div>`;
  document.body.appendChild(el);
}

function showLoginScreen(){
  document.getElementById('app').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'setup-screen'; el.id = 'loginScreen';
  el.innerHTML = `<div class="setup-box" style="text-align:center;">
    <div class="setup-icon">🔒</div>
    <h2>비밀번호 입력</h2>
    <p>팀 공용 비밀번호를 입력하면 들어갈 수 있어요.</p>
    <input class="login-input" id="loginPw" type="password" placeholder="비밀번호">
    <div class="login-err" id="loginErr">비밀번호가 틀렸어요. 다시 확인해주세요.</div>
    <button class="btn-submit" style="width:100%; margin-top:14px;" id="loginBtn">입장</button>
    <button class="btn-cancel" style="width:100%; margin-top:10px;" id="guestBtn">게스트로 둘러보기 (조회 전용)</button>
    <div class="login-err" id="guestErr">게스트 접속에 실패했어요. 잠시 후 다시 시도해주세요.</div>
  </div>`;
  document.body.appendChild(el);

  const submit = async ()=>{
    const pw = document.getElementById('loginPw').value;
    if(!pw) return;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    err.style.display = 'none'; btn.textContent = '확인 중...'; btn.disabled = true;
    const ok = await window.fbLogin(pw);
    if(ok){ el.remove(); document.getElementById('app').style.display = ''; }
    else { err.style.display = 'block'; btn.textContent = '입장'; btn.disabled = false; }
  };
  document.getElementById('loginBtn').addEventListener('click', submit);
  document.getElementById('loginPw').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  document.getElementById('loginPw').focus();

  document.getElementById('guestBtn').addEventListener('click', async ()=>{
    const gbtn = document.getElementById('guestBtn');
    const gerr = document.getElementById('guestErr');
    gerr.style.display = 'none'; gbtn.textContent = '접속 중...'; gbtn.disabled = true;
    const ok = await window.fbGuestLogin();
    if(ok){ el.remove(); document.getElementById('app').style.display = ''; }
    else { gerr.style.display = 'block'; gbtn.textContent = '게스트로 둘러보기 (조회 전용)'; gbtn.disabled = false; }
  });
}

(async function init(){
  loadMyName();
  await waitForFirebase();
  if(!window.__firebaseReady){ showSetupNeeded(); return; }
  window.fbOnAuthChange((isLoggedIn, isAnonymous)=>{
    if(isLoggedIn){
      isGuestMode = !!isAnonymous;
      const existingLogin = document.getElementById('loginScreen');
      if(existingLogin) existingLogin.remove();
      document.getElementById('app').style.display = '';
      applyGuestModeUI();
      initRealtimeSync();
    } else {
      isGuestMode = false;
      showLoginScreen();
    }
  });
})();
</script>
