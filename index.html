    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('editItemOverlay'); });

  const codeInput = document.getElementById('ei_productCode');
  const codeSuggest = document.getElementById('ei_productSuggest');
  const nameInput = document.getElementById('ei_productName');
  window.fbListCatalogItems().then(list => { productCatalogCache = list; });
  codeInput.addEventListener('input', ()=> renderSuggestBox(productCatalogCache, codeInput.value, codeSuggest, codeInput, (item)=> item.code));
  codeInput.addEventListener('itemselected', (e)=>{ if(e.detail && e.detail.name) nameInput.value = e.detail.name; });
  codeInput.addEventListener('focus', ()=>{ if(codeInput.value.trim()) renderSuggestBox(productCatalogCache, codeInput.value, codeSuggest, codeInput, (item)=> item.code); });
  document.addEventListener('click', function hideOnOutside(e){
    if(!codeSuggest.contains(e.target) && e.target !== codeInput){ codeSuggest.style.display = 'none'; }
  });

  document.getElementById('ei_saveBtn').addEventListener('click', async ()=>{
    const lot = document.getElementById('ei_lot').value.trim();
    if(!lot){ document.getElementById('ei_err').style.display = 'block'; return; }
    const patch = {
      productCode: document.getElementById('ei_productCode').value.trim(),
      productName: document.getElementById('ei_productName').value.trim(),
      lot,
      expiryDate: document.getElementById('ei_expiryDate').value.trim(),
      quantity: document.getElementById('ei_quantity').value.trim(),
      status: document.getElementById('ei_status').value
    };
    const idx = its.findIndex(x => x.id === itemId);
    its[idx] = { ...it, ...patch };
    rec.items = its;
    render();
    closeOverlay('editItemOverlay');
    const ok = await window.fbUpdateRecord(recordId, { items: its });
    showToast(ok ? '품목이 수정됐어요' : '수정됐지만 저장에 실패했어요');
    if(fromEditRecordModal){ renderEditRecordItemsList(recordId); }
    else { openDetail(recordId); }
  });
}

function deleteItemFromRecord(recordId, itemId, fromEditRecordModal){
  showAppConfirm('이 품목을 삭제할까요? 첨부된 실물사진도 같이 삭제되고, 되돌릴 수 없어요.', '삭제', async ()=>{
    const rec = records.find(r => r.id === recordId);
    if(!rec) return;
    const its = itemsOf(rec).filter(x => x.id !== itemId);
    rec.items = its;
    render();
    const ok = await window.fbUpdateRecord(recordId, { items: its });
    // 그 품목에 달려있던 실물사진들도 정리
    const photos = await window.fbGetPhotos(recordId);
    const orphanPhotos = photos.filter(p => p.itemId === itemId);
    for(const p of orphanPhotos){ await window.fbDeletePhoto(p.id); }
    if(orphanPhotos.length > 0 && typeof rec.photoCount === 'number'){
      rec.photoCount = Math.max(0, rec.photoCount - orphanPhotos.length);
      await window.fbUpdateRecord(recordId, { photoCount: rec.photoCount });
    }
    showToast(ok ? '품목 삭제 완료' : '삭제됐지만 저장에 일부 실패했어요');
    if(fromEditRecordModal){ renderEditRecordItemsList(recordId); }
    else { openDetail(recordId); }
  });
}

// ===================== OCR / 이미지 유틸 ===================== //

function resizeImageToDataUrl(dataUrl, maxWidth, format, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(format === 'png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// 사진은 별도 컬렉션에 1장씩 저장되므로 문서당 1MB 한도만 넘지 않으면 됨 - 여유있게 압축
async function compressPhoto(dataUrl){
  const targetChars = 900 * 1024 * 1.37;
  const jpegSteps = [
    { maxWidth: 1600, quality: 0.85 },
    { maxWidth: 1400, quality: 0.7 },
    { maxWidth: 1100, quality: 0.55 },
    { maxWidth: 900, quality: 0.45 }
  ];
  let result = await resizeImageToDataUrl(dataUrl, jpegSteps[0].maxWidth, 'jpeg', jpegSteps[0].quality);
  for(const step of jpegSteps){
    if(result.length <= targetChars) break;
    result = await resizeImageToDataUrl(dataUrl, step.maxWidth, 'jpeg', step.quality);
  }
  return result;
}

function preprocessImageForOcr(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      // OCR 속도·정확도 균형을 위해 긴 변 기준으로 크기 정규화 - 휴대폰 원본(3000px+)은 줄이고, 작은 크롭은 키움
      const targetLong = 1600;
      const longSide = Math.max(img.width, img.height);
      const scale = targetLong / longSide;
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      try{
        const imageData = ctx.getImageData(0,0,w,h);
        const d = imageData.data;
        for(let i=0;i<d.length;i+=4){
          const gray = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
          let v = (gray - 128) * 1.35 + 128;
          v = Math.max(0, Math.min(255, v));
          d[i]=d[i+1]=d[i+2]=v;
        }
        ctx.putImageData(imageData, 0, 0);
      }catch(e){ console.warn('전처리 스킵:', e); }
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Tesseract 단어별 좌표(bbox)를 이용해 같은 줄(y좌표 비슷한 것끼리)로 다시 묶고, 줄 안에서는 x좌표순으로 정렬
// - 표 서식 문서에서 OCR이 "라벨들 먼저, 값들 나중" 식으로 순서를 뒤섞어 읽는 문제를 근본적으로 해결함
function reconstructLinesFromWords(words){
  if(!words || words.length === 0) return '';
  const items = words
    .filter(w => w && w.text && w.text.trim() && w.bbox)
    .map(w => ({ text: w.text.trim(), cy: (w.bbox.y0 + w.bbox.y1) / 2, h: Math.max(1, w.bbox.y1 - w.bbox.y0), x0: w.bbox.x0 }));
  if(items.length === 0) return '';
  items.sort((a,b) => a.cy - b.cy);
  const lines = [];
  let current = [items[0]];
  let lastCy = items[0].cy;
  for(let i = 1; i < items.length; i++){
    const it = items[i];
    if(Math.abs(it.cy - lastCy) <= it.h * 0.6){
      current.push(it);
    } else {
      lines.push(current);
      current = [it];
    }
    lastCy = it.cy;
  }
  lines.push(current);
  const joined = lines.map(line => line.sort((a,b)=>a.x0-b.x0).map(w=>w.text).join(' ')).join('\n');
  return collapseHangulSpacing(joined);
}

// Tesseract가 한글을 음절(글자) 단위로 쪼개서 인식하면 "반품번호"가 "반 품 번 호"처럼 글자 사이에 공백이 끼어버려서
// 라벨 문자열 검색(indexOf)이 전부 실패함 - 한글끼리 붙어있던 공백만 골라서 제거함 (숫자/영문 사이 공백은 그대로 유지)
function collapseHangulSpacing(text){
  if(!text) return text;
  let prev, cur = text;
  do {
    prev = cur;
    cur = cur.replace(/([가-힣])[ \t]+([가-힣])/g, '$1$2'); // 공백/탭만 제거 (줄바꿈은 유지해야 서로 다른 줄이 합쳐지지 않음)
  } while(cur !== prev);
  return cur;
}

let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker('kor+eng', 1, {});
  }
  return ocrWorkerPromise;
}

async function runOcr(dataUrl){
  try{
    const pre = await preprocessImageForOcr(dataUrl);
    const worker = await getOcrWorker();
    const result = await worker.recognize(pre);
    const rawText = (result && result.data && result.data.text) ? result.data.text : '';
    const words = (result && result.data && result.data.words) ? result.data.words : [];
    const rebuilt = reconstructLinesFromWords(words);
    return rebuilt || collapseHangulSpacing(rawText); // 좌표 재조립이 되면 그걸 우선 사용, 실패하면 원본 텍스트로 폴백
  }catch(e){
    console.error('OCR error:', e);
    return '';
  }
}

// 인수증 전용 OCR - 텍스트뿐 아니라 글자별 좌표(words)도 같이 반환 (반품번호/반품처 정밀 추출용)
async function runReceiptOcr(dataUrl){
  try{
    const pre = await preprocessImageForOcr(dataUrl);
    const worker = await getOcrWorker();
    const result = await worker.recognize(pre);
    const rawText = (result && result.data && result.data.text) ? result.data.text : '';
    const words = (result && result.data && result.data.words) ? result.data.words : [];
    const rebuilt = reconstructLinesFromWords(words);
    return { text: rebuilt || collapseHangulSpacing(rawText), words };
  }catch(e){
    console.error('OCR error:', e);
    return { text: '', words: [] };
  }
}

// 라벨 단어를 좌표로 직접 찾아서, 같은 행(y좌표 비슷함)에서 라벨 오른쪽에 붙어있는 단어만 이어붙여 값으로 반환
// 텍스트 줄 재조립 방식보다 훨씬 정확함 - 표 안에서 다른 행/다른 라벨로 잘못 건너뛰는 것을 원천 차단
const ROW_STOP_LABELS = ['반품사유', '사업자', '공급처', '대표자', '청구처', '반품요청일자', '반품처', '연락처', '주소', '병원명', '제품코드', '제품명', 'REF', 'LOT', 'EXP'];

// 편집거리(레벤슈타인) - 짧은 라벨 단어에서 OCR이 한 글자 정도 잘못 읽어도 찾아낼 수 있게 함
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(Math.abs(m - n) > 2) return 99;
  const dp = [];
  for(let i = 0; i <= m; i++){ dp.push(new Array(n + 1).fill(0)); dp[i][0] = i; }
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}

// 인수증에서 흔히 나오는 라벨 전체 목록 - 유사매칭 시 "이미 다른 진짜 라벨과 정확히 일치하는 단어"는 제외하기 위함
const ALL_KNOWN_LABELS = ['반품번호', '반품처', '병원명', '반품사유', '반품요청일자', '사업자', '공급처', '대표자', '청구처', '연락처', '주소', '제품코드', '제품명'];

// wordText 안에 labelText와 편집거리 1 이내로 비슷한 부분문자열이 있는지 (완전 일치 우선 시도, 실패시 유사매칭)
// 주의1: 라벨보다 짧은 부분문자열은 검사하지 않음 - 안 그러면 "반품번호"의 앞 2글자 "반품"이 "반품처"와 유사판정되는 오매칭이 생김
// 주의2: 단어가 이미 "다른" 진짜 라벨과 정확히 일치하면 유사매칭 자체를 시도하지 않음 - "반품번호"와 "반품처"는 접두어가 같아서
//        편집거리 1로도 겹칠 수 있는데, "반품번호"는 그 자체로 확실한 다른 필드이므로 절대 "반품처"로 오인하면 안 됨
function fuzzyLabelIncludes(wordText, labelText){
  if(!wordText || !labelText) return false;
  if(wordText.includes(labelText)) return true;
  const matchesOtherKnownLabel = ALL_KNOWN_LABELS.some(kl => kl !== labelText && wordText.includes(kl));
  if(matchesOtherKnownLabel) return false;
  const lLen = labelText.length;
  if(wordText.length < lLen) return false;
  for(let start = 0; start + lLen <= wordText.length; start++){
    for(let len = lLen; len <= lLen + 1 && start + len <= wordText.length; len++){
      if(levenshtein(wordText.substr(start, len), labelText) <= 1) return true;
    }
  }
  return false;
}

function extractValueByWordPosition(words, labelText){
  if(!words || words.length === 0) return '';
  const cw = words.filter(w => w && w.text && w.text.trim() && w.bbox);
  for(let i = 0; i < cw.length; i++){
    let labelBbox = null;
    if(fuzzyLabelIncludes(cw[i].text, labelText)){
      labelBbox = cw[i].bbox;
    } else {
      for(let span = 2; span <= labelText.length && i + span - 1 < cw.length; span++){
        const joined = cw.slice(i, i + span).map(w => w.text).join('');
        if(fuzzyLabelIncludes(joined, labelText)){ labelBbox = cw[i + span - 1].bbox; break; }
      }
    }
    if(!labelBbox) continue;

    const labelCy = (labelBbox.y0 + labelBbox.y1) / 2;
    const labelH = Math.max(1, labelBbox.y1 - labelBbox.y0);
    const sameRow = cw
      .filter(w => w.bbox.x0 >= labelBbox.x1 - 2 && Math.abs(((w.bbox.y0 + w.bbox.y1) / 2) - labelCy) <= labelH * 0.7)
      .sort((a, b) => a.bbox.x0 - b.bbox.x0);

    let collected = [];
    let prevX1 = labelBbox.x1;
    for(const w of sameRow){
      if(w.bbox.x0 - prevX1 > labelH * 6) break; // 큰 간격이면 다른 필드로 넘어간 것으로 간주
      if(ROW_STOP_LABELS.some(sw => fuzzyLabelIncludes(w.text, sw))) break; // 같은 줄의 다음 라벨을 만나면 멈춤
      collected.push(w.text);
      prevX1 = w.bbox.x1;
      if(collected.join('').replace(/[^A-Za-z0-9가-힣]/g, '').length >= 24) break;
    }
    if(collected.length > 0) return collected.join(' ').replace(/^[:：\s]+/, '').trim();
  }
  return '';
}

// 반품번호: 좌표기반 추출을 우선 시도(같은 행 값에서 숫자·밑줄 패턴 추출) → 실패시 줄 텍스트 방식으로 폴백
function extractReturnNumberGuess(words, text){
  const rowVal = extractValueByWordPosition(words, '반품번호');
  if(rowVal){
    let m = rowVal.match(/\d[\d_\-]{3,18}\d/);
    if(m) return m[0];
    m = rowVal.match(/\d{6,14}/);
    if(m) return m[0];
  }
  return extractDigitsNear(text, '반품번호', 6, 14);
}

// 반품처/병원명: 좌표기반 추출 우선 → 실패시 줄 텍스트 방식으로 폴백
function extractHospitalGuessByWords(words, text){
  const rowVal = extractValueByWordPosition(words, '반품처') || extractValueByWordPosition(words, '병원명');
  if(rowVal) return rowVal.slice(0, 60);
  return extractHospitalGuess(text);
}

// 반품번호: 같은 줄에서만 값을 찾음 (전체 텍스트 60자 윈도우 방식은 다른 행의 숫자를 잘못 집어올 수 있어서 폐기)
// 밑줄·하이픈 섞인 형식(20260811_1)을 순수 숫자(0042933059)보다 먼저 시도 (더 구체적인 패턴 우선)
function extractDigitsNear(text, label, minLen, maxLen){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  if(label){
    for(const line of lines){
      const idx = line.indexOf(label);
      if(idx === -1) continue;
      const rest = line.slice(idx + label.length).replace(/^[\s:：]+/, '');
      let m = rest.match(/\d[\d_\-]{3,18}\d/);
      if(m) return m[0];
      m = rest.match(new RegExp(`\\d{${minLen},${maxLen}}`));
      if(m) return m[0];
    }
    return '';
  }
  const all = [...text.matchAll(new RegExp(`\\d{${minLen},${maxLen}}`, 'g'))].map(m=>m[0]);
  if(all.length === 0) return '';
  return all.sort((a,b)=>b.length-a.length)[0];
}

function extractDateNear(text){
  if(!text) return '';
  const m = text.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return `${m[1]}.${String(m[2]).padStart(2,'0')}.${String(m[3]).padStart(2,'0')}`;
  const m2 = text.match(/(20\d{2})[.\-\/](\d{1,2})/);
  if(m2) return `${m2[1]}.${String(m2[2]).padStart(2,'0')}`;
  return '';
}

function extractCodeLike(text, pattern){
  if(!text) return '';
  const clean = text.replace(/\s+/g, ' ');
  const m = clean.match(pattern);
  return m ? m[0] : '';
}

// 인수증 서식은 항상 같으므로 "반품처"/"병원명" 라벨과 같은 줄에서 라벨 오른쪽 텍스트를 통째로 가져옴
// (좌표 재조립된 텍스트라 라벨-값이 같은 줄에 붙어있음 - 값에 "병원"이라는 글자가 없어도 안정적으로 잡힘)
function extractLabelValueSameLine(text, label){
  if(!text) return '';
  const lines = text.split(/\n+/);
  for(const line of lines){
    const idx = line.indexOf(label);
    if(idx !== -1){
      const rest = line.slice(idx + label.length).replace(/^[\s:：]+/, '').trim();
      if(rest) return rest.slice(0, 60);
    }
  }
  return '';
}

function extractHospitalGuess(text){
  return extractLabelValueSameLine(text, '반품처') || extractLabelValueSameLine(text, '병원명') || '';
}

// GS1 바코드 사람이 읽는 텍스트 (01)04039361097042(10)LOT(17)EXP 에서 (01) 뒤 GTIN(12~14자리 숫자)을 찾음
function extractGtinCandidate(text){
  if(!text) return '';
  const m = text.match(/\d{12,14}/);
  return m ? m[0] : '';
}

// ===================== 실제 바코드 그래픽 디코딩 (실험적) ===================== //
// 텍스트OCR 대신 진짜 바코드 스캔 라이브러리로 바코드 자체를 읽음 - GS1-128 바코드는 Code128 방식이라
// (01)GTIN(10)LOT(17)EXP 전체가 바코드 하나에 다 들어있는 경우가 많음. 디코딩되면 훨씬 정확함.
// 폰 카메라 원본은 해상도가 너무 크고 라벨이 세로로 찍히는 경우가 많아 Quagga가 못 찾는 경우가 많음.
// 적정 크기로 리사이즈 + 0/90/180/270도 회전본을 만들어 순서대로 시도 (사용자 조작 없이 자동)
function rotateAndResizeDataUrl(dataUrl, angleDeg, maxSize){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxSize / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      // 바코드가 사진 가장자리에 딱 붙게 촬영된 경우(여백=quiet zone 없음) 디코딩이 잘 실패하므로
      // 회전 캔버스에 흰 여백을 넉넉히 둬서 인위적으로 quiet zone을 만들어줌
      const pad = Math.round(Math.max(w, h) * 0.08) + 24;
      const canvas = document.createElement('canvas');
      const swap = (angleDeg === 90 || angleDeg === 270);
      const contentW = swap ? h : w, contentH = swap ? w : h;
      canvas.width = contentW + pad * 2;
      canvas.height = contentH + pad * 2;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate(angleDeg * Math.PI / 180);
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function quaggaDecodeOnce(src, quaggaSize){
  return new Promise((resolve)=>{
    try{
      Quagga.decodeSingle({
        decoder: { readers: ['code_128_reader', 'ean_reader', 'ean_8_reader', 'code_39_reader', 'upc_reader'] },
        locate: true,
        inputStream: { size: quaggaSize || 900 },
        src
      }, function(result){
        resolve(result && result.codeResult && result.codeResult.code ? result.codeResult.code : null);
      });
    }catch(e){ console.warn('바코드 디코딩 시도 실패:', e); resolve(null); }
  });
}

// 흑백 변환 + 퍼센타일 기반 대비 보정. 조명이 흐리거나 반사광이 있는 라벨 사진에서
// 바코드 흑/백 경계가 흐릿하게 찍힌 경우 이 전처리를 거치면 디코딩 성공률이 올라감.
// (기존엔 단순 min/max로 늘렸는데, 사진 구석에 그림자나 반사광 하나만 있어도 그쪽에 쏠려서
// 전체 보정이 틀어지는 문제가 있었음 → 상하위 2%는 버리고 나머지 구간으로 늘리는 방식으로 교체)
function enhanceContrastDataUrl(dataUrl, maxSize){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      const scale = Math.min(1, maxSize / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const pad = Math.round(Math.max(w, h) * 0.08) + 24;
      const canvas = document.createElement('canvas');
      canvas.width = w + pad * 2; canvas.height = h + pad * 2;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, pad, pad, w, h);
      try{
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        const hist = new Array(256).fill(0);
        let total = 0;
        const grayOf = i => 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        for(let i = 0; i < d.length; i += 4){ hist[Math.round(grayOf(i))]++; total++; }
        const cut = total * 0.02;
        let cum = 0, lo = 0;
        for(let v = 0; v < 256; v++){ cum += hist[v]; if(cum >= cut){ lo = v; break; } }
        cum = 0; let hi = 255;
        for(let v = 255; v >= 0; v--){ cum += hist[v]; if(cum >= cut){ hi = v; break; } }
        const range = Math.max(1, hi - lo);
        for(let i = 0; i < d.length; i += 4){
          const stretched = Math.max(0, Math.min(255, ((grayOf(i) - lo) / range) * 255));
          d[i] = d[i+1] = d[i+2] = stretched;
        }
        ctx.putImageData(imgData, 0, 0);
      }catch(e){ console.warn('대비 보정 실패, 원본으로 진행:', e); }
      resolve(canvas.toDataURL('image/jpeg', 0.92));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// [2026-08 실측 반영] 실제 반품 라벨 사진들을 테스트해보니, 사진 프레임 전체에서 바코드가 차지하는
// 비율이 10% 안팎으로 작은 경우가 많았음. 기존 기본크기 1000px로 사진 "전체"를 리사이즈하면 바코드
// 막대 하나하나의 실제 픽셀폭이 너무 얇아져서 실패가 잦았음 → 기본크기를 1300px로 올리고,
// 시도 조합은 정확도 대비 속도를 고려해 5개로 정리함(기존 6개+대비보정1개에서 축소).
async function decodeBarcodeFromImage(dataUrl){
  if(!window.Quagga) return null;
  const attempts = [
    { angle: 0, size: 1300 },
    { angle: 90, size: 1300 },
    { angle: 270, size: 1300 },
    { angle: 180, size: 1300 },
    { angle: 0, size: 900 },   // 반대로 너무 가까이서(바코드가 큼) 찍힌 경우
  ];
  for(const a of attempts){
    try{
      const src = await rotateAndResizeDataUrl(dataUrl, a.angle, a.size);
      // Quagga 내부 분석 해상도를 만든 이미지 크기와 맞춰줘야 함 - 여기서 다시 900으로 깎아버리면
      // 1400px로 크게 만든 의미(작게 찍힌 바코드를 더 세밀하게 분석)가 없어짐
      const code = await quaggaDecodeOnce(src, a.size);
      if(code) return code;
    }catch(e){ console.warn(`바코드 ${a.angle}도/${a.size}px 시도 실패:`, e); }
  }
  // 여기까지 다 실패했으면 흐림/저조도/반사광 가능성 → 대비 보정 버전으로 한 번 더 시도
  try{
    const enhanced = await enhanceContrastDataUrl(dataUrl, 1300);
    const code = await quaggaDecodeOnce(enhanced, 900);
    if(code) return code;
  }catch(e){ console.warn('대비 보정 디코딩 시도 실패:', e); }
  return null;
}

// 사진의 특정 영역(crop)만 잘라서 디코딩 - 배경 노이즈(라벨 글자, 다른 무늬)가 없어지므로
// 인식 실패했던 사진도 바코드 부분만 정확히 잘라주면 성공률이 크게 올라감.
// cropRect은 원본 이미지 기준 0~1 비율 좌표 {x,y,w,h}
function cropDataUrl(dataUrl, cropRect){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const sx = Math.round(cropRect.x * img.width);
      const sy = Math.round(cropRect.y * img.height);
      const sw = Math.round(cropRect.w * img.width);
      const sh = Math.round(cropRect.h * img.height);
      const canvas = document.createElement('canvas');
      canvas.width = sw; canvas.height = sh;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      resolve(canvas.toDataURL('image/jpeg', 0.95));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function decodeBarcodeFromCrop(dataUrl, cropRect){
  const cropped = await cropDataUrl(dataUrl, cropRect);
  return decodeBarcodeFromImage(cropped);
}

// 바코드 그래픽 디코딩 결과(GS1 원시값)를 LOT추가 모달의 필드(LOT/유효기간/제품코드 대조)에 반영.
// 최초 촬영 시 자동실행과, 아래 크롭 재시도 버튼을 눌렀을 때 둘 다 이 함수를 공용으로 사용함.
async function applyBarcodeGraphicResult(barcodeRaw, it, myGen){
  const out = { found: [], failed: !barcodeRaw, gs1: null };
  if(!barcodeRaw) return out;
  const gs1Result = parseGs1Raw(barcodeRaw);
  out.gs1 = gs1Result;
  if(!gs1Result.lot && !gs1Result.expiryDate && !gs1Result.gtin){
    out.failed = true;
    return out;
  }
  const lotElBc = document.getElementById('al_lot');
  const expElBc = document.getElementById('al_expiryDate');
  if(gs1Result.lot && lotElBc && (!lotElBc.value.trim() || lotFieldAutoFilled)){
    lotElBc.value = gs1Result.lot;
    lotFieldAutoFilled = true;
    out.found.push(`LOT(바코드스캔) ${gs1Result.lot}`);
    await checkBlockBatchForLot(it.productCode, gs1Result.lot);
  }
  if(gs1Result.expiryDate && expElBc && (!expElBc.value.trim() || expFieldAutoFilled)){
    expElBc.value = gs1Result.expiryDate;
    expFieldAutoFilled = true;
    out.found.push(`유효기간(바코드스캔) ${gs1Result.expiryDate}`);
  }
  if(gs1Result.gtin){
    const masterHit = await window.fbGetProductMaster(gs1Result.gtin.slice(-6));
    if(lotDraftGen !== myGen) return out;
    if(masterHit && masterHit.productCode){
      const bcMatch = compareCodeMatch(masterHit.productCode, it.productCode, 6);
      if(bcMatch === 'match'){
        out.found.push('바코드 제품코드 일치 확인');
      } else if(bcMatch === 'ambiguous'){
        out.found.push(`🔎 바코드 매핑 코드(${masterHit.productCode}) 뒷자리만 겹쳐요 - 아래 제품코드 검색으로 확인해주세요`);
      } else {
        out.found.push(`⚠️ 바코드 매핑 제품코드(${masterHit.productCode})가 예정 제품코드와 달라요`);
        lotDraftMismatch = { scannedCode: masterHit.productCode, expectedCode: it.productCode, source: '바코드' };
      }
    }
  }
  return out;
}

// 인식 실패한 사진에서 바코드가 있는 부분만 손가락으로 잘라 다시 시도할 수 있는 모달.
// 배경(라벨 글자·다른 무늬)이 없어지므로 자동 다중시도로도 안 되던 사진이 성공하는 경우가 많음.
function openBarcodeCropRetry(dataUrl, onCode){
  closeOverlay('bcCropOverlay');
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'bcCropOverlay';
  overlay.innerHTML = `<div class="modal" style="padding-top:16px;">
    <h2>✂️ 바코드 영역 선택</h2>
    <div class="hint" style="margin-bottom:10px;">바코드 막대가 있는 부분만 손가락으로 드래그해서 네모로 감싸주세요. 배경 글자·무늬가 빠질수록 인식이 잘돼요.</div>
    <div id="bcCropStage" style="position:relative; width:100%; max-height:58vh; overflow:hidden; border-radius:10px; border:1px solid var(--line); background:#111; touch-action:none;">
      <img id="bcCropImg" src="${dataUrl}" style="display:block; width:100%; height:auto; user-select:none; pointer-events:none;">
      <div id="bcCropBox" style="position:absolute; border:2px solid var(--amber); background:rgba(180,83,10,0.18); display:none; pointer-events:none;"></div>
    </div>
    <div id="bcCropStatus" class="hint" style="margin-top:8px; display:none;"></div>
    <div class="modal-actions" style="margin-top:12px;">
      <button class="btn-cancel" id="bcCropCancel">취소</button>
      <button class="btn-submit" id="bcCropGo" disabled>이 영역으로 재시도</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('bcCropOverlay'); });
  document.getElementById('bcCropCancel').addEventListener('click', ()=> closeOverlay('bcCropOverlay'));

  const stage = document.getElementById('bcCropStage');
  const box = document.getElementById('bcCropBox');
  const goBtn = document.getElementById('bcCropGo');
  let startX = 0, startY = 0, dragging = false, rect = null;

  function pointFromEvent(e){
    const r = stage.getBoundingClientRect();
    const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
    const y = Math.min(Math.max(e.clientY - r.top, 0), r.height);
    return { x, y, w: r.width, h: r.height };
  }

  stage.addEventListener('pointerdown', (e)=>{
    const p = pointFromEvent(e);
    startX = p.x; startY = p.y; dragging = true;
    box.style.display = 'block';
    box.style.left = startX + 'px'; box.style.top = startY + 'px';
    box.style.width = '0px'; box.style.height = '0px';
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
  });
  stage.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const p = pointFromEvent(e);
    const x = Math.min(p.x, startX), y = Math.min(p.y, startY);
    const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
    box.style.left = x + 'px'; box.style.top = y + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    rect = { x: x / p.w, y: y / p.h, w: w / p.w, h: h / p.h };
    goBtn.disabled = !(w > 24 && h > 24);
  });
  const endDrag = ()=>{ dragging = false; };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  goBtn.addEventListener('click', async ()=>{
    if(!rect) return;
    const statusEl = document.getElementById('bcCropStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = '🔄 잘라낸 영역에서 바코드 인식 중...';
    goBtn.disabled = true;
    // 선택 영역 가장자리에 여백을 살짝 더 줘서 바코드 끝부분이 잘리지 않게 보정
    const pad = 0.03;
    const padded = {
      x: Math.max(0, rect.x - pad), y: Math.max(0, rect.y - pad),
      w: Math.min(1 - Math.max(0, rect.x - pad), rect.w + pad * 2),
      h: Math.min(1 - Math.max(0, rect.y - pad), rect.h + pad * 2)
    };
    try{
      const code = await decodeBarcodeFromCrop(dataUrl, padded);
      // [버그수정] Quagga가 종이질감/인쇄선 등을 바코드로 잘못 읽어서 "21744068" 같은 의미없는
      // 값을 내놓는 경우가 있었음(오탐). code가 있다고 무조건 성공 처리하지 말고, 실제 GS1
      // 필드(GTIN/LOT/유효기간) 중 하나라도 뽑혔을 때만 진짜 성공으로 인정함.
      const parsed = code ? parseGs1Raw(code) : null;
      const valid = !!(parsed && (parsed.gtin || parsed.lot || parsed.expiryDate));
      if(valid){
        closeOverlay('bcCropOverlay');
        onCode(code);
      } else if(code){
        statusEl.textContent = `⚠️ 뭔가 읽히긴 했는데(${code}) GS1 형식이 아니에요 - 오탐일 수 있어요. 바코드 막대만 더 딱 맞게 감싸서 다시 시도해보세요.`;
        goBtn.disabled = false;
      } else {
        statusEl.textContent = '❌ 이 영역에서도 인식 못 했어요. 영역을 조금 더 넓게(또는 다르게) 다시 선택해보세요.';
        goBtn.disabled = false;
      }
    }catch(err){
      console.error('크롭 재인식 실패:', err);
      statusEl.textContent = '❌ 인식 중 오류가 났어요. 다시 시도해주세요.';
      goBtn.disabled = false;
    }
  });
}

// 바코드에서 나온 원시 GS1 문자열(괄호 없이 AI코드+값이 붙어있는 형태)에서 GTIN/LOT/유효기간을 뽑아냄
// GTIN(14자리 고정)을 먼저 소비하고 나머지에서 순차적으로 AI를 찾음 - 그냥 정규식으로 전체를 훑으면
// GTIN 숫자 안에서 우연히 "10"이 나와 LOT을 잘못 잡는 문제가 있어서 순차 파싱 방식으로 처리함
function parseGs1Raw(raw){
  const result = { gtin: '', lot: '', expiryDate: '' };
  if(!raw) return result;
  let s = raw.replace(/[()]/g, ''); // 혹시 괄호가 포함돼 있으면 제거
  const m01 = s.match(/^0?1(\d{14})/); // 맨앞 "01"(간혹 O/0 오인식 보정)
  if(m01){
    result.gtin = m01[1];
    s = s.slice(s.indexOf(m01[1]) + 14);
  }
  let guard = 0;
  while(s.length > 0 && guard < 50){
    guard++;
    if(s.startsWith('17') && /^\d{6}/.test(s.slice(2))){
      const d = s.slice(2, 8);
      const yy = parseInt(d.slice(0,2), 10);
      const yyyy = yy < 70 ? 2000 + yy : 1900 + yy;
      result.expiryDate = formatExpiryParts(yyyy, parseInt(d.slice(2,4),10), parseInt(d.slice(4,6),10));
      s = s.slice(8);
    } else if(s.startsWith('10')){
      const rest = s.slice(2);
      const nextAiIdx = rest.search(/17\d{6}/);
      if(nextAiIdx !== -1){
        result.lot = rest.slice(0, nextAiIdx);
        s = rest.slice(nextAiIdx);
      } else {
        result.lot = rest;
        s = '';
      }
    } else {
      s = s.slice(1); // 못 알아본 문자(FNC1 제어문자 등)는 건너뜀
    }
  }
  // 바코드 그래픽 디코딩이 부분적으로 깨지면 LOT에 따옴표·플러스·느낌표 같은 이상한 문자가 섞여 들어올 수 있음.
  // 실제 GS1 LOT은 영문/숫자(+하이픈) 조합만 나오므로, 그 외 문자가 섞이면 신뢰할 수 없는 값으로 보고 버림 (오탐 방지)
  if(result.lot && !/^[A-Za-z0-9\-]{1,20}$/.test(result.lot)){
    result.lot = '';
  }
  return result;
}

// 제품코드: REF/REF NO/REF NO./REF NUMBER/제품코드/제품 코드 라벨을 우선 찾고, 라벨 바로 뒤 또는 다음 줄의 값을 가져옴
// 하이픈(-)·슬래시(/)·점(.) 포함 코드도 지원. 실패 시 기존 F로 시작하는 코드 패턴으로 폴백.
const REF_LABELS = ['REF NO.', 'REF NO', 'REF NUMBER', 'REF', '제품코드', '제품 코드'];

// 라인 안에서 코드처럼 생긴 토큰(영문/숫자 + 하이픈·슬래시·점)을 찾음. 구분자 빼고 4자 이상이어야 인정 (오탐 방지)
function matchCodeToken(line){
  if(!line) return '';
  const matches = line.match(/[A-Za-z0-9]+(?:[-\/.][A-Za-z0-9]+)*/g) || [];
  for(const m of matches){
    if(m.replace(/[-\/.]/g, '').length >= 4) return m.toUpperCase();
  }
  return '';
}

// 순수 숫자이면서 "19xx"/"20xx"로 시작하는 4~8자리 토큰은 제조연월·유효기간 같은 날짜일 가능성이 높아서 LOT 후보에서 제외
function looksLikeDateToken(tok){
  const clean = tok.replace(/[-\/.]/g, '');
  return /^(19|20)\d{2}\d{0,4}$/.test(clean);
}

// LOT 전용 토큰 매처: 날짜형 토큰은 걸러내고, 영문이 섞인 토큰(실제 LOT은 보통 영문+숫자 조합)을 우선함.
// 순수 숫자 LOT도 있을 수 있어서 완전히 배제하진 않고, 영문 포함 후보가 없을 때만 폴백으로 사용.
function matchLotToken(line){
  if(!line) return '';
  const matches = line.match(/[A-Za-z0-9]+(?:[-\/.][A-Za-z0-9]+)*/g) || [];
  const candidates = matches.filter(m => m.replace(/[-\/.]/g, '').length >= 4 && !looksLikeDateToken(m));
  if(candidates.length === 0) return '';
  const withLetter = candidates.find(m => /[A-Za-z]/.test(m));
  return (withLetter || candidates[0]).toUpperCase();
}

function findValueNearLabel(lines, upperLines, labelUp, matcher){
  for(let i = 0; i < lines.length; i++){
    const idx = upperLines[i].indexOf(labelUp);
    if(idx === -1) continue;
    const rest = lines[i].slice(idx + labelUp.length).trim();
    let val = matcher(rest);
    if(!val){
      // 라벨보다 값이 앞에 오는 라벨 배치도 있음 (예: "G5UM221 LOT" - 값이 왼쪽, 박스라벨이 오른쪽)
      // 같은 줄 안의 후보이므로, 완전히 다른 줄로 건너뛰는 것보다 우선순위가 높음
      const before = lines[i].slice(0, idx).trim();
      val = matcher(before);
    }
    if(!val){
      // OCR이 줄을 쪼개면서 라벨이 값보다 "아래" 줄에 오는 경우도 흔함 (예: 값 줄 → 다음 줄에 라벨만 인식)
      // 가까운 줄부터: 바로 위 → 바로 아래 → 위위 → 아래아래 순으로 확인
      const offsets = [-1, 1, -2, 2];
      for(const off of offsets){
        if(val) break;
        if(lines[i + off]) val = matcher(lines[i + off]);
      }
    }
    if(val) return val;
  }
  return '';
}

// GS1 바코드 밑에 인쇄되는 "사람이 읽는 텍스트"(HRI)를 통째로 파싱함: (01)GTIN(10)LOT(17)유효기간
// 라벨 글자("LOT", "유효기간" 등)가 전혀 없어도, 이 괄호+숫자 코드만으로 3개 값을 한번에 뽑아낼 수 있음.
// 순서가 뒤바뀌거나 일부만 있어도 되도록 각 AI코드를 독립적으로 찾음. 줄바꿈/공백은 OCR이 임의로 넣을 수 있어서 제거하고 검사.
function extractGs1FromOcrText(text){
  const result = { gtin: '', lot: '', expiryDate: '' };
  if(!text) return result;
  const flat = text.replace(/\s+/g, '');

  const gtinM = flat.match(/\(01\)(\d{14})/);
  if(gtinM) result.gtin = gtinM[1];

  const expM = flat.match(/\(17\)(\d{6,8})/);
  if(expM){
    const raw = expM[1];
    let y, mo, d;
    if(raw.length >= 8){
      y = parseInt(raw.slice(0,4), 10); mo = parseInt(raw.slice(4,6), 10); d = parseInt(raw.slice(6,8), 10);
    } else {
      y = 2000 + parseInt(raw.slice(0,2), 10); mo = parseInt(raw.slice(2,4), 10); d = parseInt(raw.slice(4,6), 10);
    }
    if(mo >= 1 && mo <= 12) result.expiryDate = formatExpiryParts(y, mo, d || null);
  }

  // (10) 다음 값은 다음 AI코드(괄호+2자리숫자)가 나오기 전까지, 없으면 끝까지 (최대 15자)
  const lotM = flat.match(/\(10\)([A-Za-z0-9]{2,15}?)(?=\(\d{2}\)|$)/);
  if(lotM && lotM[1]) result.lot = lotM[1].toUpperCase();

  return result;
}

function extractProductCodeGuess(text){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const upperLines = lines.map(l => l.toUpperCase());
  for(const label of REF_LABELS){
    const val = findValueNearLabel(lines, upperLines, label.toUpperCase(), matchCodeToken);
    if(val) return val;
  }
  const fMatch = text.match(/\bF\d{5,10}\b/);
  return fMatch ? fMatch[0] : '';
}

// LOT/제조번호: LOT/LOT NO/LOT NO./LOT NUMBER/BATCH/BATCH NO/BATCH NUMBER/제조번호/제조 번호 라벨 우선 탐색.
// GS1 사람인식 텍스트 (10)LOTVALUE 형식도 지원. 라벨을 못 찾으면 무작위 숫자를 넣지 않고 빈값으로 남김(오인식 방지).
const LOT_LABELS = ['LOT NUMBER', 'LOT NO.', 'LOT NO', 'BATCH NUMBER', 'BATCH NO.', 'BATCH NO', 'LOT', 'BATCH', '제조번호', '제조 번호'];

function extractLotGuess(text){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const upperLines = lines.map(l => l.toUpperCase());
  for(const label of LOT_LABELS){
    const val = findValueNearLabel(lines, upperLines, label.toUpperCase(), matchLotToken);
    if(val) return val;
  }
  const gs1 = extractGs1FromOcrText(text);
  if(gs1.lot) return gs1.lot;
  return '';
}

// 유효기간: 월의 마지막 날짜를 정확히 계산 (윤년 포함) - 하드코딩 없이 JS Date로 계산
function getLastDayOfMonth(year, month){
  return new Date(year, month, 0).getDate();
}

function formatExpiryParts(y, mo, d){
  const mm = String(mo).padStart(2, '0');
  if(d){
    return `${y}.${mm}.${String(d).padStart(2, '0')}`;
  }
  const lastDay = getLastDayOfMonth(y, mo);
  return `${y}.${mm}.${String(lastDay).padStart(2, '0')}`;
}

// 한 줄에서 YYYY-MM-DD / YYYY.MM.DD / YYYY/MM/DD 또는 YYYY-MM / YYYY.MM / YYYY/MM 형태의 날짜를 찾음
function matchDateFlexible(line){
  if(!line) return null;
  let m = line.match(/(20\d{2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/);
  if(m) return { y: +m[1], mo: +m[2], d: +m[3] };
  m = line.match(/(20\d{2})\s*[.\-\/]\s*(\d{1,2})(?!\d)/);
  if(m) return { y: +m[1], mo: +m[2], d: null };
  return null;
}

// 유효기간: EXP/EXP DATE/EXP.DATE/EXPIRY/EXPIRATION/USE BY/유효기간/유효일자/사용기한 라벨을 우선 탐색.
// MFG·MFD·제조일 라벨은 절대 유효기간으로 쓰지 않음 (라벨 자체를 EXP 계열만 검색하므로 구조적으로 방지됨).
// 라벨을 못 찾으면 전체에서 아무 날짜나 가져오지 않고 빈값으로 남김.
const EXP_LABELS = ['EXP DATE', 'EXP.DATE', 'EXPIRY DATE', 'EXPIRATION DATE', 'USE BY', 'EXPIRY', 'EXPIRATION', 'EXP', '유효기간', '유효일자', '사용기한'];

function extractExpiryGuess(text){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const upperLines = lines.map(l => l.toUpperCase());
  for(const label of EXP_LABELS){
    const labelUp = label.toUpperCase();
    for(let i = 0; i < lines.length; i++){
      const idx = upperLines[i].indexOf(labelUp);
      if(idx === -1) continue;
      const rest = lines[i].slice(idx + labelUp.length);
      let dp = matchDateFlexible(rest) || matchDateFlexible(lines[i]);
      if(!dp){
        for(let off = 1; off <= 2 && !dp; off++){
          if(lines[i + off]) dp = matchDateFlexible(lines[i + off]);
        }
      }
      if(dp) return formatExpiryParts(dp.y, dp.mo, dp.d);
    }
  }
  // 라벨(사용기한/유효기간 등)을 못 찾은 경우 - GS1 바코드 밑에 찍힌 (17)유효기간 코드를 직접 찾아봄
  // (라벨 글자가 아이콘으로만 표시돼서 텍스트가 아예 없는 실물 라벨에서도 이 코드는 대부분 같이 찍혀있음)
  const gs1 = extractGs1FromOcrText(text);
  if(gs1.expiryDate) return gs1.expiryDate;

  // 그래도 못 찾았으면, 사용기한은 항상 제조연월보다 나중 날짜라는 점(규정상 항상 성립)을 이용해서
  // 텍스트 전체에서 날짜를 다 찾아 가장 늦은 날짜를 사용기한으로 추정함.
  // 날짜가 1개뿐이면(제조연월만 잡힌 경우 등) 잘못 지정할 위험이 커서 폴백을 적용하지 않음.
  const allDates = [];
  for(const line of lines){
    const dp = matchDateFlexible(line);
    if(dp) allDates.push(dp);
  }
  if(allDates.length >= 2){
    const withTime = allDates.map(dp => ({ dp, t: new Date(dp.y, dp.mo - 1, dp.d || 1).getTime() }));
    withTime.sort((a,b) => b.t - a.t);
    const latest = withTime[0].dp;
    return formatExpiryParts(latest.y, latest.mo, latest.d);
  }
  return '';
}

// ===================== 제품 마스터(카탈로그) 유사도 매칭 ===================== //
// OCR로 읽은 제품코드 후보를 제품 마스터 전체와 비교해서 정확일치/유사후보를 찾음.
// 대소문자·공백·하이픈 차이는 무시하고, 그래도 다르면 편집거리로 유사도를 계산함 (숫자/영문 OCR 혼동 보정 포함).

// 제품코드 정규화 - 비교용으로만 사용 (원래 표기는 그대로 유지)
function normalizeCodeForMatch(s){
  if(!s) return '';
  return s.toString().toUpperCase().replace(/[\s\-_.\/]/g, '')
    .replace(/O/g, '0').replace(/I/g, '1').replace(/L/g, '1').replace(/S/g, '5').replace(/B/g, '8'); // 흔한 OCR 혼동 문자 보정
}

// 스캔/OCR로 읽은 코드와 예정 제품코드를 비교. 완전일치가 아니어도, 한쪽이 다른 쪽의 "뒷부분"과 정확히 겹치면
// (예: OCR이 앞자리 F를 놓쳐서 "00005444"만 읽음 → 예정코드 "F00005444"의 뒷부분과 정확히 일치) 같은 제품으로 인정함.
// 단, 겹치는 길이가 너무 짧으면(예: 4자리만) 다른 제품과도 우연히 겹칠 수 있어서 "애매함"으로 분류해 자동 확정하지 않음.
// 반환: 'match' | 'ambiguous' | 'mismatch'
function compareCodeMatch(scanned, expected, minConfidentOverlap){
  const ns = normalizeCodeForMatch(scanned);
  const ne = normalizeCodeForMatch(expected);
  if(!ns || !ne) return 'mismatch';
  if(ns === ne) return 'match';
  const overlapLen = Math.min(ns.length, ne.length);
  const suffixOverlaps = ne.endsWith(ns) || ns.endsWith(ne);
  if(suffixOverlaps){
    return overlapLen >= (minConfidentOverlap || 6) ? 'match' : 'ambiguous';
  }
  return 'mismatch';
}

// 카탈로그 전체에서 OCR 후보 코드와 가장 비슷한 항목들을 찾아 점수순으로 반환
// 반환: [{code, name, score}] - score 0이면 정확일치, 클수록 덜 비슷함. limit개까지.
function findCatalogMatches(catalog, candidateCode, limit){
  if(!catalog || catalog.length === 0 || !candidateCode) return [];
  const normCandidate = normalizeCodeForMatch(candidateCode);
  if(!normCandidate) return [];
  const scored = catalog.map(item => {
    const normItem = normalizeCodeForMatch(item.code);
    let score;
    if(normItem === normCandidate) score = 0;
    else score = levenshtein(normItem, normCandidate);
    return { code: item.code, name: item.name, score };
  });
  return scored
    .filter(s => s.score <= 3) // 너무 다른 건 후보에서 제외 (오탐 방지)
    .sort((a,b) => a.score - b.score)
    .slice(0, limit || 5);
}

// 제품명 텍스트(OCR 전체 텍스트)에서 카탈로그 제품명과 겹치는 단어가 있는 항목을 찾음 (코드 후보가 아예 없을 때 보조용)
function findCatalogMatchesByName(catalog, ocrText, limit){
  if(!catalog || catalog.length === 0 || !ocrText) return [];
  const upper = ocrText.toUpperCase();
  const scored = [];
  for(const item of catalog){
    if(!item.name) continue;
    const nameUp = item.name.toUpperCase();
    // 제품명에서 3자 이상인 토큰들이 OCR 텍스트에 포함되는지 확인
    const tokens = nameUp.split(/[^A-Z0-9가-힣]+/).filter(t => t.length >= 3);
    const hitCount = tokens.filter(t => upper.includes(t)).length;
    if(hitCount > 0) scored.push({ code: item.code, name: item.name, score: -hitCount }); // 많이 겹칠수록 우선(score 작을수록 우선)
  }
  return scored.sort((a,b) => a.score - b.score).slice(0, limit || 5);
}

    const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const parsed = lines.map(line => {
      const cols = line.split('\t').length > 1 ? line.split('\t') : line.split(',');
      const key = (cols[0] || '').trim().replace(/\D/g, '').slice(-6);
      const code = (cols[1] || '').trim();
      const name = (cols[2] || '').trim();
      const unit = (cols[3] || '').trim();
      return { key, code, name, unit, valid: !!key && !!code };
    });
    const valid = parsed.filter(p => p.valid);
    if(valid.length === 0){ document.getElementById('pcbb_err').style.display = 'block'; return; }
    document.getElementById('pcbb_err').style.display = 'none';
    const btn2 = document.getElementById('pcbb_bulkAddBtn');
    btn2.disabled = true; btn2.textContent = `등록 중... (0/${valid.length})`;
    const existingCatalog = await window.fbListCatalogItems();
    const catalogCodes = new Set(existingCatalog.map(c => c.code));
    let successCount = 0;
    for(let i = 0; i < valid.length; i++){
      const p = valid[i];
      const ok = await window.fbSaveProductMaster(p.key, p.code, p.name, p.unit, myName);
      if(ok){
        successCount++;
        if(!catalogCodes.has(p.code) && p.name){ await window.fbSaveCatalogItem(p.code, p.name, myName); catalogCodes.add(p.code); }
      }
      btn2.textContent = `등록 중... (${i+1}/${valid.length})`;
    }

    showToast(`${successCount}/${valid.length}건 일괄 등록 완료${parsed.length - valid.length > 0 ? ` (형식 오류 ${parsed.length - valid.length}건 제외)` : ''}`);
    document.getElementById('pcbb_bulkBox').value = '';

  });

    showToast(ok ? `${toAdd.length}건 일괄 등록 완료` : '일부 등록에 실패했어요');

      document.getElementById('pcPasteBox').value = '';
      document.getElementById('pcBulkPreviewWrap').style.display = 'none';

      loadCatalogList();

function parseCatalogText(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if(lines.length === 0) return [];
  let dataLines = lines;
  const firstCols = lines[0].split(/\t|,/).map(c => c.trim());
  if(firstCols.join(' ').includes('제품코드') || firstCols.join(' ').includes('제품명')) dataLines = lines.slice(1);
  return dataLines.map(line => {
    const cols = line.split('\t').length > 1 ? line.split('\t') : line.split(',');
    const code = (cols[0] || '').trim();
    const name = (cols[1] || '').trim();
    const valid = !!code && !!name;
    return { code, name, valid, include: valid };
  });
}

function renderCatalogPreview(){
  const validCount = catalogBulkRows.filter(r => r.valid).length;
  document.getElementById('pcPreviewSummary').innerHTML =
    `총 <b>${catalogBulkRows.length}</b>행 인식 · 유효 <b>${validCount}</b>건${catalogBulkRows.length - validCount > 0 ? ` · 코드/이름 누락 ${catalogBulkRows.length - validCount}건은 제외됐어요` : ''}`;
  const table = document.getElementById('pcPreviewTable');
  table.innerHTML = `
    <thead><tr><th></th><th>제품코드</th><th>제품명</th></tr></thead>
    <tbody>
      ${catalogBulkRows.map((r, i) => `
        <tr class="${r.valid ? '' : 'invalid'}">
          <td class="chk"><input type="checkbox" ${r.include ? 'checked' : ''} ${r.valid ? '' : 'disabled'} onchange="catalogBulkRows[${i}].include=this.checked"></td>
          <td>${escapeHtml(r.code) || '-'}</td>
          <td>${escapeHtml(r.name) || '-'}</td>
        </tr>`).join('')}
    </tbody>`;
}

// ===================== 마스터 공용 엑셀 내보내기 헬퍼 ===================== //
function exportRowsToExcel(rows, sheetName, filenamePrefix){
  if(!rows || rows.length === 0){ showToast('내보낼 항목이 없어요'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `${filenamePrefix}_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.xlsx`);
  showToast(`${rows.length}건 엑셀로 다운로드 완료`);
}

function exportMasterListToExcel(){
  const rows = (masterListCache || []).map(it => ({
    '바코드끝6자리': it.key || '', '제품코드': it.productCode || '', '제품명': it.productName || '', '단위': it.unit || ''
  }));
  exportRowsToExcel(rows, '바코드매핑', '바코드매핑마스터');
}

function exportCatalogToExcel(){
  const rows = (productCatalogCache || []).map(it => ({ '제품코드': it.code || '', '제품명': it.name || '' }));
  exportRowsToExcel(rows, '제품마스터', '제품마스터');
}

function exportPartnerToExcel(){

      const code = (cols[1] || '').trim();
      const name = (cols[2] || '').trim();
      const unit = (cols[3] || '').trim();
      return { key, code, name, unit, valid: !!key && !!code };
    });
    const valid = parsed.filter(p => p.valid);
    if(valid.length === 0){ document.getElementById('mm_bulk_err').style.display = 'block'; return; }
    document.getElementById('mm_bulk_err').style.display = 'none';
    const btn = document.getElementById('mm_bulkAddBtn');
    btn.disabled = true; btn.textContent = `등록 중... (0/${valid.length})`;
    let successCount = 0;
    for(let i = 0; i < valid.length; i++){
      const p = valid[i];
      const ok = await window.fbSaveProductMaster(p.key, p.code, p.name, p.unit, myName);
      if(ok){ successCount++; await ensureCatalogHasCode(p.code, p.name, myName); }
      btn.textContent = `등록 중... (${i+1}/${valid.length})`;
    }
    btn.disabled = false; btn.textContent = '일괄 등록';
    showToast(`${successCount}/${valid.length}건 일괄 등록 완료${parsed.length - valid.length > 0 ? ` (형식 오류 ${parsed.length - valid.length}건 제외)` : ''}`);
    document.getElementById('mm_bulkBox').value = '';
    loadMasterList();
  });

  document.getElementById('mm_addBtn').addEventListener('click', async ()=>{
    const key = document.getElementById('mm_key').value.trim();
    const code = document.getElementById('mm_code').value.trim();
    const name = document.getElementById('mm_name').value.trim();
    const unit = document.getElementById('mm_unit').value;
    if(!key || !code){ document.getElementById('mm_err').style.display = 'block'; return; }
    document.getElementById('mm_err').style.display = 'none';
    const ok = await window.fbSaveProductMaster(key, code, name, unit, myName);
    if(ok) await ensureCatalogHasCode(code, name, myName);
    showToast(ok ? '마스터에 저장됐어요' : '저장에 실패했어요');
    if(ok){
      document.getElementById('mm_key').value = '';
      document.getElementById('mm_code').value = '';
      document.getElementById('mm_name').value = '';
      document.getElementById('mm_unit').value = '';

function renderMasterCrossRef(codeValue){
  const el = document.getElementById('mm_crossRef');
  if(!el) return;
  const q = (codeValue || '').trim();
  if(!q){ el.style.display = 'none'; el.innerHTML = ''; return; }
  const catalogMatch = (catalogCrossCache || []).find(it => (it.code || '').toLowerCase() === q.toLowerCase());
  const sameCodeMappings = (masterListCache || []).filter(it => it.productCode === q);
  let html = '';
  if(catalogMatch) html += `<div class="hint" style="margin-top:5px;">📦 제품마스터에 등록된 이름: <b>${escapeHtml(catalogMatch.name)}</b></div>`;
  if(sameCodeMappings.length > 0){
    html += `<div class="hint" style="margin-top:3px;">🔗 이 제품코드로 이미 등록된 바코드 ${sameCodeMappings.length}건: ${sameCodeMappings.map(m => `끝${escapeHtml(m.key)}${m.unit ? `(${escapeHtml(m.unit)})` : ''}`).join(', ')}</div>`;
  }
  if(!html){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = 'block';
  el.innerHTML = html;
}

function parsePartnerText(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if(lines.length === 0) return [];
  let dataLines = lines;
  const firstCols = lines[0].split(/\t|,/).map(c => c.trim());
  if(firstCols.join(' ').includes('파트너')) dataLines = lines.slice(1); // 헤더행 자동 스킵
  return dataLines.map(line => {
    const cols = line.split('\t').length > 1 ? line.split('\t') : line.split(',');
    const code = (cols[0] || '').trim();
    const name = (cols[1] || '').trim();
    const valid = !!code && !!name;
    return { code, name, valid, include: valid };
  });
}

// ===================== 반품 예정 엑셀 일괄등록 ===================== //
// 주문번호=반품번호, 반품처코드/명=파트너마스터 연동(신규코드 자동등록), 제품코드/명=제품마스터 연동(신규코드 자동등록), 예정수량=expectedQuantity

function parseReturnExcelText(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if(lines.length === 0) return { rows: [], error: '' };
  const headerCols = lines[0].split('\t');
  const headerMap = {};
  headerCols.forEach((h,i)=>{ headerMap[h.trim()] = i; });
  const idx = (name) => headerMap[name] !== undefined ? headerMap[name] : -1;
  const iOrderNo = idx('주문번호');
  const iPartnerCode = idx('반품처코드');
  const iPartnerName = idx('반품처명');
  const iProductCode = idx('제품코드');
  const iProductName = idx('제품명');
  const iReason = idx('반품상세사유');
  const iStatus = idx('상태');
  const iQty = idx('예정수량');
  if(iOrderNo === -1 || iProductCode === -1){
    return { rows: [], error: '헤더에서 "주문번호"와 "제품코드" 열을 찾지 못했어요. 엑셀 첫 줄이 헤더인지 확인해주세요.' };
  }
  const dataLines = lines.slice(1);
  const rows = dataLines.map(line => {
    const cols = line.split('\t');
    return {
      returnNumber: (cols[iOrderNo] || '').trim(),
      partnerCode: iPartnerCode !== -1 ? (cols[iPartnerCode] || '').trim() : '',
      partnerName: iPartnerName !== -1 ? (cols[iPartnerName] || '').trim() : '',
      productCode: (cols[iProductCode] || '').trim(),
      productName: iProductName !== -1 ? (cols[iProductName] || '').trim() : '',
      reason: iReason !== -1 ? (cols[iReason] || '').trim() : '',
      excelStatus: iStatus !== -1 ? (cols[iStatus] || '').trim() : '',
      quantity: iQty !== -1 ? (cols[iQty] || '').trim() : ''
    };
  }).filter(r => r.returnNumber && r.productCode);
  return { rows, error: '' };
}

function groupExcelRowsByReturnNumber(rows){
  const map = new Map();
  for(const r of rows){
    if(!map.has(r.returnNumber)){
      map.set(r.returnNumber, { returnNumber: r.returnNumber, partnerCode: r.partnerCode, partnerName: r.partnerName, items: [] });
    }
    const rec = map.get(r.returnNumber);
    if(!rec.partnerCode && r.partnerCode) rec.partnerCode = r.partnerCode;
    if(!rec.partnerName && r.partnerName) rec.partnerName = r.partnerName;
    rec.items.push({ id: genId(), productCode: r.productCode, productName: r.productName, expectedQuantity: r.quantity, reason: r.reason, excelStatus: r.excelStatus, lots: [] });
  }
  return [...map.values()];
}

let excelImportGroups = [];

// ===================== 새 반품 개별등록 (사진 없음 - 반품번호/반품처/품목만 입력, 엑셀등록의 1건 버전) ===================== //

let irItems = [];
let irSelectedPartnerCode = '';

// 파트너 검색창에서 클릭으로 선택했으면 그 코드를 우선 쓰고, 직접 "코드 이름" 형식으로 타이핑/붙여넣기 했으면
// 첫 토큰이 파트너마스터 코드와 일치하는지 확인해서 보정함. 둘 다 아니면 코드 없이(자유 입력) 빈값 반환.
function resolvePartnerCodeFromInput(value, selectedCode){
  const v = (value || '').trim();
  if(!v) return '';
  if(selectedCode){
    const match = (partnerMasterCache || []).find(p => p.code === selectedCode);
    if(match && v === `${match.code} ${match.name}`) return selectedCode;
  }
  const firstToken = v.split(/\s+/)[0];
  const codeHit = (partnerMasterCache || []).find(p => p.code === firstToken);
  if(codeHit) return codeHit.code;
  // [개선] "코드 이름" 형식으로 검색해서 선택해야만 인식되던 걸, 이름만 정확히 타이핑해도
  // 마스터에 그 이름을 가진 파트너가 1명뿐이면 자동으로 코드를 찾아주도록 함.
  // 동명이인이 여럿이면 자동으로 정할 수 없으니 그때만 검색해서 선택하라고 안내함.
  const nameMatches = (partnerMasterCache || []).filter(p => (p.name || '').trim() === v);
  if(nameMatches.length === 1) return nameMatches[0].code;
  return '';
}

// 기록에 partnerCode가 이미 있으면 그대로 쓰고, 없으면(코드 필드가 비어있던 예전 기록) hospitalName에 남아있는
// "코드 이름" 형태 텍스트에서 코드를 분리해내고 이름도 마스터의 깨끗한 이름으로 바꿔줌 (엑셀에 코드+이름 중복 방지)
function resolvePartnerForRecord(r, partnerList){
  if(r.partnerCode){
    const match = (partnerList || []).find(p => p.code === r.partnerCode);
    return { code: r.partnerCode, name: match ? match.name : (r.hospitalName || '') };
  }
  const hosp = (r.hospitalName || '').trim();
  if(hosp){
    const firstToken = hosp.split(/\s+/)[0];
    const hit = (partnerList || []).find(p => p.code === firstToken);
    if(hit) return { code: hit.code, name: hit.name };
  }
  return { code: '', name: r.hospitalName || '' };
}

// 병원명 입력창 바로 아래에 "이 코드로 저장됩니다" 실시간 피드백을 보여줌 - 저장 시점이 아니라 입력 중에 바로 검증되게
function renderPartnerPreview(elId, value, selectedCode){
  const el = document.getElementById(elId);
  if(!el) return;
  const v = (value || '').trim();
  if(!v){ el.style.display = 'none'; el.innerHTML = ''; return; }
  const code = resolvePartnerCodeFromInput(v, selectedCode);
  el.style.display = 'block';
  if(code){
    const match = (partnerMasterCache || []).find(p => p.code === code);
    el.innerHTML = `✅ 배송처코드 <b>${escapeHtml(code)}</b> 확인됨${match ? ' · ' + escapeHtml(match.name) : ''}`;
    el.className = 'partner-preview ok';
  } else {
    const nameMatches = (partnerMasterCache || []).filter(p => (p.name || '').trim() === v);
    if(nameMatches.length > 1){
      el.innerHTML = `⚠ 같은 이름의 파트너가 ${nameMatches.length}명 있어요(${nameMatches.map(p=>escapeHtml(p.code)).join(', ')}) - 검색해서 정확히 선택해주세요`;
    } else {
      el.innerHTML = `⚠ 파트너마스터에 없는 이름이에요 - 코드 없이 저장돼요 (검색해서 선택해주세요)`;
    }
    el.className = 'partner-preview warn';
  }
}

async function submitIndividualRegister(){
  const returnNumber = document.getElementById('ir_returnNumber').value.trim();
  const hospitalName = document.getElementById('ir_hospitalName').value.trim();
  const memo = document.getElementById('ir_memo').value.trim();
  const by = document.getElementById('ir_by').value.trim();
  if(!returnNumber || !by || irItems.length === 0){ document.getElementById('ir_err').style.display = 'block'; return; }
  document.getElementById('ir_err').style.display = 'none';

  const btn = document.getElementById('ir_submitBtn');
  btn.disabled = true; btn.textContent = '등록 중...';
  const partnerCode = resolvePartnerCodeFromInput(hospitalName, irSelectedPartnerCode);

  // 새 제품코드는 제품마스터에 자동 등록 (이름이 있을 때만)
  const existingCatalog = await window.fbListCatalogItems();
  const catalogMap = new Map(existingCatalog.map(c=>[c.code, c.name]));
  for(const it of irItems){
    if(catalogMap.has(it.productCode)) it.productName = catalogMap.get(it.productCode) || it.productName;
    else if(it.productCode && it.productName) await window.fbSaveCatalogItem(it.productCode, it.productName, by);
  }

  const existing = records.find(r => r.returnNumber === returnNumber && r.status !== 'confirmed');
  if(existing){
    const its = itemsOf(existing);
    for(const newIt of irItems){
      const match = its.find(x => x.productCode === newIt.productCode && isExcelItem(x));
      if(match){ match.expectedQuantity = newIt.expectedQuantity; }
      else { its.push(newIt); }
    }
    existing.items = its;
    if(!existing.hospitalName && hospitalName) existing.hospitalName = hospitalName;
    if(!existing.partnerCode && partnerCode) existing.partnerCode = partnerCode;
    if(!existing.memo && memo) existing.memo = memo;
    render();
    closeOverlay('irOverlay');
    await window.fbUpdateRecord(existing.id, { items: its, hospitalName: existing.hospitalName, partnerCode: existing.partnerCode, memo: existing.memo });
    await saveMyName(by);
    showToast('기존 반품번호에 품목을 추가했어요');
  } else {
    const rec = {
      id: genId(), returnNumber, hospitalName, partnerCode,
      items: irItems, memo, status: 'pending', source: 'manual',
      registeredBy: by, registeredAt: new Date().toISOString(),
      confirmedBy: null, confirmedAt: null, confirmMemo: null, photoCount: 0
    };
    records.push(rec);
    render();
    closeOverlay('irOverlay');
    await window.fbAddRecord(rec);
    await saveMyName(by);
    showToast('반품이 등록됐어요 - 검수대기에서 확인하세요');
  }
  btn.disabled = false; btn.textContent = '등록 완료';
}

async function openStartInspectModal(){
  closeOverlay('startInspectOverlay');
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'startInspectOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>반품번호로 검수 시작</h2>
    <div class="hint" style="margin-bottom:10px;">등록된 반품번호를 입력하거나, 인수증을 촬영하면 반품번호를 자동으로 인식해서 찾아드려요.</div>
    <div class="field"><label>반품번호</label><input id="si_returnNumber" type="text" autocomplete="off" placeholder="직접 입력 또는 아래에서 촬영"></div>
    <div class="hint" style="margin-bottom:6px;">📷 인수증 촬영해서 반품번호 자동 인식 (선택)</div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <button class="btn-cancel" style="flex:1;" id="si_cameraBtn">📷 카메라로 촬영</button>
      <button class="btn-cancel" style="flex:1;" id="si_galleryBtn">🖼 앨범에서 선택</button>
    </div>
    <input type="file" id="si_cameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="si_galleryInput" accept="image/*" style="display:none;">
    <div class="capture-zone" id="si_zone" style="display:none;"></div>
    <div id="si_progress" style="display:none;"><div class="ocr-progress">🔄 인식 중...</div></div>
    <div id="si_resultMsg" style="display:none;"></div>
    <div class="err" id="si_err">해당 반품번호의 등록 건을 찾지 못했어요 - 먼저 등록해주세요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('startInspectOverlay')">취소</button>
      <button class="btn-submit" id="si_findBtn">검수 시작</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('startInspectOverlay'); });

  let capturedReceiptImage = null;
  const zone = document.getElementById('si_zone');
  const cameraInput = document.getElementById('si_cameraInput');
  const galleryInput = document.getElementById('si_galleryInput');
  document.getElementById('si_cameraBtn').addEventListener('click', ()=> cameraInput.click());
  document.getElementById('si_galleryBtn').addEventListener('click', ()=> galleryInput.click());

  const processSiFile = (file)=>{
    const reader = new FileReader();
    reader.onload = async (e)=>{
      capturedReceiptImage = e.target.result;
      zone.style.display = 'block';
      zone.innerHTML = `<img src="${capturedReceiptImage}" alt="인수증">`;
      document.getElementById('si_progress').style.display = 'block';
      const { text, words } = await runReceiptOcr(capturedReceiptImage);
      document.getElementById('si_progress').style.display = 'none';
      const found = extractReturnNumberGuess(words, text);
      const resultEl = document.getElementById('si_resultMsg');
      resultEl.style.display = 'block';
      if(found){
        document.getElementById('si_returnNumber').value = found;
        resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--green); background:var(--green-bg); padding:8px 10px; border-radius:8px;">✅ 반품번호 ${escapeHtml(found)} 인식됨</div>`;
      } else {
        resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--danger); background:#FBEAE8; padding:8px 10px; border-radius:8px;">❌ 인식 안 됨 - 직접 입력해주세요</div>`;
      }
    };
    reader.readAsDataURL(file);
  };
  cameraInput.addEventListener('change', ()=>{ if(cameraInput.files.length) processSiFile(cameraInput.files[0]); });
  galleryInput.addEventListener('change', ()=>{ if(galleryInput.files.length) processSiFile(galleryInput.files[0]); });

  document.getElementById('si_findBtn').addEventListener('click', async ()=>{
    const rn = document.getElementById('si_returnNumber').value.trim();
    if(!rn){ showToast('반품번호를 입력하거나 촬영해주세요'); return; }
    const rec = records.find(r => r.returnNumber === rn);
    if(!rec){
      document.getElementById('si_err').style.display = 'block';
      return;
    }
    document.getElementById('si_err').style.display = 'none';
    // 인수증 사진을 촬영했으면 검수기록으로 첨부
    if(capturedReceiptImage){
      const c = await compressPhoto(capturedReceiptImage);
      const pid = await window.fbAddPhoto(rec.id, null, 'receipt', c);
      if(pid){
        rec.photoCount = (rec.photoCount || 0) + 1;
        await window.fbUpdateRecord(rec.id, { photoCount: rec.photoCount });
      }
    }
    closeOverlay('startInspectOverlay');
    openInspectModal(rec.id);
  });
}

function renderExcelImportPreview(){
  const totalItems = excelImportGroups.reduce((s,g)=>s+g.items.length, 0);
  document.getElementById('exPreviewSummary').innerHTML = `반품번호 <b>${excelImportGroups.length}</b>건 · 품목 <b>${totalItems}</b>건 인식됐어요`;
  const wrap = document.getElementById('exGroupsPreview');
  wrap.innerHTML = excelImportGroups.slice(0, 30).map(g => `
    <div class="item-card">
      <div class="it-name">${escapeHtml(g.returnNumber)}</div>
      <div class="it-meta">${escapeHtml(g.partnerCode||'-')} ${escapeHtml(g.partnerName||'')}</div>
      ${g.items.map(it => `<div class="it-meta">└ ${escapeHtml(it.productCode)} ${escapeHtml(it.productName||'')} · 예정 ${escapeHtml(it.expectedQuantity||'')}개</div>`).join('')}
    </div>`).join('') + (excelImportGroups.length > 30 ? `<div class="hint">외 ${excelImportGroups.length - 30}건 더...</div>` : '');
}

async function submitExcelImport(){
  const by = document.getElementById('ex_by').value.trim();
  if(!by){ showToast('등록자 이름을 입력해주세요'); return; }
  const btn = document.getElementById('exSubmitBtn');
  btn.disabled = true; btn.textContent = '등록 중...';

  const existingPartners = await window.fbListPartnerMaster();
  const existingCatalog = await window.fbListCatalogItems();
  const partnerSet = new Set(existingPartners.map(p=>p.code));
  const catalogMap = new Map(existingCatalog.map(c=>[c.code, c.name]));

  let createdCount = 0, mergedCount = 0;

  for(const g of excelImportGroups){
    if(g.partnerCode && !partnerSet.has(g.partnerCode)){
      await window.fbSavePartnerMaster(g.partnerCode, g.partnerName || g.partnerCode, by);
      partnerSet.add(g.partnerCode);
    }
    for(const it of g.items){
      if(catalogMap.has(it.productCode)){
        it.productName = catalogMap.get(it.productCode) || it.productName;
      } else if(it.productCode && it.productName){
        await window.fbSaveCatalogItem(it.productCode, it.productName, by);
        catalogMap.set(it.productCode, it.productName);
      }
    }

    const existing = records.find(r => r.returnNumber === g.returnNumber && r.status !== 'confirmed');
    if(existing){
      const its = itemsOf(existing);
      for(const newIt of g.items){
        const match = its.find(x => x.productCode === newIt.productCode && isExcelItem(x));
        if(match){ match.expectedQuantity = newIt.expectedQuantity; match.reason = newIt.reason; match.excelStatus = newIt.excelStatus; }
        else { its.push(newIt); }
      }
      existing.items = its;
      if(!existing.hospitalName && g.partnerName) existing.hospitalName = g.partnerName;
      await window.fbUpdateRecord(existing.id, { items: its, hospitalName: existing.hospitalName });
      mergedCount++;
    } else {
      const rec = {
        id: genId(), returnNumber: g.returnNumber, hospitalName: g.partnerName || '', partnerCode: g.partnerCode || '',
        items: g.items, memo: '', status: 'pending', source: 'excel',
        registeredBy: by, registeredAt: new Date().toISOString(),
        confirmedBy: null, confirmedAt: null, confirmMemo: null, photoCount: 0
      };
      records.push(rec);
      await window.fbAddRecord(rec);
      createdCount++;
    }
  }
  render();
  btn.disabled = false; btn.textContent = '예정등록 실행';
  closeOverlay('excelImportOverlay');
  await saveMyName(by);
  showToast(`반품 예정등록 완료 - 신규 ${createdCount}건, 기존 병합 ${mergedCount}건`);
}

// ===================== 실물검수 (엑셀예정 품목에 LOT 실측 추가) ===================== //

// 엑셀 예정등록 품목의 제품코드/제품명/예정수량 수정 - 예정정보가 바뀔 수 있어서 언제든 수정 가능해야 함
async function openEditExcelItemModal(recordId, itemId){
  closeOverlay('editExItemOverlay');
  const rec = records.find(r => r.id === recordId);
  if(!rec) return;
  const its = itemsOf(rec);
  const it = its.find(x => x.id === itemId);
  if(!it) return;

  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'editExItemOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>예정 품목 수정</h2>
    <div class="field" style="position:relative;">
      <label>제품코드 (제품 마스터 검색) *</label>
      <input id="eex_productCode" type="text" autocomplete="off" value="${escapeHtml(it.productCode||'')}">
      <div id="eex_productSuggest" class="suggest-box" style="display:none;"></div>
    </div>
    <div class="field"><label>제품명</label><input id="eex_productName" type="text" autocomplete="off" value="${escapeHtml(it.productName||'')}"></div>
    <div class="field"><label>예정수량 *</label><input id="eex_qty" type="text" autocomplete="off" value="${escapeHtml(String(it.expectedQuantity||''))}"></div>
    <div class="hint">이미 확인된 LOT(${Array.isArray(it.lots)?it.lots.length:0}건)은 그대로 유지돼요.</div>
    <div class="err" id="eex_err">제품코드와 예정수량은 필수예요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('editExItemOverlay')">취소</button>
      <button class="btn-submit" id="eex_saveBtn">저장</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('editExItemOverlay'); });

  const codeInput = document.getElementById('eex_productCode');
  const codeSuggest = document.getElementById('eex_productSuggest');
  const nameInput = document.getElementById('eex_productName');
  window.fbListCatalogItems().then(list => { productCatalogCache = list; });
  codeInput.addEventListener('input', ()=> renderSuggestBox(productCatalogCache, codeInput.value, codeSuggest, codeInput, (item)=> item.code));
  codeInput.addEventListener('itemselected', (e)=>{ if(e.detail && e.detail.name) nameInput.value = e.detail.name; });
  codeInput.addEventListener('focus', ()=>{ if(codeInput.value.trim()) renderSuggestBox(productCatalogCache, codeInput.value, codeSuggest, codeInput, (item)=> item.code); });
  document.addEventListener('click', function hideOnOutside(e){
    if(!codeSuggest.contains(e.target) && e.target !== codeInput){ codeSuggest.style.display = 'none'; }
  });

  document.getElementById('eex_saveBtn').addEventListener('click', async ()=>{
    const productCode = codeInput.value.trim();
    const qty = document.getElementById('eex_qty').value.trim();
    if(!productCode || !qty){ document.getElementById('eex_err').style.display = 'block'; return; }
    const idx = its.findIndex(x => x.id === itemId);
    its[idx] = { ...it, productCode, productName: nameInput.value.trim(), expectedQuantity: qty };
    rec.items = its;
    render();
    closeOverlay('editExItemOverlay');
    const ok = await window.fbUpdateRecord(recordId, { items: its });
    showToast(ok ? '품목이 수정됐어요' : '수정됐지만 저장에 실패했어요');
    if(document.getElementById('insp_itemsList')) renderInspectItemsList(recordId);
    if(document.getElementById('er_itemsList')) renderEditRecordItemsList(recordId);
  });
}

// 실물검수 모달 상단 배지(부분입고/입고완료)와 하단 완료버튼의 활성/비활성 상태를 매번 다시 계산해서 반영.
// LOT추가·실물없음등록·삭제 등 품목이 바뀔 때마다(renderInspectItemsList 안에서) 같이 호출돼서 항상 최신 상태를 보여줌.
function refreshInspectHeader(recordId){
  const rec = records.find(r => r.id === recordId);
  const badgeEl = document.getElementById('insp_recvBadge');
  const btn = document.getElementById('insp_completeBtn');
  if(!rec){ if(badgeEl) badgeEl.innerHTML = ''; return; }
  const recvInfo = recordReceivingLabel(rec);
  if(badgeEl){
    badgeEl.innerHTML = recvInfo
      ? `<span style="font-size:11px; font-weight:700; color:${recvInfo.color}; background:${recvInfo.bg}; padding:3px 9px; border-radius:8px;">${recvInfo.label === '입고완료' ? '✅' : '⏳'} ${recvInfo.label}</span>`
      : '';
  }
  if(btn){
    const ready = !recvInfo || recvInfo.label === '입고완료'; // 예정품목이 없는 건(예정외만 있는 건)은 수량 게이팅 대상이 아님
    btn.disabled = !ready;
    btn.style.opacity = ready ? '1' : '.5';
    btn.style.cursor = ready ? 'pointer' : 'not-allowed';
    btn.textContent = ready ? '검수완료 처리' : '검수완료 처리 (수량 미완료)';
  }
}

async function openInspectModal(recordId){
  closeOverlay('inspectOverlay');
  const rec = records.find(r => r.id === recordId);
  if(!rec) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'inspectOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>실물 검수 · ${escapeHtml(rec.returnNumber||'')}</h2>
    <div class="hint" style="margin-bottom:4px;">반품처: ${escapeHtml(rec.hospitalName||'-')}</div>
    <div id="insp_recvBadge" style="margin-bottom:10px;"></div>
    <div id="insp_itemsList"></div>
    <div style="display:flex; flex-direction:column; gap:8px; margin-top:18px;">
      <div style="display:flex; gap:10px;">
        <button class="btn-cancel" style="flex:1;" onclick="closeOverlay('inspectOverlay')">닫기</button>
        ${!isGuestMode ? `<button class="btn-submit" style="background:var(--blue); flex:1; white-space:nowrap;" id="insp_saveDraftBtn">💾 임시저장</button>` : ''}
      </div>
      ${!isGuestMode ? `<button class="btn-submit green" id="insp_completeBtn" style="width:100%;">검수완료 처리</button>` : ''}
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('inspectOverlay'); });
  renderInspectItemsList(recordId);
  refreshInspectHeader(recordId);

  const saveDraftBtn = document.getElementById('insp_saveDraftBtn');
  if(saveDraftBtn){
    saveDraftBtn.addEventListener('click', async ()=>{
      const its = itemsOf(rec);
      const ok = await window.fbUpdateRecord(recordId, { items: its, status: 'inprogress' });
      if(ok) rec.status = 'inprogress';
      closeOverlay('inspectOverlay');
      render();
      showToast(ok ? '임시저장 완료 - "진행중" 탭에서 이어서 검수할 수 있어요' : '임시저장에 실패했어요');
    });
  }

  const completeBtn = document.getElementById('insp_completeBtn');
  if(completeBtn){
    completeBtn.addEventListener('click', ()=>{
      const its = itemsOf(rec);
      // [정책변경] 수량이 덜 찬 상태에서 "그래도 완료"로 우회하던 걸 없앰. 실물이 없는 품목은
      // "📦 실물없음" 버튼으로 정식 등록(LOT=XXXXX·상태D·사유 남김)해야 수량이 채워짐 - 조용한 우회가 아니라
      // 반드시 기록이 남는 방식으로만 완료 가능하게 함.
      const incomplete = its.filter(it => isExcelItem(it) && (it.isUnexpected ? itemVerifiedQty(it) === 0 : itemVerifiedQty(it) < (parseFloat(it.expectedQuantity)||0)));
      if(incomplete.length > 0){
        const names = incomplete.map(it => it.productName || it.productCode).join(', ');
        showToast(`아직 수량이 덜 채워진 품목이 있어요: ${names} (실물없음 버튼으로 사유를 남기고 채워주세요)`);
        return;
      }
      const mismatchLots = [];
      its.forEach(it => {
        if(isExcelItem(it) && Array.isArray(it.lots)){
          it.lots.forEach(l => { if(l.codeMismatch) mismatchLots.push({ productName: it.productName || it.productCode, lot: l.lot, mismatch: l.codeMismatch }); });
        }
      });
      const proceedToConfirm = ()=>{ closeOverlay('inspectOverlay'); openConfirmModal(recordId); };
      if(mismatchLots.length > 0){
        const msg = mismatchLots.map(m => `- ${m.productName} · LOT ${m.lot}: ${m.mismatch.source}로 스캔된 코드(${m.mismatch.scannedCode})가 예정 코드(${m.mismatch.expectedCode})와 달라요`).join('\n');
        showAppConfirm(`⚠️ 제품코드가 다르게 스캔된 LOT이 ${mismatchLots.length}건 있어요:\n${msg}\n\n그래도 이대로 검수완료 처리할까요?`, '그래도 완료', proceedToConfirm);
      } else {
        proceedToConfirm();
      }
    });
  }
}

function renderInspectItemsList(recordId){
  const wrap = document.getElementById('insp_itemsList');
  if(!wrap) return;
  const rec = records.find(r => r.id === recordId);
  if(!rec) return;
  const its = itemsOf(rec);
  if(its.length === 0){ wrap.innerHTML = `<div class="hint" style="text-align:center; padding:10px 0;">등록된 품목이 없어요</div>`; refreshInspectHeader(recordId); return; }
  wrap.innerHTML = its.map(it => {
    if(isExcelItem(it)){
      const verified = itemVerifiedQty(it);
      const expected = parseFloat(it.expectedQuantity) || 0;
      const complete = it.isUnexpected ? verified > 0 : verified >= expected; // 예정외 품목(expectedQuantity 기본값 0)은 최소 1개는 확인해야 완료로 인정, 일반품목은 수정된 0도 인정
      const over = expected > 0 && verified > expected; // 예정보다 많이 확인된 경우 - 완료는 그대로 되지만 경고만 표시
      const lots = Array.isArray(it.lots) ? it.lots : [];
      return `<div class="item-card">
        <div class="it-name">${escapeHtml(it.productName || it.productCode)} ${complete ? '<span style="color:var(--green); font-weight:700;">✅ 완료</span>' : ''}${it.isUnexpected ? ' <span style="color:var(--amber); font-weight:700; font-size:10.5px;">➕예정외</span>' : ''}</div>
        <div class="it-lot">${escapeHtml(it.productCode)}</div>
        <div class="it-meta">예정 ${expected}개 · 확인 ${verified}개${it.reason ? ' · ' + escapeHtml(it.reason) : ''}</div>
        ${over ? `<div style="font-size:11.5px; font-weight:700; color:var(--amber); background:var(--amber-bg); padding:6px 10px; border-radius:8px; margin-top:6px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;">
          <span>⚠️ 예정수량보다 ${verified - expected}개 더 많아요 - 반품정보 수정이 필요할 수도 있어요</span>
          <button style="font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:6px; border:1px solid var(--amber); background:#fff; color:var(--amber); cursor:pointer; white-space:nowrap;" onclick="openEditExcelItemModal('${recordId}','${it.id}')">예정수량 수정</button>
        </div>` : ''}
        ${!isGuestMode ? `<div style="display:flex; gap:6px; margin-top:9px;">
          <button style="font-size:11px; padding:5px 9px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer;" onclick="openEditExcelItemModal('${recordId}','${it.id}')">수정</button>
          <button style="flex:1; background:var(--steel); color:#fff; border:1px solid var(--steel); font-weight:700; font-size:12.5px; padding:7px 10px; border-radius:6px; cursor:pointer;" onclick="openAddLotModal('${recordId}','${it.id}')">🔍 실물검수</button>
          <button style="font-size:11px; padding:5px 9px; border-radius:6px; border:1px solid var(--danger); background:#fff; color:var(--danger); font-weight:600; cursor:pointer;" onclick="openNoPhysicalModal('${recordId}','${it.id}')">📦 실물없음</button>
          ${it.isUnexpected ? `<button style="font-size:11px; padding:5px 9px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer;" onclick="deleteUnexpectedItem('${recordId}','${it.id}')">삭제</button>` : ''}
        </div>` : ''}
        ${lots.length > 0 ? `<div style="margin-top:8px; display:flex; flex-direction:column; gap:6px;">
          ${lots.map(l => {
            const st = l.status || 'A';
            return `<div style="display:flex; flex-direction:column; gap:4px; background:#fff; border:1px solid ${l.codeMismatch ? 'var(--danger)' : (l.blockBatch ? 'var(--steel-dark)' : 'var(--line)')}; border-radius:8px; padding:7px 10px; font-size:12px;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span><b>${escapeHtml(l.lot)}</b> · ${escapeHtml(l.expiryDate||'-')} · ${escapeHtml(String(l.quantity))}개 <span style="font-size:9.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st]||'var(--ink-muted)'}; padding:1px 6px; border-radius:8px;">${st}</span></span>
                ${!isGuestMode ? `<button class="btn-sm btn-del" style="padding:3px 8px;" onclick="deleteLotFromItem('${recordId}','${it.id}','${l.id}')">삭제</button>` : ''}
              </div>
              ${l.memo ? `<div style="font-size:11px; color:var(--ink-muted);">📝 ${escapeHtml(l.memo)}</div>` : ''}
              ${l.codeMismatch ? `<div style="font-size:11px; font-weight:700; color:var(--danger);">⚠️ ${escapeHtml(l.codeMismatch.source)}로 스캔된 코드(${escapeHtml(l.codeMismatch.scannedCode)})가 이 품목의 제품코드(${escapeHtml(l.codeMismatch.expectedCode)})와 달라요 - 실물을 다시 확인해주세요</div>` : ''}
              ${l.blockBatch ? `<div style="font-size:11px; font-weight:700; color:var(--steel-dark);">🚫 블락배치 LOT (상태 ${escapeHtml(l.blockBatch.status)})${l.blockBatch.memo ? ' · ' + escapeHtml(l.blockBatch.memo) : ''}</div>` : ''}
            </div>`;
          }).join('')}
        </div>` : `<div class="hint" style="margin-top:6px;">아직 확인된 LOT이 없어요</div>`}
      </div>`;
    }
    const st = it.status || 'A';
    return `<div class="item-card">
      <div class="item-card-top">
        <div>
          <div class="it-name">${escapeHtml(it.productName || it.productCode || '제품명 미입력')} <span style="font-size:10.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st]||'var(--ink-muted)'}; padding:2px 7px; border-radius:10px;">${st}</span></div>
          <div class="it-lot">LOT ${escapeHtml(it.lot||'-')}</div>
          <div class="it-meta">${it.expiryDate?'유효기간 '+escapeHtml(it.expiryDate):''}${it.quantity?' · 수량 '+escapeHtml(it.quantity):''}</div>
        </div>
        ${!isGuestMode ? `<div class="it-actions"><button onclick="closeOverlay('inspectOverlay'); openEditItemModal('${recordId}','${it.id}')">수정</button></div>` : ''}
      </div>
    </div>`;
  }).join('');
  if(!isGuestMode){
    wrap.innerHTML += `<button class="btn-cancel" style="width:100%; margin-top:10px;" onclick="openAddUnexpectedItemModal('${recordId}')">➕ 예정에 없는 품목 추가</button>`;
  }
  refreshInspectHeader(recordId);
}

// 반품처가 원래 등록 안 된 제품을 보내온 경우 - 실물검수 중 바로 새 품목으로 추가할 수 있게 함
function openAddUnexpectedItemModal(recordId){
  closeOverlay('addUnexpectedItemOverlay');
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'addUnexpectedItemOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>예정에 없는 품목 추가</h2>
    <div class="hint" style="margin-bottom:10px;">반품처가 원래 목록에 없던 제품을 같이 보낸 경우 여기서 바로 추가해요. 추가 후 LOT을 검수하면 돼요.</div>
    <div class="field" style="position:relative;">
      <label>제품코드 *</label>
      <input id="ui_code" type="text" autocomplete="off" placeholder="예: F00005444">
      <div id="ui_codeSuggest" class="suggest-box" style="display:none;"></div>
    </div>
    <div class="field"><label>제품명</label><input id="ui_name" type="text" autocomplete="off" placeholder="예: AV-Set ONLINEplus 5008-R"></div>
    <div class="err" id="ui_err">제품코드를 입력해주세요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('addUnexpectedItemOverlay')">취소</button>
      <button class="btn-submit" id="ui_addBtn">추가</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('addUnexpectedItemOverlay'); });

  const codeInput = document.getElementById('ui_code');
  const nameInput = document.getElementById('ui_name');
  const suggestBox = document.getElementById('ui_codeSuggest');
  window.fbListCatalogItems().then(list => { productCatalogCache = list; });
  codeInput.addEventListener('input', ()=> renderSuggestBox(productCatalogCache, codeInput.value, suggestBox, codeInput, (item)=> item.code));
  codeInput.addEventListener('itemselected', (e)=>{ if(e.detail && !nameInput.value.trim()) nameInput.value = e.detail.name || ''; });

  document.getElementById('ui_addBtn').addEventListener('click', async ()=>{
    const code = codeInput.value.trim();
    const name = nameInput.value.trim();
    if(!code){ document.getElementById('ui_err').style.display = 'block'; return; }
    const rec = records.find(r => r.id === recordId);
    if(!rec) return;
    const its = itemsOf(rec);
    const newItem = { id: genId(), productCode: code, productName: name, expectedQuantity: 0, lots: [], isUnexpected: true };
    its.push(newItem);
    rec.items = its;
    render();
    closeOverlay('addUnexpectedItemOverlay');
    const ok = await window.fbUpdateRecord(recordId, { items: its });
