<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>반품검수기</title>
<meta name="theme-color" content="#2C4A66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="반품검수기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, getDocs, addDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ⚠️ 반품검수기 전용 Firebase 프로젝트입니다 (블락배치와 별도 프로젝트).
  // Firebase 콘솔에서 새 프로젝트 만든 뒤 아래 값을 그 프로젝트 설정값으로 교체하세요.
  const TEAM_EMAIL = "fmek-return@korea.com";

  const firebaseConfig = {
    apiKey: "AIzaSyCcdLOmr6yicLRfPp_EDJTSztm-a19zuyQ",
    authDomain: "fmek-return.firebaseapp.com",
    projectId: "fmek-return",
    storageBucket: "fmek-return.firebasestorage.app",
    messagingSenderId: "397090358632",
    appId: "1:397090358632:web:7bee300bb5f57ca424c2dd"
  };

  const isConfigured = !firebaseConfig.apiKey.includes('여기에');
  window.__firebaseReady = false;

  if(isConfigured){
    try{
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const recordsCol = collection(db, "returnRecords");
      const photosCol = collection(db, "returnPhotos");
      const masterCol = collection(db, "productMaster"); // 문서 id = 바코드(GTIN) 끝 6자리
      const partnerCol = collection(db, "partnerMaster"); // 문서 id = 파트너코드

      window.fbAddRecord = async function(record){
        try{ await setDoc(doc(recordsCol, record.id), record); return true; }
        catch(e){ console.error('Firestore add error:', e); return false; }
      };
      window.fbUpdateRecord = async function(id, patch){
        try{ await updateDoc(doc(recordsCol, id), patch); return true; }
        catch(e){ console.error('Firestore update error:', e); return false; }
      };
      window.fbDeleteRecord = async function(id){
        try{
          await deleteDoc(doc(recordsCol, id));
          const snap = await getDocs(query(photosCol, where('recordId', '==', id)));
          for(const d of snap.docs){ await deleteDoc(doc(photosCol, d.id)); }
          return true;
        }catch(e){ console.error('Firestore delete error:', e); return false; }
      };
      window.fbWatchRecords = function(onData, onError){
        onSnapshot(recordsCol, (snap)=>{
          const data = snap.docs.map(d => d.data());
          onData(data);
        }, (err)=>{ console.error('Firestore watch error:', err); if(onError) onError(err); });
      };

      // 사진은 본문 문서(1MB 제한)와 분리된 별도 컬렉션에 저장 - itemId로 어느 품목 사진인지 구분 (receipt/zoom은 itemId 없음)
      window.fbAddPhoto = async function(recordId, itemId, type, data){
        try{
          const ref = await addDoc(photosCol, { recordId, itemId: itemId || null, type, data, uploadedAt: new Date().toISOString() });
          return ref.id;
        }catch(e){ console.error('Firestore photo add error:', e); return null; }
      };
      window.fbGetPhotos = async function(recordId){
        try{
          const snap = await getDocs(query(photosCol, where('recordId', '==', recordId)));
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }catch(e){ console.error('Firestore photo fetch error:', e); return []; }
      };
      window.fbDeletePhoto = async function(photoId){
        try{ await deleteDoc(doc(photosCol, photoId)); return true; }
        catch(e){ console.error('Firestore photo delete error:', e); return false; }
      };

      // 제품코드 마스터: 바코드(GTIN) 끝 6자리 → 제품코드/제품명 매핑. 한번 등록해두면 다음부터 실물사진 OCR에서 자동 인식됨
      window.fbGetProductMaster = async function(key){
        try{
          const snap = await getDoc(doc(masterCol, key));
          return snap.exists() ? { id: snap.id, ...snap.data() } : null;
        }catch(e){ console.error('마스터 조회 실패:', e); return null; }
      };
      window.fbSaveProductMaster = async function(key, productCode, productName, by){
        try{
          await setDoc(doc(masterCol, key), { key, productCode, productName: productName || '', updatedBy: by || '', updatedAt: new Date().toISOString() });
          return true;
        }catch(e){ console.error('마스터 저장 실패:', e); return false; }
      };
      window.fbListProductMaster = async function(){
        try{
          const snap = await getDocs(masterCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> (a.key||'').localeCompare(b.key||''));
        }catch(e){ console.error('마스터 목록 조회 실패:', e); return []; }
      };
      window.fbDeleteProductMaster = async function(key){
        try{ await deleteDoc(doc(masterCol, key)); return true; }
        catch(e){ console.error('마스터 삭제 실패:', e); return false; }
      };

      // 파트너 마스터: 반품처(거래처) 코드 ↔ 이름 매핑. OCR 대신 여기서 검색/선택해서 반품처를 채움
      window.fbSavePartnerMaster = async function(code, name, by){
        try{
          await setDoc(doc(partnerCol, code), { code, name, updatedBy: by || '', updatedAt: new Date().toISOString() });
          return true;
        }catch(e){ console.error('파트너 저장 실패:', e); return false; }
      };
      window.fbBulkSavePartnerMaster = async function(records, by){
        try{
          const chunkSize = 450;
          for(let i = 0; i < records.length; i += chunkSize){
            const chunk = records.slice(i, i + chunkSize);
            const batch = writeBatch(db);
            chunk.forEach(r => batch.set(doc(partnerCol, r.code), { code: r.code, name: r.name, updatedBy: by || '', updatedAt: new Date().toISOString() }));
            await batch.commit();
          }
          return true;
        }catch(e){ console.error('파트너 일괄 저장 실패:', e); return false; }
      };
      window.fbListPartnerMaster = async function(){
        try{
          const snap = await getDocs(partnerCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> (a.code||'').localeCompare(b.code||''));
        }catch(e){ console.error('파트너 목록 조회 실패:', e); return []; }
      };
      window.fbDeletePartnerMaster = async function(code){
        try{ await deleteDoc(doc(partnerCol, code)); return true; }
        catch(e){ console.error('파트너 삭제 실패:', e); return false; }
      };

      // 제품 마스터(카탈로그): 제품코드 ↔ 제품명 전체 목록. 파트너 마스터·바코드매핑(productMaster)과 완전 별개 컬렉션.
      // 문서 id = 제품코드. 품목 등록 시 OCR 후보와 비교해서 추천/검색하는 데 사용.
      const catalogCol = collection(db, "productCatalog");
      window.fbSaveCatalogItem = async function(code, name, by){
        try{
          await setDoc(doc(catalogCol, code), { code, name, updatedBy: by || '', updatedAt: new Date().toISOString() });
          return true;
        }catch(e){ console.error('제품 마스터 저장 실패:', e); return false; }
      };
      window.fbBulkSaveCatalogItems = async function(records, by){
        try{
          const chunkSize = 450;
          for(let i = 0; i < records.length; i += chunkSize){
            const chunk = records.slice(i, i + chunkSize);
            const batch = writeBatch(db);
            chunk.forEach(r => batch.set(doc(catalogCol, r.code), { code: r.code, name: r.name, updatedBy: by || '', updatedAt: new Date().toISOString() }));
            await batch.commit();
          }
          return true;
        }catch(e){ console.error('제품 마스터 일괄 저장 실패:', e); return false; }
      };
      window.fbListCatalogItems = async function(){
        try{
          const snap = await getDocs(catalogCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> (a.code||'').localeCompare(b.code||''));
        }catch(e){ console.error('제품 마스터 목록 조회 실패:', e); return []; }
      };
      window.fbDeleteCatalogItem = async function(code){
        try{ await deleteDoc(doc(catalogCol, code)); return true; }
        catch(e){ console.error('제품 마스터 삭제 실패:', e); return false; }
      };

      const auth = getAuth(app);
      window.fbLogin = async function(password){
        try{ await signInWithEmailAndPassword(auth, TEAM_EMAIL, password); return true; }
        catch(e){ console.error('Login error:', e); return false; }
      };
      window.fbGuestLogin = async function(){
        try{ await signInAnonymously(auth); return true; }
        catch(e){ console.error('Guest login error:', e); return false; }
      };
      window.fbOnAuthChange = function(callback){
        onAuthStateChanged(auth, (user) => callback(!!user, user ? !!user.isAnonymous : false));
      };
      window.fbLogout = async function(){
        try{ await signOut(auth); return true; }
        catch(e){ console.error('Logout error:', e); return false; }
      };

      window.__firebaseReady = true;
    }catch(e){
      console.error('Firebase init error:', e);
      window.__firebaseReady = false;
    }
  }
  window.__firebaseChecked = true;
</script>
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1B2430; --ink-muted:#5B6672;
    --steel:#2C4A66; --steel-dark:#1D3347;
    --amber:#B4530A; --amber-bg:#FDF1E7;
    --green:#157347; --green-bg:#E9F6EF;
    --blue:#1D4ED8; --blue-bg:#EAF0FE;
    --line:#D7DEE5; --danger:#B3261E;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .app{ max-width:720px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:100px; }

  header{ position:sticky; top:0; z-index:20; background:var(--steel); background-image:linear-gradient(160deg, var(--steel) 0%, var(--steel-dark) 100%); color:#fff; padding:18px 18px 16px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .header-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .header-top > div:first-child{ min-width:0; flex:1 1 auto; }
  .header-top .logout-btn{ flex:0 0 auto; }
  .admin-btn-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:.01em; font-size:22px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subtitle{ font-size:12px; color:#B9C7D4; margin-top:2px; font-weight:500; }
  .logout-btn{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#DCE5EC; font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .stats-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .stat-chip{ display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:5px 11px; font-size:11.5px; font-weight:600; white-space:nowrap; color:#DCE5EC; }
  .stat-chip .n{ font-family:'JetBrains Mono',monospace; font-size:13px; }
  .stat-chip.c-pending .n{ color:#FFD9B3; }
  .stat-chip.c-confirmed .n{ color:#A6E4C2; }

  .search-row{ margin-top:14px; position:relative; }
  .search-row input{ width:100%; padding:11px 14px 11px 38px; border-radius:10px; border:none; font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:500; background:rgba(255,255,255,.95); color:var(--ink); }
  .search-row input:focus{ outline:2px solid #FFD9B3; outline-offset:1px; }
  .search-icon{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; font-size:14px; }

  .tabs{ display:flex; gap:5px; margin-top:12px; }
  .tab{ flex:1; text-align:center; padding:8px 4px; border-radius:8px; font-size:11.5px; font-weight:600; background:rgba(255,255,255,.08); color:#C9D5DF; cursor:pointer; border:1px solid transparent; }
  .tab.active{ background:#fff; color:var(--steel-dark); }
  .tab.active[data-filter="pending"]{ background:var(--amber); color:#fff; }
  .tab.active[data-filter="confirmed"]{ background:var(--green); color:#fff; }

  .list{ padding:16px 14px 0; display:flex; flex-direction:column; gap:10px; }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-muted); }
  .empty .big{ font-size:32px; margin-bottom:8px; }
  .empty p{ font-size:13.5px; margin:4px 0; }

  .card{ background:var(--surface); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(20,30,40,.08); border:1px solid var(--line); position:relative; }
  .card.pending{ border-left:6px solid var(--amber); }
  .card.confirmed{ border-left:6px solid var(--green); }
  .card-inner{ padding:14px 14px 14px 16px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .lot{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15.5px; letter-spacing:.01em; }
  .product{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }
  .badge{ font-size:10.5px; font-weight:700; padding:4px 10px 4px 7px; border-radius:20px; white-space:nowrap; letter-spacing:.01em; display:inline-flex; align-items:center; gap:4px; }
  .badge.pending{ background:var(--amber); color:#fff; }
  .badge.confirmed{ background:var(--green); color:#fff; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:10px; font-size:12px; color:var(--ink-muted); }
  .meta-row b{ color:var(--ink); font-weight:600; }
  .memo{ font-size:12.5px; color:var(--ink-muted); margin-top:8px; line-height:1.5; background:#F7F8FA; padding:8px 10px; border-radius:8px; }
  .item-chip-list{ display:flex; flex-direction:column; gap:5px; margin-top:10px; }
  .item-chip{ font-size:12px; background:#F7F8FA; border:1px solid var(--line); border-radius:8px; padding:6px 9px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .item-chip .ic-name{ font-weight:600; color:var(--ink); }
  .item-chip .ic-lot{ font-family:'JetBrains Mono',monospace; color:var(--steel-dark); font-weight:700; }
  .photo-badge{ display:inline-flex; align-items:center; gap:3px; font-size:10.5px; font-weight:700; background:var(--blue-bg); color:var(--blue); padding:3px 8px; border-radius:20px; margin-top:8px; }
  .card-actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn-sm{ font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; border:none; cursor:pointer; flex:0 1 auto; }
  .btn-full-row{ flex:1 1 100% !important; }
  .btn-confirm{ background:var(--green); color:#fff; }
  .btn-view{ background:var(--blue-bg); color:var(--blue); border:1px solid #C7D8FC; }
  .btn-del{ background:none; color:var(--ink-muted); border:1px solid var(--line); }
  .btn-del:hover{ color:var(--danger); border-color:var(--danger); }
  .btn-edit{ background:none; color:var(--steel); border:1px solid var(--line); }

  .fab{ position:fixed; right:20px; bottom:20px; z-index:30; width:56px; height:56px; border-radius:50%; border:none; background:var(--amber); color:#fff; font-size:26px; font-weight:700; box-shadow:0 4px 14px rgba(180,83,10,.4); cursor:pointer; display:flex; align-items:center; justify-content:center; max-width:720px; margin:0 auto; }
  .fab-sub{ position:fixed; right:20px; bottom:88px; z-index:30; width:44px; height:44px; border-radius:50%; border:none; background:var(--steel); color:#fff; font-size:18px; box-shadow:0 4px 14px rgba(44,74,102,.35); cursor:pointer; display:flex; align-items:center; justify-content:center; max-width:720px; margin:0 auto; }
  .fab-wrap{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; pointer-events:none; }
  .fab-wrap .fab-inner{ position:relative; width:100%; max-width:720px; height:0; pointer-events:none; }
  .fab-wrap button{ pointer-events:auto; position:absolute; right:20px; }
  .fab-wrap .fab{ bottom:20px; }
  .fab-wrap .fab-sub{ bottom:88px; }

  .wizard-steps{ display:flex; gap:4px; margin-bottom:16px; }
  .wizard-steps .ws{ flex:1; height:4px; border-radius:4px; background:var(--line); }
  .wizard-steps .ws.done{ background:var(--green); }
  .wizard-steps .ws.active{ background:var(--steel); }
  .step-label{ font-size:11.5px; color:var(--ink-muted); font-weight:600; margin-bottom:4px; }

  .hint{ font-size:11.5px; color:var(--ink-muted); margin-top:5px; line-height:1.5; }
  .hint code{ background:#F1F3F5; padding:1px 5px; border-radius:4px; font-family:'JetBrains Mono',monospace; }

  .capture-zone{ border:2px dashed var(--line); border-radius:10px; padding:20px 14px; text-align:center; color:var(--ink-muted); font-size:13px; cursor:pointer; background:#FBFCFD; }
  .capture-zone img{ max-width:100%; max-height:260px; border-radius:8px; display:block; margin:0 auto; }
  .capture-zone input{ display:none; }
  .ocr-progress{ font-size:12.5px; color:var(--steel-dark); text-align:center; margin-top:10px; font-weight:600; }

  .photo-thumbs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .photo-thumb{ position:relative; width:84px; height:84px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .rm{ position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; border:none; font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .photo-add-btn{ width:84px; height:84px; border-radius:8px; border:2px dashed var(--line); background:#FBFCFD; color:var(--ink-muted); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; }

  .item-card{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#FBFCFD; }
  .item-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .item-card .it-name{ font-weight:700; font-size:13.5px; }
  .item-card .it-lot{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--steel-dark); margin-top:2px; }
  .item-card .it-meta{ font-size:11.5px; color:var(--ink-muted); margin-top:4px; }
  .item-card .it-actions{ display:flex; gap:6px; flex-shrink:0; }
  .item-card .it-actions button{ font-size:11px; padding:5px 9px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  .item-builder{ border:1px dashed var(--steel); border-radius:12px; padding:14px; margin-top:6px; background:#F5F8FA; }
  .item-builder-title{ font-size:12.5px; font-weight:700; color:var(--steel-dark); margin-bottom:10px; }

  .cert-gallery{ display:flex; flex-direction:column; gap:12px; }
  .cert-gallery-item{ border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .cert-gallery-item img{ width:100%; display:block; cursor:zoom-in; }
  .cert-gallery-meta{ padding:8px 10px; font-size:11.5px; color:var(--ink-muted); background:#FBFCFD; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .item-section-title{ font-size:12.5px; font-weight:700; color:var(--steel-dark); margin:16px 0 8px; padding-top:12px; border-top:1px dashed var(--line); }
  .item-section-title:first-child{ border-top:none; padding-top:0; margin-top:0; }

  .overlay{ position:fixed; inset:0; background:rgba(20,26,33,.55); z-index:40; display:flex; align-items:flex-end; justify-content:center; }
  .modal{ background:#fff; width:100%; max-width:720px; border-radius:18px 18px 0 0; padding:20px 20px 24px; max-height:88vh; overflow-y:auto; animation:slideup .2s ease-out; }
  @keyframes slideup{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal h2{ font-family:'Oswald',sans-serif; font-size:17px; font-weight:600; text-transform:uppercase; letter-spacing:.02em; margin:0 0 16px; color:var(--steel-dark); }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--ink-muted); margin-bottom:5px; }
  .field input, .field select, .field textarea{ width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); font-family:'Inter',sans-serif; font-size:14px; color:var(--ink); background:#FBFCFD; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--steel); outline-offset:0; border-color:var(--steel); }
  .field textarea{ resize:vertical; min-height:56px; font-family:'Inter',sans-serif; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-cancel{ flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink-muted); font-weight:600; font-size:14px; cursor:pointer; }
  .btn-submit{ flex:2; padding:12px; border-radius:10px; border:none; background:var(--steel); color:#fff; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-submit.green{ background:var(--green); }
  .btn-submit.amber{ background:var(--amber); }
  .btn-submit:disabled{ opacity:.5; cursor:not-allowed; }
  .err{ color:var(--danger); font-size:12px; margin-top:6px; display:none; }
  .preview-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
  .preview-table th{ text-align:left; font-size:10.5px; color:var(--ink-muted); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); }
  .preview-table td{ padding:6px 6px; border-bottom:1px solid #EEF1F4; vertical-align:top; }
  .preview-table tr.invalid td{ color:var(--danger); }
  .preview-table td.chk{ width:22px; }
  .preview-summary{ font-size:12px; color:var(--ink-muted); margin-top:8px; }
  .preview-summary b{ color:var(--steel-dark); }
  .preview-wrap{ max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; padding:0 8px; }
  .suggest-box{ position:absolute; left:0; right:0; top:100%; z-index:5; background:#fff; border:1px solid var(--line); border-radius:8px; margin-top:4px; max-height:220px; overflow-y:auto; box-shadow:0 4px 12px rgba(0,0,0,.12); }
  .suggest-item{ padding:9px 12px; font-size:13px; cursor:pointer; border-bottom:1px solid var(--line); }
  .suggest-item:last-child{ border-bottom:none; }
  .suggest-item:hover{ background:#F1F3F5; }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:50; background:var(--steel-dark); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(6px); }
  .loading{ text-align:center; padding:60px 20px; color:var(--ink-muted); font-size:13px; }

  .setup-screen{ position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; }
  .setup-box{ max-width:440px; background:#fff; border-radius:16px; padding:32px 28px; box-shadow:0 4px 20px rgba(0,0,0,.08); border:1px solid var(--line); }
  .setup-icon{ font-size:36px; margin-bottom:10px; }
  .setup-box h2{ font-family:'Oswald',sans-serif; font-size:18px; color:var(--steel-dark); margin:0 0 12px; }
  .setup-box p{ font-size:13px; color:var(--ink-muted); line-height:1.6; margin:0 0 14px; }
  .setup-box code{ background:#F1F3F5; padding:1px 6px; border-radius:4px; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .login-input{ width:100%; padding:12px 14px; border-radius:9px; border:1px solid var(--line); font-size:15px; margin-top:14px; text-align:center; letter-spacing:.05em; }
  .login-input:focus{ outline:2px solid var(--steel); border-color:var(--steel); }
  .login-err{ color:var(--danger); font-size:12.5px; margin-top:8px; display:none; }
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div class="header-top">
      <div>
        <h1>📦 반품검수기</h1>
        <div class="subtitle" id="subtitle">반품인수증 · 실물 대조 검수 관리</div>
      </div>
      <button class="logout-btn" id="logoutBtn">로그아웃</button>
    </div>
    <div class="admin-btn-row">
      <button class="logout-btn" id="partnerBtn">🏢 파트너</button>
      <button class="logout-btn" id="productCatalogBtn">📦 제품마스터</button>
      <button class="logout-btn" id="masterBtn">🗂 바코드매핑</button>
    </div>
    <div class="stats-row">
      <div class="stat-chip c-pending">검수대기 <span class="n" id="pendingCount">-</span></div>
      <div class="stat-chip c-confirmed">검수완료 <span class="n" id="confirmedCount">-</span></div>
    </div>
    <div class="search-row">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="반품번호, 제품코드, 제품명, LOT 검색" autocomplete="off">
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-filter="all">📋 전체</div>
      <div class="tab" data-filter="pending">⏳ 검수대기</div>
      <div class="tab" data-filter="confirmed">✅ 검수완료</div>
    </div>
  </header>

  <div class="list" id="list"><div class="loading">불러오는 중...</div></div>
</div>

<div class="fab-wrap"><div class="fab-inner">
  <button class="fab-sub" id="exportExcel" title="현재 목록 엑셀 다운로드">⬇</button>
  <button class="fab" id="openWizard" title="새 반품 등록">+</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
let records = [];
let currentFilter = 'all';
let searchTerm = '';
let myName = '';
let isGuestMode = false;

function showToast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); const pad = n => String(n).padStart(2,'0'); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// 파트너 마스터/제품 마스터 검색창 공용 자동완성 드롭다운 - code/name 부분일치로 필터링, 선택하면 입력칸에 채워짐
function renderSuggestBox(list, query, container, inputEl, displayFn){
  const q = query.trim().toLowerCase();
  if(!q){ container.style.display = 'none'; container.innerHTML = ''; return; }
  const matches = (list || []).filter(item =>
    (item.code || '').toLowerCase().includes(q) || (item.name || '').toLowerCase().includes(q)
  ).slice(0, 8);
  if(matches.length === 0){
    container.style.display = 'block';
    container.innerHTML = `<div class="suggest-item" style="color:var(--ink-muted); cursor:default;">일치하는 항목이 없어요</div>`;
    return;
  }
  container.style.display = 'block';
  container.innerHTML = matches.map((item, i) => `<div class="suggest-item" data-idx="${i}">${escapeHtml(item.code)} · ${escapeHtml(item.name)}</div>`).join('');
  container.querySelectorAll('.suggest-item[data-idx]').forEach((el)=>{
    el.addEventListener('click', ()=>{
      const item = matches[parseInt(el.dataset.idx, 10)];
      inputEl.value = displayFn(item);
      container.style.display = 'none';
      container.innerHTML = '';
      inputEl.dispatchEvent(new CustomEvent('itemselected', { detail: item }));
    });
  });
}

function loadMyName(){ try{ const v = localStorage.getItem('returnCheck_myName'); if(v) myName = v; }catch(e){} }
function saveMyName(name){ myName = name; try{ localStorage.setItem('returnCheck_myName', name); }catch(e){} }

function waitForFirebase(){
  return new Promise((resolve)=>{
    const check = ()=>{ if(window.__firebaseChecked) resolve(); else setTimeout(check, 50); };
    check();
  });
}

function initRealtimeSync(){
  document.getElementById('list').innerHTML = '<div class="loading">불러오는 중...</div>';
  window.fbWatchRecords(
    (data) => { records = data; render(); },
    (err) => { showToast('실시간 동기화 연결 실패 - 새로고침 해주세요'); }
  );
}

const STATUS_LABEL = { pending:'검수대기', confirmed:'검수완료' };
const STATUS_ICON = { pending:'⏳', confirmed:'✅' };

// 품목(실물 제품) 상태값 - 블락배치와 동일한 코드 체계 중 우선 5개만 사용
const ITEM_STATUS_LABEL = { A:'정상', B:'판정대기', D:'부적합', E:'유효기간경과', F:'유효기간임박' };
const ITEM_STATUS_COLOR = { A:'var(--green)', B:'var(--blue)', D:'var(--danger)', E:'var(--danger)', F:'var(--amber)' };

function itemsOf(r){ return Array.isArray(r.items) ? r.items : []; }

function getFiltered(){
  let list = [...records];
  if(currentFilter !== 'all') list = list.filter(r => r.status === currentFilter);
  if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(r => {
      if((r.returnNumber||'').toLowerCase().includes(q)) return true;
      if((r.hospitalName||'').toLowerCase().includes(q)) return true;
      return itemsOf(r).some(it =>
        (it.productCode||'').toLowerCase().includes(q) ||
        (it.productName||'').toLowerCase().includes(q) ||
        (it.lot||'').toLowerCase().includes(q)
      );
    });
  }
  return list.sort((a,b) => new Date(b.registeredAt) - new Date(a.registeredAt));
}

function render(){
  document.getElementById('pendingCount').textContent = records.filter(r => r.status === 'pending').length;
  document.getElementById('confirmedCount').textContent = records.filter(r => r.status === 'confirmed').length;

  const list = getFiltered();
  const el = document.getElementById('list');
  if(list.length === 0){
    el.innerHTML = `<div class="empty"><div class="big">📦</div><p><b>기록이 없어요</b></p><p>${records.length === 0 ? '우측 하단 + 버튼으로 첫 건을 등록해보세요' : '검색·필터 조건에 맞는 항목이 없어요'}</p></div>`;
    return;
  }

  el.innerHTML = list.map(r => {
    const its = itemsOf(r);
    const shown = its.slice(0, 3);
    const moreCount = its.length - shown.length;
    return `
    <div class="card ${r.status}">
      <div class="card-inner">
        <div class="card-top">
          <div>
            <div class="lot">${escapeHtml(r.returnNumber || '(반품번호 미확인)')}</div>
            <div class="product">${escapeHtml(r.hospitalName || '병원명 미입력')} · 품목 ${its.length}건</div>
          </div>
          <span class="badge ${r.status}">${STATUS_ICON[r.status]} ${STATUS_LABEL[r.status]}</span>
        </div>
        <div class="meta-row">
          <span>등록 <b>${escapeHtml(r.registeredBy)}</b></span>
          <span>${fmtDate(r.registeredAt)}</span>
        </div>
        ${its.length > 0 ? `<div class="item-chip-list">
          ${shown.map(it => { const st = it.status || 'A'; return `<div class="item-chip"><span class="ic-name">${escapeHtml(it.productName || it.productCode || '제품명 미입력')} <span style="font-size:9.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st] || 'var(--ink-muted)'}; padding:1px 6px; border-radius:8px;">${st}</span></span><span class="ic-lot">${escapeHtml(it.lot || '-')}</span></div>`; }).join('')}
          ${moreCount > 0 ? `<div class="item-chip" style="justify-content:center; color:var(--ink-muted);">+${moreCount}건 더보기</div>` : ''}
        </div>` : ''}
        ${r.memo ? `<div class="memo">${escapeHtml(r.memo)}</div>` : ''}
        ${r.status === 'confirmed' ? `<div class="memo">✅ 검수완료 · ${escapeHtml(r.confirmedBy||'')} · ${r.confirmedAt ? fmtDate(r.confirmedAt) : ''}${r.confirmMemo ? '<br>' + escapeHtml(r.confirmMemo) : ''}</div>` : ''}
        <div class="photo-badge">🖼 사진 ${(r.photoCount ?? '?')}장</div>
        <div class="card-actions">
          <button class="btn-sm btn-view btn-full-row" onclick="openDetail('${r.id}')">품목·사진 상세 보기</button>
          ${(!isGuestMode && r.status === 'pending') ? `<button class="btn-sm btn-confirm" onclick="openConfirmModal('${r.id}')">검수완료 처리</button>` : ''}
          ${!isGuestMode ? `<button class="btn-sm btn-del" onclick="openDeleteConfirm('${r.id}')">삭제</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function showAppConfirm(message, confirmLabel, onConfirm){
  closeOverlay('appConfirmOverlay');
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'appConfirmOverlay';
  overlay.innerHTML = `<div class="modal"><h2>확인</h2>
    <p style="font-size:13.5px; color:var(--ink); line-height:1.6; white-space:pre-line;">${escapeHtml(message)}</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="appConfirmCancel">취소</button>
      <button class="btn-submit" id="appConfirmOk">${escapeHtml(confirmLabel || '확인')}</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const cleanup = ()=> closeOverlay('appConfirmOverlay');
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) cleanup(); });
  overlay.querySelector('#appConfirmCancel').addEventListener('click', cleanup);
  overlay.querySelector('#appConfirmOk').addEventListener('click', ()=>{ cleanup(); onConfirm(); });
}

function closeOverlay(id){ document.querySelectorAll('#' + id).forEach(el => el.remove()); }

// ===================== 검수완료 처리 / 삭제 ===================== //

function openConfirmModal(id){
  closeOverlay('confirmOverlay');
  const rec = records.find(r => r.id === id);
  if(!rec) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'confirmOverlay';
  overlay.innerHTML = `<div class="modal"><h2>검수완료 처리</h2>
    <div class="field"><label>반품번호</label><input type="text" value="${escapeHtml(rec.returnNumber||'')}" disabled></div>
    <div class="field"><label>검수자 *</label><input id="cf_by" type="text" placeholder="이름" value="${escapeHtml(myName)}"></div>
    <div class="field"><label>검수 메모</label><textarea id="cf_memo" placeholder="이상 유무, 특이사항 (선택)"></textarea></div>
    <div class="err" id="cf_err">검수자 이름을 입력해주세요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('confirmOverlay')">취소</button>
      <button class="btn-submit green" onclick="submitConfirm('${id}')">검수완료 확정</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('confirmOverlay'); });
}

async function submitConfirm(id){
  const by = document.getElementById('cf_by').value.trim();
  const memo = document.getElementById('cf_memo').value.trim();
  if(!by){ document.getElementById('cf_err').style.display = 'block'; return; }
  const now = new Date().toISOString();
  const patch = { status: 'confirmed', confirmedBy: by, confirmedAt: now, confirmMemo: memo };
  const rec = records.find(r => r.id === id);
  if(rec) Object.assign(rec, patch);
  render();
  closeOverlay('confirmOverlay');
  await saveMyName(by);
  const ok = await window.fbUpdateRecord(id, patch);
  showToast(ok ? '검수완료 처리 완료' : '처리됐지만 저장에 실패했어요');
}

function openDeleteConfirm(id){
  closeOverlay('delConfirmOverlay');
  const rec = records.find(r => r.id === id);
  if(!rec) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'delConfirmOverlay';
  overlay.innerHTML = `<div class="modal"><h2>기록 삭제</h2>
    <div class="field"><label>반품번호</label><input type="text" value="${escapeHtml(rec.returnNumber||'')}" disabled></div>
    <p style="font-size:13px; color:var(--danger); margin:0 0 8px;">이 기록과 첨부된 모든 품목·사진을 삭제할까요? 삭제하면 되돌릴 수 없어요.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('delConfirmOverlay')">취소</button>
      <button class="btn-submit" style="background:var(--danger);" onclick="confirmDeleteRecord('${id}')">삭제</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('delConfirmOverlay'); });
}

async function confirmDeleteRecord(id){
  closeOverlay('delConfirmOverlay');
  records = records.filter(r => r.id !== id);
  render();
  const ok = await window.fbDeleteRecord(id);
  showToast(ok ? '삭제 완료' : '삭제됐지만 저장에 실패했어요');
}

// ===================== 상세보기 (품목별 사진 갤러리) ===================== //

async function openDetail(id){
  closeOverlay('detailOverlay');
  const rec = records.find(r => r.id === id);
  if(!rec) return;
  const its = itemsOf(rec);
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'detailOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>${escapeHtml(rec.returnNumber || '반품 상세')}</h2>
    <div class="field"><label>병원명</label><input type="text" value="${escapeHtml(rec.hospitalName||'-')}" disabled></div>
    <div class="loading" id="detailPhotoLoading">사진 불러오는 중...</div>
    <div id="detailBody" style="display:none;"></div>
    <div class="modal-actions"><button class="btn-cancel" style="flex:1;" onclick="closeOverlay('detailOverlay')">닫기</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('detailOverlay'); });

  const photos = await window.fbGetPhotos(id);
  document.getElementById('detailPhotoLoading').style.display = 'none';
  const body = document.getElementById('detailBody');
  body.style.display = 'block';

  const receiptPhotos = photos.filter(p => p.type === 'receipt' || p.type === 'zoom');
  const TYPE_LABEL = { receipt:'📄 인수증 원본', zoom:'🔍 반품번호·반품처 확대' };

  let html = '';
  if(receiptPhotos.length > 0){
    html += `<div class="item-section-title">인수증 사진</div><div class="cert-gallery">`;
    html += receiptPhotos.map(p => `
      <div class="cert-gallery-item">
        <img src="${p.data}" alt="사진" onclick="window.open('${p.data}','_blank')">
        <div class="cert-gallery-meta">
          <span>${TYPE_LABEL[p.type] || '사진'} · ${p.uploadedAt ? fmtDate(p.uploadedAt) : ''}</span>
          ${!isGuestMode ? `<button class="btn-sm btn-del" onclick="deletePhotoFromDetail('${id}','${p.id}')">삭제</button>` : ''}
        </div>
      </div>`).join('');
    html += `</div>`;
  }

  its.forEach(it => {
    const itPhotos = photos.filter(p => p.itemId === it.id);
    const st = it.status || 'A';
    html += `<div class="item-section-title">📦 ${escapeHtml(it.productName || it.productCode || '제품명 미입력')} · LOT ${escapeHtml(it.lot || '-')} <span style="font-size:10.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st] || 'var(--ink-muted)'}; padding:2px 7px; border-radius:10px; margin-left:4px;">${st} · ${ITEM_STATUS_LABEL[st] || st}</span></div>
    <div class="meta-row" style="margin-bottom:8px;">
      ${it.productCode ? `<span>제품코드 <b>${escapeHtml(it.productCode)}</b></span>` : ''}
      ${it.expiryDate ? `<span>유효기간 <b>${escapeHtml(it.expiryDate)}</b></span>` : ''}
      ${it.quantity ? `<span>수량 <b>${escapeHtml(it.quantity)}</b></span>` : ''}
    </div>`;
    if(itPhotos.length === 0){
      html += `<div class="hint">첨부된 실물사진이 없어요</div>`;
    } else {
      html += `<div class="cert-gallery">` + itPhotos.map(p => `
        <div class="cert-gallery-item">
          <img src="${p.data}" alt="실물사진" onclick="window.open('${p.data}','_blank')">
          <div class="cert-gallery-meta">
            <span>📦 실물사진 · ${p.uploadedAt ? fmtDate(p.uploadedAt) : ''}</span>
            ${!isGuestMode ? `<button class="btn-sm btn-del" onclick="deletePhotoFromDetail('${id}','${p.id}')">삭제</button>` : ''}
          </div>
        </div>`).join('') + `</div>`;
    }
  });

  if(its.length === 0 && receiptPhotos.length === 0){
    html = `<div class="hint" style="text-align:center; padding:20px;">등록된 품목·사진이 없어요</div>`;
  }
  body.innerHTML = html;
}

async function deletePhotoFromDetail(recordId, photoId){
  if(!confirm('이 사진을 삭제할까요? 삭제하면 되돌릴 수 없어요.')) return;
  const ok = await window.fbDeletePhoto(photoId);
  if(ok){
    const rec = records.find(r => r.id === recordId);
    if(rec && typeof rec.photoCount === 'number'){
      rec.photoCount = Math.max(0, rec.photoCount - 1);
      await window.fbUpdateRecord(recordId, { photoCount: rec.photoCount });
    }
    showToast('사진 삭제 완료');
    openDetail(recordId);
  } else {
    showToast('삭제에 실패했어요');
  }
}

// ===================== OCR / 이미지 유틸 ===================== //

function resizeImageToDataUrl(dataUrl, maxWidth, format, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(format === 'png' ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// 사진은 별도 컬렉션에 1장씩 저장되므로 문서당 1MB 한도만 넘지 않으면 됨 - 여유있게 압축
async function compressPhoto(dataUrl){
  const targetChars = 900 * 1024 * 1.37;
  const jpegSteps = [
    { maxWidth: 1600, quality: 0.85 },
    { maxWidth: 1400, quality: 0.7 },
    { maxWidth: 1100, quality: 0.55 },
    { maxWidth: 900, quality: 0.45 }
  ];
  let result = await resizeImageToDataUrl(dataUrl, jpegSteps[0].maxWidth, 'jpeg', jpegSteps[0].quality);
  for(const step of jpegSteps){
    if(result.length <= targetChars) break;
    result = await resizeImageToDataUrl(dataUrl, step.maxWidth, 'jpeg', step.quality);
  }
  return result;
}

function preprocessImageForOcr(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      // OCR 속도·정확도 균형을 위해 긴 변 기준으로 크기 정규화 - 휴대폰 원본(3000px+)은 줄이고, 작은 크롭은 키움
      const targetLong = 1600;
      const longSide = Math.max(img.width, img.height);
      const scale = targetLong / longSide;
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      try{
        const imageData = ctx.getImageData(0,0,w,h);
        const d = imageData.data;
        for(let i=0;i<d.length;i+=4){
          const gray = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
          let v = (gray - 128) * 1.35 + 128;
          v = Math.max(0, Math.min(255, v));
          d[i]=d[i+1]=d[i+2]=v;
        }
        ctx.putImageData(imageData, 0, 0);
      }catch(e){ console.warn('전처리 스킵:', e); }
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Tesseract 단어별 좌표(bbox)를 이용해 같은 줄(y좌표 비슷한 것끼리)로 다시 묶고, 줄 안에서는 x좌표순으로 정렬
// - 표 서식 문서에서 OCR이 "라벨들 먼저, 값들 나중" 식으로 순서를 뒤섞어 읽는 문제를 근본적으로 해결함
function reconstructLinesFromWords(words){
  if(!words || words.length === 0) return '';
  const items = words
    .filter(w => w && w.text && w.text.trim() && w.bbox)
    .map(w => ({ text: w.text.trim(), cy: (w.bbox.y0 + w.bbox.y1) / 2, h: Math.max(1, w.bbox.y1 - w.bbox.y0), x0: w.bbox.x0 }));
  if(items.length === 0) return '';
  items.sort((a,b) => a.cy - b.cy);
  const lines = [];
  let current = [items[0]];
  let lastCy = items[0].cy;
  for(let i = 1; i < items.length; i++){
    const it = items[i];
    if(Math.abs(it.cy - lastCy) <= it.h * 0.6){
      current.push(it);
    } else {
      lines.push(current);
      current = [it];
    }
    lastCy = it.cy;
  }
  lines.push(current);
  return lines.map(line => line.sort((a,b)=>a.x0-b.x0).map(w=>w.text).join(' ')).join('\n');
}

let ocrWorkerPromise = null;
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker('kor+eng', 1, {});
  }
  return ocrWorkerPromise;
}

async function runOcr(dataUrl){
  try{
    const pre = await preprocessImageForOcr(dataUrl);
    const worker = await getOcrWorker();
    const result = await worker.recognize(pre);
    const rawText = (result && result.data && result.data.text) ? result.data.text : '';
    const words = (result && result.data && result.data.words) ? result.data.words : [];
    const rebuilt = reconstructLinesFromWords(words);
    return rebuilt || rawText; // 좌표 재조립이 되면 그걸 우선 사용, 실패하면 원본 텍스트로 폴백
  }catch(e){
    console.error('OCR error:', e);
    return '';
  }
}

// 인수증 전용 OCR - 텍스트뿐 아니라 글자별 좌표(words)도 같이 반환 (반품번호/반품처 정밀 추출용)
async function runReceiptOcr(dataUrl){
  try{
    const pre = await preprocessImageForOcr(dataUrl);
    const worker = await getOcrWorker();
    const result = await worker.recognize(pre);
    const rawText = (result && result.data && result.data.text) ? result.data.text : '';
    const words = (result && result.data && result.data.words) ? result.data.words : [];
    const rebuilt = reconstructLinesFromWords(words);
    return { text: rebuilt || rawText, words };
  }catch(e){
    console.error('OCR error:', e);
    return { text: '', words: [] };
  }
}

// 라벨 단어를 좌표로 직접 찾아서, 같은 행(y좌표 비슷함)에서 라벨 오른쪽에 붙어있는 단어만 이어붙여 값으로 반환
// 텍스트 줄 재조립 방식보다 훨씬 정확함 - 표 안에서 다른 행/다른 라벨로 잘못 건너뛰는 것을 원천 차단
const ROW_STOP_LABELS = ['반품사유', '사업자', '공급처', '대표자', '청구처', '반품요청일자', '반품처', '연락처', '주소', '병원명', '제품코드', '제품명', 'REF', 'LOT', 'EXP'];

// 편집거리(레벤슈타인) - 짧은 라벨 단어에서 OCR이 한 글자 정도 잘못 읽어도 찾아낼 수 있게 함
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(Math.abs(m - n) > 2) return 99;
  const dp = [];
  for(let i = 0; i <= m; i++){ dp.push(new Array(n + 1).fill(0)); dp[i][0] = i; }
  for(let j = 0; j <= n; j++) dp[0][j] = j;
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  }
  return dp[m][n];
}

// 인수증에서 흔히 나오는 라벨 전체 목록 - 유사매칭 시 "이미 다른 진짜 라벨과 정확히 일치하는 단어"는 제외하기 위함
const ALL_KNOWN_LABELS = ['반품번호', '반품처', '병원명', '반품사유', '반품요청일자', '사업자', '공급처', '대표자', '청구처', '연락처', '주소', '제품코드', '제품명'];

// wordText 안에 labelText와 편집거리 1 이내로 비슷한 부분문자열이 있는지 (완전 일치 우선 시도, 실패시 유사매칭)
// 주의1: 라벨보다 짧은 부분문자열은 검사하지 않음 - 안 그러면 "반품번호"의 앞 2글자 "반품"이 "반품처"와 유사판정되는 오매칭이 생김
// 주의2: 단어가 이미 "다른" 진짜 라벨과 정확히 일치하면 유사매칭 자체를 시도하지 않음 - "반품번호"와 "반품처"는 접두어가 같아서
//        편집거리 1로도 겹칠 수 있는데, "반품번호"는 그 자체로 확실한 다른 필드이므로 절대 "반품처"로 오인하면 안 됨
function fuzzyLabelIncludes(wordText, labelText){
  if(!wordText || !labelText) return false;
  if(wordText.includes(labelText)) return true;
  const matchesOtherKnownLabel = ALL_KNOWN_LABELS.some(kl => kl !== labelText && wordText.includes(kl));
  if(matchesOtherKnownLabel) return false;
  const lLen = labelText.length;
  if(wordText.length < lLen) return false;
  for(let start = 0; start + lLen <= wordText.length; start++){
    for(let len = lLen; len <= lLen + 1 && start + len <= wordText.length; len++){
      if(levenshtein(wordText.substr(start, len), labelText) <= 1) return true;
    }
  }
  return false;
}

function extractValueByWordPosition(words, labelText){
  if(!words || words.length === 0) return '';
  const cw = words.filter(w => w && w.text && w.text.trim() && w.bbox);
  for(let i = 0; i < cw.length; i++){
    let labelBbox = null;
    if(fuzzyLabelIncludes(cw[i].text, labelText)){
      labelBbox = cw[i].bbox;
    } else {
      for(let span = 2; span <= 3 && i + span - 1 < cw.length; span++){
        const joined = cw.slice(i, i + span).map(w => w.text).join('');
        if(fuzzyLabelIncludes(joined, labelText)){ labelBbox = cw[i + span - 1].bbox; break; }
      }
    }
    if(!labelBbox) continue;

    const labelCy = (labelBbox.y0 + labelBbox.y1) / 2;
    const labelH = Math.max(1, labelBbox.y1 - labelBbox.y0);
    const sameRow = cw
      .filter(w => w.bbox.x0 >= labelBbox.x1 - 2 && Math.abs(((w.bbox.y0 + w.bbox.y1) / 2) - labelCy) <= labelH * 0.7)
      .sort((a, b) => a.bbox.x0 - b.bbox.x0);

    let collected = [];
    let prevX1 = labelBbox.x1;
    for(const w of sameRow){
      if(w.bbox.x0 - prevX1 > labelH * 6) break; // 큰 간격이면 다른 필드로 넘어간 것으로 간주
      if(ROW_STOP_LABELS.some(sw => fuzzyLabelIncludes(w.text, sw))) break; // 같은 줄의 다음 라벨을 만나면 멈춤
      collected.push(w.text);
      prevX1 = w.bbox.x1;
      if(collected.join('').replace(/[^A-Za-z0-9가-힣]/g, '').length >= 24) break;
    }
    if(collected.length > 0) return collected.join(' ').replace(/^[:：\s]+/, '').trim();
  }
  return '';
}

// 반품번호: 좌표기반 추출을 우선 시도(같은 행 값에서 숫자·밑줄 패턴 추출) → 실패시 줄 텍스트 방식으로 폴백
function extractReturnNumberGuess(words, text){
  const rowVal = extractValueByWordPosition(words, '반품번호');
  if(rowVal){
    let m = rowVal.match(/\d[\d_\-]{3,18}\d/);
    if(m) return m[0];
    m = rowVal.match(/\d{6,14}/);
    if(m) return m[0];
  }
  return extractDigitsNear(text, '반품번호', 6, 14);
}

// 반품처/병원명: 좌표기반 추출 우선 → 실패시 줄 텍스트 방식으로 폴백
function extractHospitalGuessByWords(words, text){
  const rowVal = extractValueByWordPosition(words, '반품처') || extractValueByWordPosition(words, '병원명');
  if(rowVal) return rowVal.slice(0, 60);
  return extractHospitalGuess(text);
}

// 반품번호: 같은 줄에서만 값을 찾음 (전체 텍스트 60자 윈도우 방식은 다른 행의 숫자를 잘못 집어올 수 있어서 폐기)
// 밑줄·하이픈 섞인 형식(20260811_1)을 순수 숫자(0042933059)보다 먼저 시도 (더 구체적인 패턴 우선)
function extractDigitsNear(text, label, minLen, maxLen){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  if(label){
    for(const line of lines){
      const idx = line.indexOf(label);
      if(idx === -1) continue;
      const rest = line.slice(idx + label.length).replace(/^[\s:：]+/, '');
      let m = rest.match(/\d[\d_\-]{3,18}\d/);
      if(m) return m[0];
      m = rest.match(new RegExp(`\\d{${minLen},${maxLen}}`));
      if(m) return m[0];
    }
    return '';
  }
  const all = [...text.matchAll(new RegExp(`\\d{${minLen},${maxLen}}`, 'g'))].map(m=>m[0]);
  if(all.length === 0) return '';
  return all.sort((a,b)=>b.length-a.length)[0];
}

function extractDateNear(text){
  if(!text) return '';
  const m = text.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return `${m[1]}.${String(m[2]).padStart(2,'0')}.${String(m[3]).padStart(2,'0')}`;
  const m2 = text.match(/(20\d{2})[.\-\/](\d{1,2})/);
  if(m2) return `${m2[1]}.${String(m2[2]).padStart(2,'0')}`;
  return '';
}

function extractCodeLike(text, pattern){
  if(!text) return '';
  const clean = text.replace(/\s+/g, ' ');
  const m = clean.match(pattern);
  return m ? m[0] : '';
}

// 인수증 서식은 항상 같으므로 "반품처"/"병원명" 라벨과 같은 줄에서 라벨 오른쪽 텍스트를 통째로 가져옴
// (좌표 재조립된 텍스트라 라벨-값이 같은 줄에 붙어있음 - 값에 "병원"이라는 글자가 없어도 안정적으로 잡힘)
function extractLabelValueSameLine(text, label){
  if(!text) return '';
  const lines = text.split(/\n+/);
  for(const line of lines){
    const idx = line.indexOf(label);
    if(idx !== -1){
      const rest = line.slice(idx + label.length).replace(/^[\s:：]+/, '').trim();
      if(rest) return rest.slice(0, 60);
    }
  }
  return '';
}

function extractHospitalGuess(text){
  return extractLabelValueSameLine(text, '반품처') || extractLabelValueSameLine(text, '병원명') || '';
}

// GS1 바코드 사람이 읽는 텍스트 (01)04039361097042(10)LOT(17)EXP 에서 (01) 뒤 GTIN(12~14자리 숫자)을 찾음
function extractGtinCandidate(text){
  if(!text) return '';
  const m = text.match(/\d{12,14}/);
  return m ? m[0] : '';
}

// 제품코드: REF/REF NO/REF NO./REF NUMBER/제품코드/제품 코드 라벨을 우선 찾고, 라벨 바로 뒤 또는 다음 줄의 값을 가져옴
// 하이픈(-)·슬래시(/)·점(.) 포함 코드도 지원. 실패 시 기존 F로 시작하는 코드 패턴으로 폴백.
const REF_LABELS = ['REF NO.', 'REF NO', 'REF NUMBER', 'REF', '제품코드', '제품 코드'];

// 라인 안에서 코드처럼 생긴 토큰(영문/숫자 + 하이픈·슬래시·점)을 찾음. 구분자 빼고 4자 이상이어야 인정 (오탐 방지)
function matchCodeToken(line){
  if(!line) return '';
  const matches = line.match(/[A-Za-z0-9]+(?:[-\/.][A-Za-z0-9]+)*/g) || [];
  for(const m of matches){
    if(m.replace(/[-\/.]/g, '').length >= 4) return m.toUpperCase();
  }
  return '';
}

function findValueNearLabel(lines, upperLines, labelUp, matcher){
  for(let i = 0; i < lines.length; i++){
    const idx = upperLines[i].indexOf(labelUp);
    if(idx === -1) continue;
    const rest = lines[i].slice(idx + labelUp.length).trim();
    let val = matcher(rest);
    if(!val){
      for(let off = 1; off <= 2 && !val; off++){
        if(lines[i + off]) val = matcher(lines[i + off]);
      }
    }
    if(val) return val;
  }
  return '';
}

function extractProductCodeGuess(text){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const upperLines = lines.map(l => l.toUpperCase());
  for(const label of REF_LABELS){
    const val = findValueNearLabel(lines, upperLines, label.toUpperCase(), matchCodeToken);
    if(val) return val;
  }
  const fMatch = text.match(/\bF\d{5,10}\b/);
  return fMatch ? fMatch[0] : '';
}

// LOT/제조번호: LOT/LOT NO/LOT NO./LOT NUMBER/BATCH/BATCH NO/BATCH NUMBER/제조번호/제조 번호 라벨 우선 탐색.
// GS1 사람인식 텍스트 (10)LOTVALUE 형식도 지원. 라벨을 못 찾으면 무작위 숫자를 넣지 않고 빈값으로 남김(오인식 방지).
const LOT_LABELS = ['LOT NUMBER', 'LOT NO.', 'LOT NO', 'BATCH NUMBER', 'BATCH NO.', 'BATCH NO', 'LOT', 'BATCH', '제조번호', '제조 번호'];

function extractLotGuess(text){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const upperLines = lines.map(l => l.toUpperCase());
  for(const label of LOT_LABELS){
    const val = findValueNearLabel(lines, upperLines, label.toUpperCase(), matchCodeToken);
    if(val) return val;
  }
  const gs1 = text.match(/\(10\)\s*([A-Za-z0-9]{4,15})/);
  if(gs1) return gs1[1].toUpperCase();
  return '';
}

// 유효기간: 월의 마지막 날짜를 정확히 계산 (윤년 포함) - 하드코딩 없이 JS Date로 계산
function getLastDayOfMonth(year, month){
  return new Date(year, month, 0).getDate();
}

function formatExpiryParts(y, mo, d){
  const mm = String(mo).padStart(2, '0');
  if(d){
    return `${y}.${mm}.${String(d).padStart(2, '0')}`;
  }
  const lastDay = getLastDayOfMonth(y, mo);
  return `${y}.${mm}.${String(lastDay).padStart(2, '0')}`;
}

// 한 줄에서 YYYY-MM-DD / YYYY.MM.DD / YYYY/MM/DD 또는 YYYY-MM / YYYY.MM / YYYY/MM 형태의 날짜를 찾음
function matchDateFlexible(line){
  if(!line) return null;
  let m = line.match(/(20\d{2})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m) return { y: +m[1], mo: +m[2], d: +m[3] };
  m = line.match(/(20\d{2})[.\-\/](\d{1,2})(?!\d)/);
  if(m) return { y: +m[1], mo: +m[2], d: null };
  return null;
}

// 유효기간: EXP/EXP DATE/EXP.DATE/EXPIRY/EXPIRATION/USE BY/유효기간/유효일자/사용기한 라벨을 우선 탐색.
// MFG·MFD·제조일 라벨은 절대 유효기간으로 쓰지 않음 (라벨 자체를 EXP 계열만 검색하므로 구조적으로 방지됨).
// 라벨을 못 찾으면 전체에서 아무 날짜나 가져오지 않고 빈값으로 남김.
const EXP_LABELS = ['EXP DATE', 'EXP.DATE', 'EXPIRY DATE', 'EXPIRATION DATE', 'USE BY', 'EXPIRY', 'EXPIRATION', 'EXP', '유효기간', '유효일자', '사용기한'];

function extractExpiryGuess(text){
  if(!text) return '';
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const upperLines = lines.map(l => l.toUpperCase());
  for(const label of EXP_LABELS){
    const labelUp = label.toUpperCase();
    for(let i = 0; i < lines.length; i++){
      const idx = upperLines[i].indexOf(labelUp);
      if(idx === -1) continue;
      const rest = lines[i].slice(idx + labelUp.length);
      let dp = matchDateFlexible(rest) || matchDateFlexible(lines[i]);
      if(!dp){
        for(let off = 1; off <= 2 && !dp; off++){
          if(lines[i + off]) dp = matchDateFlexible(lines[i + off]);
        }
      }
      if(dp) return formatExpiryParts(dp.y, dp.mo, dp.d);
    }
  }
  return '';
}

// ===================== 제품 마스터(카탈로그) 유사도 매칭 ===================== //
// OCR로 읽은 제품코드 후보를 제품 마스터 전체와 비교해서 정확일치/유사후보를 찾음.
// 대소문자·공백·하이픈 차이는 무시하고, 그래도 다르면 편집거리로 유사도를 계산함 (숫자/영문 OCR 혼동 보정 포함).

// 제품코드 정규화 - 비교용으로만 사용 (원래 표기는 그대로 유지)
function normalizeCodeForMatch(s){
  if(!s) return '';
  return s.toString().toUpperCase().replace(/[\s\-_.\/]/g, '')
    .replace(/O/g, '0').replace(/I/g, '1').replace(/L/g, '1').replace(/S/g, '5').replace(/B/g, '8'); // 흔한 OCR 혼동 문자 보정
}

// 카탈로그 전체에서 OCR 후보 코드와 가장 비슷한 항목들을 찾아 점수순으로 반환
// 반환: [{code, name, score}] - score 0이면 정확일치, 클수록 덜 비슷함. limit개까지.
function findCatalogMatches(catalog, candidateCode, limit){
  if(!catalog || catalog.length === 0 || !candidateCode) return [];
  const normCandidate = normalizeCodeForMatch(candidateCode);
  if(!normCandidate) return [];
  const scored = catalog.map(item => {
    const normItem = normalizeCodeForMatch(item.code);
    let score;
    if(normItem === normCandidate) score = 0;
    else score = levenshtein(normItem, normCandidate);
    return { code: item.code, name: item.name, score };
  });
  return scored
    .filter(s => s.score <= 3) // 너무 다른 건 후보에서 제외 (오탐 방지)
    .sort((a,b) => a.score - b.score)
    .slice(0, limit || 5);
}

// 제품명 텍스트(OCR 전체 텍스트)에서 카탈로그 제품명과 겹치는 단어가 있는 항목을 찾음 (코드 후보가 아예 없을 때 보조용)
function findCatalogMatchesByName(catalog, ocrText, limit){
  if(!catalog || catalog.length === 0 || !ocrText) return [];
  const upper = ocrText.toUpperCase();
  const scored = [];
  for(const item of catalog){
    if(!item.name) continue;
    const nameUp = item.name.toUpperCase();
    // 제품명에서 3자 이상인 토큰들이 OCR 텍스트에 포함되는지 확인
    const tokens = nameUp.split(/[^A-Z0-9가-힣]+/).filter(t => t.length >= 3);
    const hitCount = tokens.filter(t => upper.includes(t)).length;
    if(hitCount > 0) scored.push({ code: item.code, name: item.name, score: -hitCount }); // 많이 겹칠수록 우선(score 작을수록 우선)
  }
  return scored.sort((a,b) => a.score - b.score).slice(0, limit || 5);
}

function parseCatalogText(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if(lines.length === 0) return [];
  let dataLines = lines;
  const firstCols = lines[0].split(/\t|,/).map(c => c.trim());
  if(firstCols.join(' ').includes('제품코드') || firstCols.join(' ').includes('제품명')) dataLines = lines.slice(1);
  return dataLines.map(line => {
    const cols = line.split('\t').length > 1 ? line.split('\t') : line.split(',');
    const code = (cols[0] || '').trim();
    const name = (cols[1] || '').trim();
    const valid = !!code && !!name;
    return { code, name, valid, include: valid };
  });
}

function renderCatalogPreview(){

          <td>${escapeHtml(r.code) || '-'}</td>

    </tbody>`;
}

function renderCatalogList(filterText){
  const listEl = document.getElementById('pc_list');
  if(!listEl) return;
  const q = (filterText || '').trim().toLowerCase();
  const items = q
    ? productCatalogCache.filter(it => (it.code||'').toLowerCase().includes(q) || (it.name||'').toLowerCase().includes(q))
    : productCatalogCache;
  if(productCatalogCache.length === 0){
    listEl.innerHTML = `<div class="hint" style="text-align:center; padding:12px 0;">등록된 제품이 없어요</div>`;
    return;
  }
  if(items.length === 0){
    listEl.innerHTML = `<div class="hint" style="text-align:center; padding:12px 0;">검색 결과가 없어요</div>`;
    return;
  }
  const shown = items.slice(0, 50);
  listEl.innerHTML = `<div class="hint" style="margin-bottom:8px;">${q ? `검색 결과 ${items.length}건` : `전체 ${items.length}건`}${items.length > 50 ? ' · 최근 50건만 표시 (검색해서 좁혀보세요)' : ''}</div>` +
    shown.map(it => `
    <div class="item-card">
      <div class="item-card-top">
        <div>
          <div class="it-lot">${escapeHtml(it.code)}</div>
          <div class="it-name">${escapeHtml(it.name)}</div>
        </div>
        <div class="it-actions">
          <button onclick="editCatalogEntry('${escapeHtml(it.code)}','${escapeHtml(it.name)}')">수정</button>
          <button onclick="deleteCatalogEntry('${escapeHtml(it.code)}')">삭제</button>
        </div>
      </div>
    </div>`).join('');
}

function parsePartnerText(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if(lines.length === 0) return [];
  let dataLines = lines;
  const firstCols = lines[0].split(/\t|,/).map(c => c.trim());
  if(firstCols.join(' ').includes('파트너')) dataLines = lines.slice(1); // 헤더행 자동 스킵
  return dataLines.map(line => {
    const cols = line.split('\t').length > 1 ? line.split('\t') : line.split(',');
    const code = (cols[0] || '').trim();
    const name = (cols[1] || '').trim();
    const valid = !!code && !!name;
    return { code, name, valid, include: valid };
  });
}

function renderPartnerPreview(){
  const validCount = partnerBulkRows.filter(r => r.valid).length;
  document.getElementById('pmPreviewSummary').innerHTML =
    `총 <b>${partnerBulkRows.length}</b>행 인식 · 유효 <b>${validCount}</b>건${partnerBulkRows.length - validCount > 0 ? ` · 코드/이름 누락 ${partnerBulkRows.length - validCount}건은 제외됐어요` : ''}`;
  const table = document.getElementById('pmPreviewTable');
  table.innerHTML = `
    <thead><tr><th></th><th>파트너코드</th><th>파트너명</th></tr></thead>
    <tbody>
      ${partnerBulkRows.map((r, i) => `
        <tr class="${r.valid ? '' : 'invalid'}">
          <td class="chk"><input type="checkbox" ${r.include ? 'checked' : ''} ${r.valid ? '' : 'disabled'} onchange="partnerBulkRows[${i}].include=this.checked"></td>
          <td>${escapeHtml(r.code) || '-'}</td>
          <td>${escapeHtml(r.name) || '-'}</td>
        </tr>`).join('')}
    </tbody>`;
}

async function loadPartnerList(){
  const loading = document.getElementById('pm_loading');
  const listEl = document.getElementById('pm_list');
  if(!loading || !listEl) return;
  loading.style.display = 'block';

  const items = await window.fbListPartnerMaster();

  loading.style.display = 'none';

    listEl.innerHTML = `<div class="hint" style="text-align:center; padding:12px 0;">등록된 파트너가 없어요</div>`;

function wizardStepsBarHtml(){

  return `<div class="wizard-steps">${labels.map((l,i)=>{
    const n = i+1;
    const cls = n < wz.step ? 'done' : (n === wz.step ? 'active' : '');

  }).join('')}</div>
  <div class="step-label">${wz.step}/4 단계 · ${labels[wz.step-1]}</div>`;

function renderWizardStep(){

}

  });
  codeInput.addEventListener('itemselected', (e)=>{
    if(e.detail && e.detail.name){ nameInputForFill.value = e.detail.name; } // 제품 선택 시 제품명은 항상 마스터 값으로 채움
    const rec = document.getElementById('wz_it_catalogRecommend');
    if(rec){ rec.style.display = 'none'; rec.innerHTML = ''; }
  });
  codeInput.addEventListener('focus', ()=>{
    if(codeInput.value.trim()) renderSuggestBox(productCatalogCache, codeInput.value, codeSuggest, codeInput, (item)=> item.code);
  });
  document.addEventListener('click', function hideOnOutside(e){
    if(!codeSuggest.contains(e.target) && e.target !== codeInput){ codeSuggest.style.display = 'none'; }
  });

  const addBtn = document.getElementById('wzAddPhotoBtn');
  const input = document.getElementById('wzDraftPhotoInput');
  addBtn.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{
    if(!input.files.length) return;
    const file = input.files[0];
    const genAtStart = wz.draftGen; // 이 사진 캡처를 시작한 시점의 품목 세대 - 나중에 결과 적용 전 재확인용
    const reader = new FileReader();
    reader.onload = async (e)=>{
      if(wz.draftGen !== genAtStart) return; // 그 사이 품목이 바뀌었으면(추가/취소/수정) 중단
      const dataUrl = e.target.result;
      const idx = wz.draft.photos.length;
      wz.draft.photos.push({ data: dataUrl, rawText: '' });
      renderWzDraftThumbs();
      const progWrap = document.getElementById('wzDraftProgressWrap');
      const resultEl3 = document.getElementById('wzDraftResultMsg');
      if(resultEl3) resultEl3.style.display = 'none';
      if(progWrap){ progWrap.style.display = 'block'; document.getElementById('wzDraftProgress').textContent = `🔄 사진 ${idx+1} 분석 중... (몇 초 걸려요, 기다리지 않고 바로 손으로 입력하셔도 돼요)`; }

      const text = await runOcr(dataUrl);
      if(wz.draftGen !== genAtStart) return; // OCR 끝난 시점에도 재확인 - 그 사이 다른 품목으로 넘어갔으면 결과 버림
      if(idx < wz.draft.photos.length) wz.draft.photos[idx].rawText = text;
      if(progWrap) progWrap.style.display = 'none';

      const codeEl = document.getElementById('wz_it_productCode');
      const nameEl = document.getElementById('wz_it_productName');
      const lotEl = document.getElementById('wz_it_lot');
      const expEl = document.getElementById('wz_it_expiryDate');
      if(!codeEl || !lotEl || !expEl) return; // 화면이 이미 다른 단계/품목으로 넘어간 경우 DOM 없음

      const combined = wz.draft.photos.map(p=>p.rawText).join('\n');
      let found3 = [];

      // 1순위: 제품코드(REF) 라벨 기반 추출
      // 2순위: LOT/제조번호 라벨 기반 추출 (라벨 못 찾으면 무작위 숫자 넣지 않음)
      if(!lotEl.value.trim()){
        const lotGuess = extractLotGuess(combined);
        if(lotGuess){ lotEl.value = lotGuess; found3.push(`LOT ${lotGuess}`); }
      }
      // 3순위: 유효기간(EXP) 라벨 기반 추출 - 월까지만 있으면 자동으로 그 달 말일로 채움, MFG 날짜는 무시
      if(!expEl.value.trim()){
        const dateGuess = extractExpiryGuess(combined);
        if(dateGuess){ expEl.value = dateGuess; found3.push(`유효기간 ${dateGuess}`); }
      }

      // 바코드(GTIN) 끝 6자리로 제품코드 마스터 자동 조회 - 등록해둔 매핑이 있으면 최우선으로 채움
      const gtin = extractGtinCandidate(combined);
      let masterHit = null;
      if(gtin){
        wz.draft.gtinLast6 = gtin.slice(-6);
        masterHit = await window.fbGetProductMaster(wz.draft.gtinLast6);
        if(wz.draftGen !== genAtStart) return; // 마스터 조회 중에도 품목이 바뀌었을 수 있음
      }
      const recommendEl = document.getElementById('wz_it_catalogRecommend');
      if(recommendEl){ recommendEl.style.display = 'none'; recommendEl.innerHTML = ''; }

      if(masterHit && masterHit.productCode){
        codeEl.value = masterHit.productCode;
        let enrichedName = masterHit.productName;
        if(!enrichedName){
          const catalogHit = productCatalogCache.find(c => c.code === masterHit.productCode);
          if(catalogHit) enrichedName = catalogHit.name;
        }
        if(enrichedName && !nameEl.value.trim()) nameEl.value = enrichedName;
        wz.draft.masterMatched = true;
        wz.draft.masterOriginalCode = masterHit.productCode;
        found3.push(`제품코드 ${masterHit.productCode} (바코드매핑)`);
      } else if(!codeEl.value.trim()){
        // OCR 후보 코드를 제품 마스터와 비교 - 정확일치면 바로 채우고, 유사후보만 있으면 추천으로 보여줌 (자동 확정 안함)
        const codeGuess = extractProductCodeGuess(combined);
        if(codeGuess){
          const catalogMatches = findCatalogMatches(productCatalogCache, codeGuess, 5);
          const exactHit = catalogMatches.find(m => m.score === 0);
          if(exactHit){
            codeEl.value = exactHit.code;
            if(!nameEl.value.trim()) nameEl.value = exactHit.name;
            found3.push(`제품코드 ${exactHit.code} (제품마스터 일치)`);
          } else {
            codeEl.value = codeGuess; // OCR 원본값은 참고용으로 일단 넣어둠
            found3.push(`제품코드(추정) ${codeGuess} - 아래 추천 확인`);
            if(catalogMatches.length > 0) renderCatalogRecommend(catalogMatches, codeEl, nameEl, recommendEl);
          }
        } else {
          // 코드 후보 자체가 없으면 OCR 전체 텍스트에서 제품명 단어로 후보를 찾아봄
          const nameMatches = findCatalogMatchesByName(productCatalogCache, combined, 5);
          if(nameMatches.length > 0){
            found3.push('제품코드는 못 찾았지만 제품명으로 후보를 찾았어요 - 아래 추천 확인');
            renderCatalogRecommend(nameMatches, codeEl, nameEl, recommendEl);
          }
        }
      }

      const resultEl3b = document.getElementById('wzDraftResultMsg');
      if(resultEl3b){
        resultEl3b.style.display = 'block';
        if(found3.length > 0){
          resultEl3b.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--green); background:var(--green-bg); padding:8px 10px; border-radius:8px; margin-top:8px;">✅ 자동 인식: ${escapeHtml(found3.join(' · '))} - 실물과 대조해서 확인해주세요</div>`;
        } else {
          resultEl3b.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--danger); background:#FBEAE8; padding:8px 10px; border-radius:8px; margin-top:8px;">⚠️ 자동 인식되지 않았어요 - 실물 라벨을 보고 직접 입력해주세요</div>`;
        }
      }
      input.value = '';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('wzAddItemBtn').addEventListener('click', wzCommitDraftItem);

  document.getElementById('wz3NextBtn').addEventListener('click', ()=>{
    const draftHasContent = wz.draft.photos.length > 0 || document.getElementById('wz_it_lot').value.trim() || document.getElementById('wz_it_productName').value.trim();
    const proceed = ()=>{ wz.step = 4; renderWizardStep(); };
    if(wz.items.length === 0){
      document.getElementById('wz3_err').style.display = 'block';
      return;
    }
    if(draftHasContent){
      showAppConfirm('아직 목록에 추가하지 않은 품목 입력값이 있어요.\n무시하고 다음 단계로 진행할까요?', '무시하고 진행', proceed);
      return;
    }
    proceed();
  });
}

function renderWzDraftThumbs(){
  const wrap = document.getElementById('wzDraftThumbs');

  wrap.innerHTML = wz.draft.photos.map((p, i) => `
    <div class="photo-thumb"><img src="${p.data}" alt="사진 ${i+1}"><button class="rm" onclick="wzRemoveDraftPhoto(${i})">✕</button></div>
  `).join('');
}

function wzRemoveDraftPhoto(i){
  wz.draft.photos.splice(i, 1);
  renderWzDraftThumbs();
}

// OCR 후보와 제품 마스터가 정확히 일치하지 않을 때 - 비슷한 후보들을 보여주고 사용자가 직접 선택하게 함 (자동 확정 안함)
function renderCatalogRecommend(matches, codeEl, nameEl, container){
  if(!container || !matches || matches.length === 0) return;
  container.style.display = 'block';
  container.innerHTML = `
    <div style="font-size:12px; font-weight:700; color:var(--steel-dark); margin-bottom:6px;">🔎 비슷한 제품 (제품 마스터에서 찾음 - 맞으면 선택해주세요)</div>
    ${matches.map((m, i) => `
      <div class="suggest-item" style="border:1px solid var(--line); border-radius:8px; margin-bottom:6px;" data-ridx="${i}">
        ${escapeHtml(m.code)} · ${escapeHtml(m.name)}
      </div>`).join('')}
  `;
  container.querySelectorAll('[data-ridx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const m = matches[parseInt(el.dataset.ridx, 10)];
      codeEl.value = m.code;
      nameEl.value = m.name;
      container.style.display = 'none';
      container.innerHTML = '';
      showToast(`${m.code} 선택했어요`);
    });
  });
}

function wzReadDraftFieldsFromDom(){
  wz.draft.productCode = document.getElementById('wz_it_productCode').value.trim();
  wz.draft.productName = document.getElementById('wz_it_productName').value.trim();
  wz.draft.lot = document.getElementById('wz_it_lot').value.trim();
  wz.draft.expiryDate = document.getElementById('wz_it_expiryDate').value.trim();
  wz.draft.quantity = document.getElementById('wz_it_quantity').value.trim();
  const statusEl = document.getElementById('wz_it_status');
  wz.draft.status = statusEl ? statusEl.value : 'A';
}

function freshDraft(){
  return { productCode:'', productName:'', lot:'', expiryDate:'', quantity:'', status:'A', photos:[], gtinLast6:'', masterMatched:false, masterOriginalCode:'' };
}

function wzCommitDraftItem(){
  wzReadDraftFieldsFromDom();
  if(wz.draft.photos.length === 0 || !wz.draft.lot){
    document.getElementById('wz_it_err').style.display = 'block';
    return;
  }
  const committed = { ...wz.draft };
  if(wz.editingItemId){
    const idx = wz.items.findIndex(it => it.id === wz.editingItemId);
    if(idx !== -1){
      wz.items[idx] = { id: wz.editingItemId, ...wz.draft, photos: wz.draft.photos };
    }
    wz.editingItemId = null;
  } else {
    wz.items.push({ id: genId(), ...wz.draft, photos: wz.draft.photos });
  }
  wz.draft = freshDraft();
  wz.draftGen++; // 새 세대 시작 - 이전 품목에 대한 늦은 OCR 응답은 이제 전부 무시됨
  document.getElementById('wz3_err').style.display = 'none';
  renderWizardStep3(document.getElementById('wizardModal'));
  showToast('품목이 목록에 추가됐어요 - 다음 품목을 이어서 촬영해주세요');

  // 바코드는 인식됐는데 마스터에 없거나(신규) 마스터 값과 다르게 수정한 경우 - 다음부터 자동인식되도록 등록 제안
  if(committed.gtinLast6 && committed.productCode){
    const needsSave = !committed.masterMatched || (committed.masterOriginalCode && committed.masterOriginalCode !== committed.productCode);
    if(needsSave){
      const msg = committed.masterMatched
        ? `이 바코드의 마스터 제품코드가 "${committed.masterOriginalCode}"였는데 "${committed.productCode}"로 수정하셨어요.\n마스터를 새 값으로 업데이트할까요?`
        : `이 바코드(끝 6자리: ${committed.gtinLast6})를 제품코드 "${committed.productCode}"로 마스터에 등록해서 다음부터 자동 인식되게 할까요?`;
      showAppConfirm(msg, '마스터 등록', async ()=>{
        const ok = await window.fbSaveProductMaster(committed.gtinLast6, committed.productCode, committed.productName, myName);
        showToast(ok ? '마스터에 등록됐어요 - 다음부터 자동 인식돼요' : '마스터 등록에 실패했어요');
      });
    }
  }
}

function wzEditItem(itemId){
  const it = wz.items.find(x => x.id === itemId);
  if(!it) return;
  wz.draft = { productCode: it.productCode, productName: it.productName, lot: it.lot, expiryDate: it.expiryDate, quantity: it.quantity, status: it.status || 'A', photos: [...it.photos], gtinLast6: it.gtinLast6 || '', masterMatched: !!it.masterMatched, masterOriginalCode: it.masterOriginalCode || '' };
  wz.items = wz.items.filter(x => x.id !== itemId);
  wz.editingItemId = itemId;
  wz.draftGen++; // 새 편집 세션 시작 - 이전에 떠돌던 OCR 응답 전부 무효화
  renderWizardStep3(document.getElementById('wizardModal'));
}

function wzCancelEditItem(){
  if(wz.editingItemId){
    wz.items.push({ id: wz.editingItemId, ...wz.draft, photos: wz.draft.photos });
  }
  wz.draft = freshDraft();
  wz.draftGen++;
  wz.editingItemId = null;
  renderWizardStep3(document.getElementById('wizardModal'));
}

function wzRemoveItem(itemId){
  wz.items = wz.items.filter(x => x.id !== itemId);
  renderWzItemsList();
}

      <div class="item-card">

    <div class="hint">추가 첨부: 인수증 1장${wz.zoomImage ? ' + 반품번호·반품처 확대 1장' : ''}</div>
    <div class="field" style="margin-top:12px;"><label>메모</label><textarea id="wz_memo" placeholder="특이사항 (선택)"></textarea></div>
    <div class="field"><label>등록자 *</label><input id="wz_by" type="text" placeholder="이름" value="${escapeHtml(myName)}"></div>
    <div class="err" id="wz4_err">등록자 이름을 입력해주세요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="wzGoStep(3)">이전</button>
      <button class="btn-submit" id="wz4SubmitBtn">등록 완료</button>
    </div>`;

  document.getElementById('wz4SubmitBtn').addEventListener('click', submitWizard);
