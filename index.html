<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>반품검수기</title>
<meta name="theme-color" content="#2C4A66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="반품검수기">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, getDocs, addDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ⚠️ 반품검수기 전용 Firebase 프로젝트입니다 (블락배치와 별도 프로젝트).
  // Firebase 콘솔에서 새 프로젝트 만든 뒤 아래 값을 그 프로젝트 설정값으로 교체하세요.
  const TEAM_EMAIL = "fmek-return@korea.com";

  const firebaseConfig = {
    apiKey: "AIzaSyCcdLOmr6yicLRfPp_EDJTSztm-a19zuyQ",
    authDomain: "fmek-return.firebaseapp.com",
    projectId: "fmek-return",
    storageBucket: "fmek-return.firebasestorage.app",
    messagingSenderId: "397090358632",
    appId: "1:397090358632:web:7bee300bb5f57ca424c2dd"
  };

  const isConfigured = !firebaseConfig.apiKey.includes('여기에');
  window.__firebaseReady = false;

  if(isConfigured){
    try{
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const recordsCol = collection(db, "returnRecords");
      const photosCol = collection(db, "returnPhotos");
      const masterCol = collection(db, "productMaster"); // 문서 id = 바코드(GTIN) 끝 6자리
      const partnerCol = collection(db, "partnerMaster"); // 문서 id = 파트너코드
      const blockBatchCol = collection(db, "blockBatchMaster"); // 문서 id = 제품코드_LOT (정규화)

      function blockBatchKey(productCode, lot){
        const norm = s => (s||'').toString().toUpperCase().replace(/[\s\-_.\/]/g, '');
        return `${norm(productCode)}_${norm(lot)}`;
      }

      window.fbSaveBlockBatch = async function(productCode, lot, status, memo, by){
        try{
          const key = blockBatchKey(productCode, lot);
          await setDoc(doc(blockBatchCol, key), { key, productCode, lot, status: status || 'B', memo: memo || '', updatedBy: by || '', updatedAt: new Date().toISOString() });
          return true;
        }catch(e){ console.error('블락배치 저장 실패:', e); return false; }
      };
      window.fbListBlockBatch = async function(){
        try{
          const snap = await getDocs(blockBatchCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> (a.productCode||'').localeCompare(b.productCode||''));
        }catch(e){ console.error('블락배치 목록 조회 실패:', e); return []; }
      };
      window.fbDeleteBlockBatch = async function(key){
        try{ await deleteDoc(doc(blockBatchCol, key)); return true; }
        catch(e){ console.error('블락배치 삭제 실패:', e); return false; }
      };
      window.fbGetBlockBatch = async function(productCode, lot){
        try{
          const key = blockBatchKey(productCode, lot);
          const snap = await getDoc(doc(blockBatchCol, key));
          return snap.exists() ? snap.data() : null;
        }catch(e){ console.error('블락배치 조회 실패:', e); return null; }
      };

      window.fbAddRecord = async function(record){
        try{ await setDoc(doc(recordsCol, record.id), record); return true; }
        catch(e){ console.error('Firestore add error:', e); return false; }
      };
      window.fbUpdateRecord = async function(id, patch){
        try{ await updateDoc(doc(recordsCol, id), patch); return true; }
        catch(e){ console.error('Firestore update error:', e); return false; }
      };
      window.fbDeleteRecord = async function(id){
        try{
          await deleteDoc(doc(recordsCol, id));
          const snap = await getDocs(query(photosCol, where('recordId', '==', id)));
          for(const d of snap.docs){ await deleteDoc(doc(photosCol, d.id)); }
          return true;
        }catch(e){ console.error('Firestore delete error:', e); return false; }
      };
      window.fbWatchRecords = function(onData, onError){
        onSnapshot(recordsCol, (snap)=>{
          const data = snap.docs.map(d => d.data());
          onData(data);
        }, (err)=>{ console.error('Firestore watch error:', err); if(onError) onError(err); });
      };

      // 사진은 본문 문서(1MB 제한)와 분리된 별도 컬렉션에 저장 - itemId/lotId로 어느 품목·LOT 사진인지 구분 (receipt/zoom은 둘 다 없음)
      window.fbAddPhoto = async function(recordId, itemId, type, data, lotId){
        try{
          const ref = await addDoc(photosCol, { recordId, itemId: itemId || null, lotId: lotId || null, type, data, uploadedAt: new Date().toISOString() });
          return ref.id;
        }catch(e){ console.error('Firestore photo add error:', e); return null; }
      };
      window.fbGetPhotos = async function(recordId){
        try{
          const snap = await getDocs(query(photosCol, where('recordId', '==', recordId)));
          return snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }catch(e){ console.error('Firestore photo fetch error:', e); return []; }
      };
      window.fbDeletePhoto = async function(photoId){
        try{ await deleteDoc(doc(photosCol, photoId)); return true; }
        catch(e){ console.error('Firestore photo delete error:', e); return false; }
      };
      window.fbUpdatePhotoData = async function(photoId, newData){
        try{ await updateDoc(doc(photosCol, photoId), { data: newData, recompressedAt: new Date().toISOString() }); return true; }
        catch(e){ console.error('Firestore photo update error:', e); return false; }
      };

      // 제품코드 마스터: 바코드(GTIN) 끝 6자리 → 제품코드/제품명 매핑. 한번 등록해두면 다음부터 실물사진 OCR에서 자동 인식됨
      window.fbGetProductMaster = async function(key){
        try{
          const snap = await getDoc(doc(masterCol, key));
          return snap.exists() ? { id: snap.id, ...snap.data() } : null;
        }catch(e){ console.error('마스터 조회 실패:', e); return null; }
      };
      window.fbSaveProductMaster = async function(key, productCode, productName, unit, by){
        try{
          await setDoc(doc(masterCol, key), { key, productCode, productName: productName || '', unit: unit || '', updatedBy: by || '', updatedAt: new Date().toISOString() });
          return true;
        }catch(e){ console.error('마스터 저장 실패:', e); return false; }
      };
      window.fbListProductMaster = async function(){
        try{
          const snap = await getDocs(masterCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> (a.key||'').localeCompare(b.key||''));
        }catch(e){ console.error('마스터 목록 조회 실패:', e); return []; }
      };
      window.fbDeleteProductMaster = async function(key){
        try{ await deleteDoc(doc(masterCol, key)); return true; }
        catch(e){ console.error('마스터 삭제 실패:', e); return false; }
      };

      // 파트너 마스터: 반품처(거래처) 코드 ↔ 이름 매핑. OCR 대신 여기서 검색/선택해서 반품처를 채움
      window.fbSavePartnerMaster = async function(code, name, by){
        try{
          await setDoc(doc(partnerCol, code), { code, name, updatedBy: by || '', updatedAt: new Date().toISOString() });
          return true;
        }catch(e){ console.error('파트너 저장 실패:', e); return false; }
      };
      window.fbBulkSavePartnerMaster = async function(records, by){
        try{
          const chunkSize = 450;
          for(let i = 0; i < records.length; i += chunkSize){
            const chunk = records.slice(i, i + chunkSize);
            const batch = writeBatch(db);
            chunk.forEach(r => batch.set(doc(partnerCol, r.code), { code: r.code, name: r.name, updatedBy: by || '', updatedAt: new Date().toISOString() }));
            await batch.commit();
          }
          return true;
        }catch(e){ console.error('파트너 일괄 저장 실패:', e); return false; }
      };
      window.fbListPartnerMaster = async function(){
        try{
          const snap = await getDocs(partnerCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> (a.code||'').localeCompare(b.code||''));
        }catch(e){ console.error('파트너 목록 조회 실패:', e); return []; }
      };
      window.fbDeletePartnerMaster = async function(code){
        try{ await deleteDoc(doc(partnerCol, code)); return true; }
        catch(e){ console.error('파트너 삭제 실패:', e); return false; }
      };

      // 제품 마스터(카탈로그): 제품코드 ↔ 제품명 전체 목록. 파트너 마스터·바코드매핑(productMaster)과 완전 별개 컬렉션.
      // 문서 id = 제품코드. 품목 등록 시 OCR 후보와 비교해서 추천/검색하는 데 사용.
      const catalogCol = collection(db, "productCatalog");
      window.fbSaveCatalogItem = async function(code, name, by){
        try{
          await setDoc(doc(catalogCol, code), { code, name, updatedBy: by || '', updatedAt: new Date().toISOString() });
          return true;
        }catch(e){ console.error('제품 마스터 저장 실패:', e); return false; }
      };
      window.fbBulkSaveCatalogItems = async function(records, by){
        try{
          const chunkSize = 450;
          for(let i = 0; i < records.length; i += chunkSize){
            const chunk = records.slice(i, i + chunkSize);
            const batch = writeBatch(db);
            chunk.forEach(r => batch.set(doc(catalogCol, r.code), { code: r.code, name: r.name, updatedBy: by || '', updatedAt: new Date().toISOString() }));
            await batch.commit();
          }
          return true;
        }catch(e){ console.error('제품 마스터 일괄 저장 실패:', e); return false; }
      };
      window.fbListCatalogItems = async function(){
        try{
          const snap = await getDocs(catalogCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> (a.code||'').localeCompare(b.code||''));
        }catch(e){ console.error('제품 마스터 목록 조회 실패:', e); return []; }
      };
      window.fbDeleteCatalogItem = async function(code){
        try{ await deleteDoc(doc(catalogCol, code)); return true; }
        catch(e){ console.error('제품 마스터 삭제 실패:', e); return false; }
      };

      // 일괄정리(배송처코드 보정 등) 작업 이력 - 누가 언제 무엇을 몇 건 정리했는지 기록. 앞으로 비슷한 일괄작업이 늘어나도 재사용 가능한 공용 로그.
      const maintenanceLogCol = collection(db, "maintenanceLogs");
      window.fbAddMaintenanceLog = async function(logObj){
        try{ await addDoc(maintenanceLogCol, { ...logObj, createdAt: new Date().toISOString() }); return true; }
        catch(e){ console.error('정리 이력 저장 실패:', e); return false; }
      };
      window.fbListMaintenanceLogs = async function(){
        try{
          const snap = await getDocs(maintenanceLogCol);
          return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
        }catch(e){ console.error('정리 이력 조회 실패:', e); return []; }
      };

      const auth = getAuth(app);
      window.fbLogin = async function(password){
        try{ await signInWithEmailAndPassword(auth, TEAM_EMAIL, password); return true; }
        catch(e){ console.error('Login error:', e); return false; }
      };
      window.fbGuestLogin = async function(){
        try{ await signInAnonymously(auth); return true; }
        catch(e){ console.error('Guest login error:', e); return false; }
      };
      window.fbOnAuthChange = function(callback){
        onAuthStateChanged(auth, (user) => callback(!!user, user ? !!user.isAnonymous : false));
      };
      window.fbLogout = async function(){
        try{ await signOut(auth); return true; }
        catch(e){ console.error('Logout error:', e); return false; }
      };

      window.__firebaseReady = true;
    }catch(e){
      console.error('Firebase init error:', e);
      window.__firebaseReady = false;
    }
  }
  window.__firebaseChecked = true;
</script>
<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --ink:#1B2430; --ink-muted:#5B6672;
    --steel:#2C4A66; --steel-dark:#1D3347;
    --amber:#B4530A; --amber-bg:#FDF1E7;
    --green:#157347; --green-bg:#E9F6EF;
    --blue:#1D4ED8; --blue-bg:#EAF0FE;
    --line:#D7DEE5; --danger:#B3261E;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .app{ max-width:720px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:100px; }

  header{ position:sticky; top:0; z-index:20; background:var(--steel); background-image:linear-gradient(160deg, var(--steel) 0%, var(--steel-dark) 100%); color:#fff; padding:18px 18px 16px; box-shadow:0 2px 10px rgba(0,0,0,.12); }
  .header-top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .header-top > div:first-child{ min-width:0; flex:1 1 auto; }
  .header-top .logout-btn{ flex:0 0 auto; }
  .master-menu-list{ display:flex; flex-direction:column; gap:10px; }
  .master-menu-item{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px 14px; border-radius:12px; border:1px solid var(--line); background:#FBFCFD; cursor:pointer; }
  .master-menu-item:hover{ background:#F1F3F5; border-color:var(--steel); }
  .master-menu-item .mm-icon{ font-size:22px; flex-shrink:0; width:34px; text-align:center; }
  .master-menu-item .mm-text{ display:flex; flex-direction:column; gap:2px; }
  .master-menu-item .mm-text b{ font-size:14px; color:var(--ink); }
  .master-menu-item .mm-text small{ font-size:11.5px; color:var(--ink-muted); font-weight:500; }
  .partner-preview{ font-size:11.5px; font-weight:600; margin-top:6px; padding:6px 10px; border-radius:8px; }
  .partner-preview.ok{ color:var(--green); background:var(--green-bg); }
  .partner-preview.warn{ color:var(--amber); background:var(--amber-bg); }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; letter-spacing:.01em; font-size:22px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .subtitle{ font-size:12px; color:#B9C7D4; margin-top:2px; font-weight:500; }
  .logout-btn{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); color:#DCE5EC; font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .stats-row{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .stat-chip{ display:flex; align-items:center; gap:5px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:5px 11px; font-size:11.5px; font-weight:600; white-space:nowrap; color:#DCE5EC; }
  .stat-chip .n{ font-family:'JetBrains Mono',monospace; font-size:13px; }
  .stat-chip.c-pending .n{ color:#FFD9B3; }
  .stat-chip.c-expected .n{ color:#B9C7D4; }
  .stat-chip.c-inprogress .n{ color:#9DC7FF; }
  .stat-chip.c-confirmed .n{ color:#A6E4C2; }

  .search-row{ margin-top:14px; position:relative; }
  .search-row input{ width:100%; padding:11px 44px 11px 38px; border-radius:10px; border:none; font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:500; background:rgba(255,255,255,.95); color:var(--ink); }
  .search-row input:focus{ outline:2px solid #FFD9B3; outline-offset:1px; }
  .search-icon{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5; font-size:14px; }
  .multi-search-btn{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:29px; height:29px; border-radius:7px; border:none; background:var(--steel-dark); color:#fff; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .multi-chip{ margin-top:9px; display:flex; align-items:center; justify-content:space-between; gap:8px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); border-radius:9px; padding:8px 12px; }
  .multi-chip span{ font-size:12px; font-weight:600; color:#fff; }
  .multi-chip button{ background:none; border:none; color:#FFD9B3; font-weight:700; cursor:pointer; font-size:12px; padding:2px 4px; }
  .print-btn{ background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:9px; cursor:pointer; font-weight:600; }
  .print-btn.active-state{ background:#fff; color:var(--steel-dark); }
  .card-select-chk{ width:19px; height:19px; margin-right:8px; flex-shrink:0; accent-color:var(--steel); cursor:pointer; }
  .modal-tabs{ display:flex; gap:6px; margin-bottom:16px; background:#F1F3F5; border-radius:10px; padding:4px; }
  .modal-tab{ flex:1; text-align:center; padding:8px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--ink-muted); cursor:pointer; }
  .modal-tab.active{ background:#fff; color:var(--steel-dark); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .selection-bar{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:#EAF0F5; border:1px solid #C7D8E5; border-radius:10px; padding:10px 14px; margin:0 0 12px; }
  .selection-bar .left{ display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--steel-dark); }
  .selection-bar .left input{ width:17px; height:17px; accent-color:var(--steel); cursor:pointer; }
  .selection-bar .actions{ display:flex; gap:8px; }
  .selection-bar button{ font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:8px; border:none; cursor:pointer; }
  .selection-bar .btn-sel-delete{ background:var(--danger); color:#fff; }
  .selection-bar .btn-sel-clear{ background:none; color:var(--ink-muted); border:1px solid var(--line); }

  .tabs{ display:flex; gap:5px; margin-top:12px; }
  .tab{ flex:1; text-align:center; padding:9px 4px; border-radius:8px; font-size:11.5px; font-weight:600; background:rgba(255,255,255,.08); color:#C9D5DF; cursor:pointer; border:1px solid transparent; }
  .tab.active{ background:#fff; color:var(--steel-dark); }
  .tab.active[data-filter="pending"]{ background:var(--amber); color:#fff; }
  .tab.active[data-filter="inprogress"]{ background:var(--blue); color:#fff; }
  .tab.active[data-filter="expected"]{ background:var(--steel); color:#fff; }
  .tab.active[data-filter="confirmed"]{ background:var(--green); color:#fff; }
  .tab.active[data-filter="master"]{ background:var(--steel-dark); color:#fff; }

  .list{ padding:16px 14px 0; display:flex; flex-direction:column; gap:10px; }
  #selectionBar{ margin:14px 14px 0; }
  .empty{ text-align:center; padding:60px 20px; color:var(--ink-muted); }
  .empty .big{ font-size:32px; margin-bottom:8px; }
  .empty p{ font-size:13.5px; margin:4px 0; }

  .card{ background:var(--surface); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(20,30,40,.08); border:1px solid var(--line); position:relative; }
  .card.pending{ border-left:6px solid var(--amber); }
  .card.confirmed{ border-left:6px solid var(--green); }
  .card.expected{ border-left:6px solid var(--steel); }
  .card-inner{ padding:14px 14px 14px 16px; }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .lot{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15.5px; letter-spacing:.01em; }
  .product{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }

<script>
let records = [];
let currentFilter = 'all';
let searchTerm = '';
let myName = '';
let isGuestMode = false;
let multiTokens = []; // 반품번호/LOT 여러 건 한번에 검색용
let selectedIds = new Set();
let dateFrom = '';
let dateTo = '';

function showToast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2200); }
function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso); const pad = n => String(n).padStart(2,'0'); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function elapsedDays(fromIso, toIso){
  if(!fromIso) return 0;
  const to = toIso ? new Date(toIso) : new Date();
  return Math.max(0, Math.floor((to - new Date(fromIso)) / 86400000));
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// 파트너 마스터/제품 마스터 검색창 공용 자동완성 드롭다운 - code/name 부분일치로 필터링, 선택하면 입력칸에 채워짐
function renderSuggestBox(list, query, container, inputEl, displayFn){
  const q = query.trim().toLowerCase();
  if(!q){ container.style.display = 'none'; container.innerHTML = ''; return; }
  const matches = (list || []).filter(item =>
    (item.code || '').toLowerCase().includes(q) || (item.name || '').toLowerCase().includes(q)
  ).slice(0, 8);
  if(matches.length === 0){
    container.style.display = 'block';
    container.innerHTML = `<div class="suggest-item" style="color:var(--ink-muted); cursor:default;">일치하는 항목이 없어요</div>`;
    return;
  }
  container.style.display = 'block';
  container.innerHTML = matches.map((item, i) => `<div class="suggest-item" data-idx="${i}">${escapeHtml(item.code)} · ${escapeHtml(item.name)}</div>`).join('');
  container.querySelectorAll('.suggest-item[data-idx]').forEach((el)=>{
    el.addEventListener('click', ()=>{
      const item = matches[parseInt(el.dataset.idx, 10)];
      inputEl.value = displayFn(item);
      container.style.display = 'none';
      container.innerHTML = '';
      inputEl.dispatchEvent(new CustomEvent('itemselected', { detail: item }));
    });
  });
}

function loadMyName(){ try{ const v = localStorage.getItem('returnCheck_myName'); if(v) myName = v; }catch(e){} }
function saveMyName(name){ myName = name; try{ localStorage.setItem('returnCheck_myName', name); }catch(e){} }

function waitForFirebase(){
  return new Promise((resolve)=>{
    const check = ()=>{ if(window.__firebaseChecked) resolve(); else setTimeout(check, 50); };
    check();
  });
}

function initRealtimeSync(){
  document.getElementById('list').innerHTML = '<div class="loading">불러오는 중...</div>';
  window.fbWatchRecords(
    (data) => { records = data; render(); },
    (err) => { showToast('실시간 동기화 연결 실패 - 새로고침 해주세요'); }
  );
}

const STATUS_LABEL = { expected:'예정', pending:'검수대기', inprogress:'검수중(임시저장)', confirmed:'검수완료' };
const STATUS_ICON = { expected:'📋', pending:'⏳', inprogress:'🔄', confirmed:'✅' };

// 품목(실물 제품) 상태값 - 블락배치와 동일한 코드 체계 중 우선 5개만 사용
const ITEM_STATUS_LABEL = { A:'정상', B:'판정대기', D:'부적합', E:'유효기간경과', F:'유효기간임박' };
const ITEM_STATUS_COLOR = { A:'var(--green)', B:'var(--blue)', D:'var(--danger)', E:'var(--danger)', F:'var(--amber)' };

function itemsOf(r){ return Array.isArray(r.items) ? r.items : []; }

function getFiltered(){
  let list = [...records];
  if(currentFilter !== 'all') list = list.filter(r => r.status === currentFilter);

  if(multiTokens.length > 0){
    list = list.filter(r => {
      const rn = (r.returnNumber || '').toLowerCase();
      if(multiTokens.some(t => rn === t || rn.includes(t))) return true;
      return itemsOf(r).some(it => {
        if((it.lot || '').toLowerCase() && multiTokens.some(t => (it.lot||'').toLowerCase() === t)) return true;
        return Array.isArray(it.lots) && it.lots.some(l => multiTokens.some(t => (l.lot||'').toLowerCase() === t));
      });
    });
  } else if(searchTerm.trim()){
    const q = searchTerm.trim().toLowerCase();
    list = list.filter(r => {
      if((r.returnNumber||'').toLowerCase().includes(q)) return true;
      if((r.hospitalName||'').toLowerCase().includes(q)) return true;
      return itemsOf(r).some(it =>
        (it.productCode||'').toLowerCase().includes(q) ||
        (it.productName||'').toLowerCase().includes(q) ||
        (it.lot||'').toLowerCase().includes(q) ||
        (Array.isArray(it.lots) && it.lots.some(l => (l.lot||'').toLowerCase().includes(q)))
      );
    });
  }

  if(dateFrom || dateTo){
    // 검수완료 탭에서는 검수완료일 기준, 그 외(전체/검수대기)는 등록일 기준으로 기간을 적용함
    const useConfirmedDate = currentFilter === 'confirmed';
    const fromTime = dateFrom ? new Date(dateFrom + 'T00:00:00').getTime() : null;
    const toTime = dateTo ? new Date(dateTo + 'T23:59:59').getTime() : null;
    list = list.filter(r => {
      const basis = useConfirmedDate ? r.confirmedAt : r.registeredAt;
      if(!basis) return false;
      const t = new Date(basis).getTime();
      if(fromTime !== null && t < fromTime) return false;
      if(toTime !== null && t > toTime) return false;
      return true;
    });
  }

  return list.sort((a,b) => new Date(b.registeredAt) - new Date(a.registeredAt));
}

function itemVerifiedQty(it){
  if(!Array.isArray(it.lots)) return 0;
  return it.lots.reduce((sum,l)=> sum + (parseFloat(l.quantity)||0), 0);
}
function isExcelItem(it){ return it.expectedQuantity !== undefined && it.expectedQuantity !== null && it.expectedQuantity !== ''; }

// 반품건 전체의 입고 진행상태를 판정. "실물없는 반품"으로 등록한 LOT(D상태·XXXXX)도 수량에는
// 정상 포함되므로, 실물이 없어도 사유를 남기고 정식으로 수량을 채우면 입고완료로 인정됨.
// 예정품목(엑셀등록)이 하나도 없는 건(예정외 등록만 있는 건)은 판정 대상이 아니라 null 반환.
function recordReceivingLabel(rec){
  const its = itemsOf(rec).filter(isExcelItem);
  if(its.length === 0) return null; // 예정품목 자체가 없는 건(예정외 등록만 있는 건) - 수량 게이팅 대상 아님
  let anyVerified = false, allComplete = true;
  its.forEach(it => {
    const v = itemVerifiedQty(it);
    const e = parseFloat(it.expectedQuantity) || 0;
    if(v > 0) anyVerified = true;
    // 예정외 품목(expectedQuantity 기본값 0)은 최소 1개는 확인해야 충족, 일반품목은 수정된 0(=예정없음)도 충족으로 인정
    const itemDone = it.isUnexpected ? v > 0 : v >= e;
    if(!itemDone) allComplete = false;
  });
  if(allComplete) return { label: '입고완료', color: 'var(--green)', bg: 'var(--green-bg)' };
  if(anyVerified) return { label: '부분입고', color: 'var(--amber)', bg: 'var(--amber-bg)' };
  // [버그수정] 여기서 null을 반환했더니 "게이팅 대상 아님"과 같은 취급을 받아서, 아직 하나도
  // 확인 안 된(0/N) 새 건인데도 완료버튼이 활성화되는 문제가 있었음 - 별도 상태로 구분함
  return { label: '검수전', color: 'var(--ink-muted)', bg: '#F1F3F5' };
}

    const blockBatchCount = its.reduce((sum, it) => sum + (Array.isArray(it.lots) ? it.lots.filter(l => l.blockBatch).length : 0), 0);

            <div style="min-width:0;">
              <div class="lot">${escapeHtml(r.returnNumber || '(반품번호 미확인)')} ${recvInfo && recvInfo.label !== '검수전' && r.status !== 'confirmed' ? `<span style="font-size:10px; font-weight:700; color:${recvInfo.color}; background:${recvInfo.bg}; padding:2px 7px; border-radius:8px; vertical-align:middle;">${recvInfo.label}</span>` : ''}</div>
              <div class="product">${escapeHtml(r.hospitalName || '병원명 미입력')} · 품목 ${its.length}건</div>
            </div>

        </div>
        ${mismatchCount > 0 ? `<div style="font-size:11px; font-weight:700; color:var(--danger); background:#FBEAE8; padding:5px 9px; border-radius:8px; margin-top:6px; display:inline-block;">⚠️ 제품코드 불일치 LOT ${mismatchCount}건 (${mismatchCodes.map(c=>escapeHtml(c)).join(', ')})</div>` : ''}
        ${blockBatchCount > 0 ? `<div style="font-size:11px; font-weight:700; color:#fff; background:var(--steel-dark); padding:5px 9px; border-radius:8px; margin-top:6px; display:inline-block; margin-left:6px;">🚫 블락배치 LOT ${blockBatchCount}건</div>` : ''}
        <div class="meta-row">
          <span>등록 <b>${escapeHtml(r.registeredBy)}</b></span>

          ${r.status !== 'confirmed'
            ? `<span style="color:var(--amber); font-weight:600;">⏱ ${elapsedDays(r.registeredAt)}일 경과</span>`
            : `<span style="color:var(--green); font-weight:600;">⏱ 등록→완료 ${elapsedDays(r.registeredAt, r.confirmedAt)}일 소요</span>`}
        </div>
        ${its.length > 0 ? `<div class="item-chip-list">
          ${shown.map(it => {
            if(isExcelItem(it)){
              const verified = itemVerifiedQty(it);
              const expected = parseFloat(it.expectedQuantity) || 0;
              const complete = it.isUnexpected ? verified > 0 : verified >= expected; // 예정외 품목(expectedQuantity 기본값 0)은 최소 1개는 확인해야 완료로 인정, 일반품목은 수정된 0도 인정
              const lotCount = Array.isArray(it.lots) ? it.lots.length : 0;
              return `<div class="item-chip"><span class="ic-name">${escapeHtml(it.productName || it.productCode || '제품명 미입력')}${complete ? ' <span style="color:var(--green); font-weight:700;">✓완료</span>' : ''}</span><span class="ic-lot">${escapeHtml(it.productCode || '')} · ${verified}/${expected}개 · LOT ${lotCount}건</span></div>`;
            }
            const st = it.status || 'A';
            return `<div class="item-chip"><span class="ic-name">${escapeHtml(it.productName || it.productCode || '제품명 미입력')} <span style="font-size:9.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st] || 'var(--ink-muted)'}; padding:1px 6px; border-radius:8px;">${st}</span></span><span class="ic-lot">${escapeHtml(it.lot || '-')}</span></div>`;
          }).join('')}
          ${moreCount > 0 ? `<div class="item-chip" style="justify-content:center; color:var(--ink-muted);">+${moreCount}건 더보기</div>` : ''}
        </div>` : ''}
        ${r.memo ? `<div class="memo">${escapeHtml(r.memo)}</div>` : ''}
        ${r.status === 'confirmed' ? `<div class="memo">✅ 검수완료 · ${escapeHtml(r.confirmedBy||'')} · ${r.confirmedAt ? fmtDate(r.confirmedAt) : ''}${r.confirmMemo ? '<br>' + escapeHtml(r.confirmMemo) : ''}</div>` : ''}
        <div class="photo-badge">🖼 사진 ${(r.photoCount ?? '?')}장</div>
        <div class="card-actions">

          ${!isGuestMode ? `<button class="btn-sm btn-del" style="flex:1;" onclick="openDeleteConfirm('${r.id}')">삭제</button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateMultiChip(){
  const chip = document.getElementById('multiChip');
  const input = document.getElementById('searchInput');
  if(multiTokens.length > 0){
    const matched = records.filter(r => {
      const rn = (r.returnNumber||'').toLowerCase();
      if(multiTokens.some(t => rn === t || rn.includes(t))) return true;
      return itemsOf(r).some(it => Array.isArray(it.lots) && it.lots.some(l => multiTokens.some(t => (l.lot||'').toLowerCase() === t)));
    }).length;
    chip.style.display = 'flex';
    chip.innerHTML = `<span>반품번호/LOT ${multiTokens.length}건 다중검색 중 · 매칭 ${matched}건</span><button onclick="clearMultiSearch()">✕ 해제</button>`;
    input.disabled = true;
    input.value = '';
    input.placeholder = `${multiTokens.length}건 다중검색 중`;
  } else {
    chip.style.display = 'none';
    input.disabled = false;
    input.placeholder = '반품번호, 제품코드, 제품명, LOT 검색';
  }
}

function clearMultiSearch(){ multiTokens = []; render(); }

function applyDateFilterFromModal(){
  dateFrom = document.getElementById('dateFromInput').value;
  dateTo = document.getElementById('dateToInput').value;
  if(!dateFrom && !dateTo){ showToast('시작일 또는 종료일을 선택해주세요'); return; }
  closeOverlay('multiSearchOverlay');
  render();
  showToast('기간 조회 적용됨');
}

function applyMultiSearch(){
  const raw = document.getElementById('msBox').value;
  const tokens = raw.split(/[\s,;]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
  const unique = [...new Set(tokens)];
  if(unique.length === 0){ document.getElementById('ms_err').style.display = 'block'; return; }
  multiTokens = unique;
  searchTerm = '';
  closeOverlay('multiSearchOverlay');
  render();
  showToast(`${unique.length}건 검색 적용`);
}

// ===================== 선택 모드 / 일괄 삭제 ===================== //

function toggleSelect(id, checked){
  if(checked) selectedIds.add(id);
  else selectedIds.delete(id);
  renderSelectionBar(getFiltered());
}

function toggleSelectAll(checked){
  const ids = getFiltered().map(r => r.id);
  if(checked) ids.forEach(id => selectedIds.add(id));
  else ids.forEach(id => selectedIds.delete(id));
  render();
}

function clearSelection(){ selectedIds.clear(); render(); }

function renderSelectionBar(currentList){
  const bar = document.getElementById('selectionBar');
  if(!bar) return;
  if(isGuestMode || selectedIds.size === 0){ bar.innerHTML = ''; return; }
  const count = selectedIds.size;
  const visibleIds = currentList.map(r => r.id);
  const allChecked = visibleIds.length > 0 && visibleIds.every(id => selectedIds.has(id));
  bar.innerHTML = `<div class="selection-bar">
    <div class="left">
      <input type="checkbox" id="selectAllChk" ${allChecked ? 'checked' : ''} onchange="toggleSelectAll(this.checked)">
      <span>전체 선택 · ${count}건 선택됨</span>
    </div>
    <div class="actions">
      <button class="btn-sel-clear" onclick="clearSelection()">선택 해제</button>
      <button class="btn-sel-delete" onclick="openBulkDeleteModal()">선택 삭제</button>
    </div>
  </div>`;
}

function openBulkDeleteModal(){
  const count = selectedIds.size;
  if(count === 0){ showToast('선택된 항목이 없어요'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'bulkDeleteOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>선택 항목 삭제</h2>
    <p style="font-size:13.5px; color:var(--ink-muted); line-height:1.6;">선택하신 <b style="color:var(--danger);">${count}건</b>과 첨부된 품목·사진을 모두 삭제할까요?<br>삭제하면 되돌릴 수 없어요.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('bulkDeleteOverlay')">취소</button>
      <button class="btn-submit" style="background:var(--danger);" id="bulkDeleteBtn">삭제</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('bulkDeleteOverlay'); });
  document.getElementById('bulkDeleteBtn').addEventListener('click', async ()=>{
    const ids = [...selectedIds];
    closeOverlay('bulkDeleteOverlay');
    showToast(`${ids.length}건 삭제 중...`);
    let successCount = 0;
    for(const id of ids){
      const ok = await window.fbDeleteRecord(id);
      if(ok){
        successCount++;
        try{
          const photos = await window.fbGetPhotos(id);
          for(const p of photos){ await window.fbDeletePhoto(p.id); }
        }catch(e){}
      }
    }
    records = records.filter(r => !ids.includes(r.id));
    selectedIds.clear();
    render();
    showToast(`${successCount}/${ids.length}건 삭제 완료`);
  });
}

// ===================== 기간 조회 ===================== //

function updateDateFilterHint(){
  const hint = document.getElementById('dateFilterHint');
  if(!hint) return;
  if(dateFrom || dateTo){
    const basisLabel = currentFilter === 'confirmed' ? '검수완료일' : '등록일';
    hint.style.display = 'block';
    hint.innerHTML = `📅 ${basisLabel} 기준 ${dateFrom || '처음'} ~ ${dateTo || '지금'} 조회 중 · <span style="text-decoration:underline; cursor:pointer;" onclick="clearDateFilter()">해제</span>`;
  } else {
    hint.style.display = 'none';
    hint.innerHTML = '';
  }
}

function clearDateFilter(){
  dateFrom = ''; dateTo = '';
  const f = document.getElementById('dateFromInput'); if(f) f.value = '';
  const t = document.getElementById('dateToInput'); if(t) t.value = '';
  render();
}

function showAppConfirm(message, confirmLabel, onConfirm){
  closeOverlay('appConfirmOverlay');
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'appConfirmOverlay';
  overlay.innerHTML = `<div class="modal"><h2>확인</h2>
    <p style="font-size:13.5px; color:var(--ink); line-height:1.6; white-space:pre-line;">${escapeHtml(message)}</p>
    <div class="modal-actions">

      <button class="btn-submit" id="appConfirmOk">${escapeHtml(confirmLabel || '확인')}</button>

function closeOverlay(id){ document.querySelectorAll('#' + id).forEach(el => el.remove()); }

  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('editRecordOverlay'); });

  const hospInput = document.getElementById('er_hospitalName');
  const hospSuggest = document.getElementById('er_partnerSuggest');
  let erSelectedPartnerCode = rec.partnerCode || '';
  window.fbListPartnerMaster().then(list => { partnerMasterCache = list; renderPartnerPreview('er_partnerPreview', hospInput.value, erSelectedPartnerCode); });
  hospInput.addEventListener('input', ()=>{
    renderSuggestBox(partnerMasterCache, hospInput.value, hospSuggest, hospInput, (item)=> `${item.code} ${item.name}`);
    renderPartnerPreview('er_partnerPreview', hospInput.value, erSelectedPartnerCode);
  });
  hospInput.addEventListener('focus', ()=>{ if(hospInput.value.trim()) renderSuggestBox(partnerMasterCache, hospInput.value, hospSuggest, hospInput, (item)=> `${item.code} ${item.name}`); });
  hospInput.addEventListener('itemselected', (e)=>{
    if(e.detail) erSelectedPartnerCode = e.detail.code || '';
    renderPartnerPreview('er_partnerPreview', hospInput.value, erSelectedPartnerCode);
  });
  document.addEventListener('click', function hideOnOutside(e){
    if(!hospSuggest.contains(e.target) && e.target !== hospInput){ hospSuggest.style.display = 'none'; }
  });

  renderEditRecordItemsList(id);

  document.getElementById('er_saveBtn').addEventListener('click', async ()=>{
    const returnNumber = document.getElementById('er_returnNumber').value.trim();
    const hospitalName = document.getElementById('er_hospitalName').value.trim();
    const memo = document.getElementById('er_memo').value.trim();
    if(!returnNumber){ document.getElementById('er_err').style.display = 'block'; return; }
    const partnerCode = resolvePartnerCodeFromInput(hospitalName, erSelectedPartnerCode) || rec.partnerCode || '';
    Object.assign(rec, { returnNumber, hospitalName, partnerCode, memo });
    render();
    closeOverlay('editRecordOverlay');
    const ok = await window.fbUpdateRecord(id, { returnNumber, hospitalName, partnerCode, memo });
    showToast(ok ? '수정됐어요' : '수정됐지만 저장에 실패했어요');
  });
}

function renderEditRecordItemsList(recordId){
  const wrap = document.getElementById('er_itemsList');
  if(!wrap) return;
  const rec = records.find(r => r.id === recordId);
  if(!rec) return;
  const its = itemsOf(rec);
  if(its.length === 0){
    wrap.innerHTML = `<div class="hint" style="text-align:center; padding:10px 0;">등록된 품목이 없어요</div>`;
    return;
  }
  wrap.innerHTML = its.map(it => {
    if(isExcelItem(it)){
      const verified = itemVerifiedQty(it);
      const expected = parseFloat(it.expectedQuantity) || 0;
      const complete = it.isUnexpected ? verified > 0 : verified >= expected; // 예정외 품목(expectedQuantity 기본값 0)은 최소 1개는 확인해야 완료로 인정, 일반품목은 수정된 0도 인정
      return `
      <div class="item-card">
        <div class="item-card-top">
          <div>
            <div class="it-name">${escapeHtml(it.productName || it.productCode || '제품명 미입력')} ${complete ? '<span style="color:var(--green); font-weight:700;">✅ 완료</span>' : ''}</div>
            <div class="it-lot">${escapeHtml(it.productCode)}</div>
            <div class="it-meta">예정 ${expected}개 · 확인 ${verified}개 · LOT ${Array.isArray(it.lots) ? it.lots.length : 0}건</div>
          </div>
          <div class="it-actions">
            <button onclick="openEditExcelItemModal('${recordId}','${it.id}')">수정</button>
            <button onclick="closeOverlay('editRecordOverlay'); openInspectModal('${recordId}')">실물검수</button>
          </div>
        </div>
      </div>`;
    }
    const st = it.status || 'A';
    return `
    <div class="item-card">
      <div class="item-card-top">
        <div>
          <div class="it-name">${escapeHtml(it.productName || it.productCode || '제품명 미입력')} <span style="font-size:10.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st] || 'var(--ink-muted)'}; padding:2px 7px; border-radius:10px; margin-left:4px;">${st} · ${ITEM_STATUS_LABEL[st] || st}</span></div>
          <div class="it-lot">LOT ${escapeHtml(it.lot || '-')}</div>
          <div class="it-meta">${it.productCode ? '제품코드 ' + escapeHtml(it.productCode) + ' · ' : ''}${it.expiryDate ? '유효기간 ' + escapeHtml(it.expiryDate) : ''}${it.quantity ? ' · 수량 ' + escapeHtml(it.quantity) : ''}</div>
        </div>
        <div class="it-actions">
          <button onclick="openEditItemModal('${recordId}','${it.id}', true)">수정</button>
          <button onclick="deleteItemFromRecord('${recordId}','${it.id}', true)">삭제</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openConfirmModal(id){
  closeOverlay('confirmOverlay');
  const rec = records.find(r => r.id === id);
  if(!rec) return;
  // 최종 방어선: 목록/실물검수 버튼이 정상적으로 게이팅해주지만, 혹시 모를 다른 진입 경로로
  // 여기까지 왔을 때를 대비해 여기서도 한 번 더 확인함 (이중 안전장치)
  const recvInfo = recordReceivingLabel(rec);
  if(recvInfo && recvInfo.label !== '입고완료'){
    showToast('아직 수량이 다 채워지지 않았어요 - 실물검수에서 완료 후 다시 시도해주세요');
    return;
  }
  const mismatchCount = itemsOf(rec).reduce((sum, it) => sum + (Array.isArray(it.lots) ? it.lots.filter(l => l.codeMismatch).length : 0), 0);
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'confirmOverlay';
  overlay.innerHTML = `<div class="modal"><h2>검수완료 처리</h2>
    ${mismatchCount > 0 ? `<div style="font-size:12px; font-weight:700; color:var(--danger); background:#FBEAE8; padding:8px 10px; border-radius:8px; margin-bottom:12px;">⚠️ 제품코드가 다르게 스캔된 LOT ${mismatchCount}건이 포함된 채로 확정돼요</div>` : ''}
    <div class="field"><label>반품번호</label><input type="text" value="${escapeHtml(rec.returnNumber||'')}" disabled></div>
    <div class="field"><label>검수자 *</label><input id="cf_by" type="text" placeholder="이름" value="${escapeHtml(myName)}"></div>
    <div class="field"><label>검수 메모</label><textarea id="cf_memo" placeholder="이상 유무, 특이사항 (선택)"></textarea></div>
    <div class="err" id="cf_err">검수자 이름을 입력해주세요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('confirmOverlay')">취소</button>
      <button class="btn-submit green" onclick="submitConfirm('${id}')">검수완료 확정</button>
    </div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('confirmOverlay'); });
}

async function submitConfirm(id){
  const by = document.getElementById('cf_by').value.trim();
  const memo = document.getElementById('cf_memo').value.trim();
  if(!by){ document.getElementById('cf_err').style.display = 'block'; return; }
  const now = new Date().toISOString();
  const patch = { status: 'confirmed', confirmedBy: by, confirmedAt: now, confirmMemo: memo };
  const rec = records.find(r => r.id === id);
  if(rec) Object.assign(rec, patch);
  render();
  closeOverlay('confirmOverlay');
  await saveMyName(by);
  const ok = await window.fbUpdateRecord(id, patch);
  showToast(ok ? '검수완료 처리 완료' : '처리됐지만 저장에 실패했어요');
}

function openDeleteConfirm(id){
  closeOverlay('delConfirmOverlay');
  const rec = records.find(r => r.id === id);

// ===================== 상세보기 (품목별 사진 갤러리) ===================== //

async function openDetail(id){
  closeOverlay('detailOverlay');
  const rec = records.find(r => r.id === id);
  if(!rec) return;
  const its = itemsOf(rec);
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'detailOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>${escapeHtml(rec.returnNumber || '반품 상세')}</h2>
    <div class="field"><label>병원명</label><input type="text" value="${escapeHtml(rec.hospitalName||'-')}" disabled></div>
    ${!isGuestMode ? `<button class="btn-sm btn-edit" style="margin-bottom:10px;" onclick="closeOverlay('detailOverlay'); openEditRecordModal('${id}')">✏️ 반품번호·병원명 수정</button>` : ''}
    <div class="loading" id="detailPhotoLoading">사진 불러오는 중...</div>
    <div id="detailBody" style="display:none;"></div>
    <div class="modal-actions"><button class="btn-cancel" style="flex:1;" onclick="closeOverlay('detailOverlay')">닫기</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('detailOverlay'); });

  const photos = await window.fbGetPhotos(id);
  document.getElementById('detailPhotoLoading').style.display = 'none';
  const body = document.getElementById('detailBody');
  body.style.display = 'block';

  const receiptPhotos = photos.filter(p => p.type === 'receipt' || p.type === 'zoom');
  const TYPE_LABEL = { receipt:'📄 인수증 원본', zoom:'🔍 반품번호·반품처 확대' };

  let html = '';
  html += `<div class="item-section-title">인수증 사진</div>`;
  if(receiptPhotos.length > 0){
    html += `<div class="cert-gallery">`;
    html += receiptPhotos.map(p => `
      <div class="cert-gallery-item">
        <img src="${p.data}" alt="사진" onclick="window.open('${p.data}','_blank')">
        <div class="cert-gallery-meta">
          <span>${TYPE_LABEL[p.type] || '사진'} · ${p.uploadedAt ? fmtDate(p.uploadedAt) : ''}</span>
          ${!isGuestMode ? `<button class="btn-sm btn-del" onclick="deletePhotoFromDetail('${id}','${p.id}')">삭제</button>` : ''}
        </div>
      </div>`).join('');
    html += `</div>`;
  } else {
    html += `<div class="hint" style="margin-bottom:8px;">아직 첨부된 인수증 사진이 없어요</div>`;
  }
  if(!isGuestMode){
    html += `<div style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="btn-cancel" style="flex:1;" onclick="document.getElementById('detailReceiptCameraInput').click()">📷 촬영</button>
      <button class="btn-cancel" style="flex:1;" onclick="document.getElementById('detailReceiptGalleryInput').click()">🖼 앨범</button>
    </div>
    <input type="file" id="detailReceiptCameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="detailReceiptGalleryInput" accept="image/*" style="display:none;">`;
  }

  its.forEach(it => {
    if(isExcelItem(it)){
      const verified = itemVerifiedQty(it);
      const expected = parseFloat(it.expectedQuantity) || 0;
      const complete = it.isUnexpected ? verified > 0 : verified >= expected; // 예정외 품목(expectedQuantity 기본값 0)은 최소 1개는 확인해야 완료로 인정, 일반품목은 수정된 0도 인정
      const lots = Array.isArray(it.lots) ? it.lots : [];
      html += `<div class="item-section-title" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
        <span>📦 ${escapeHtml(it.productName || it.productCode || '제품명 미입력')} <span style="font-size:10.5px; color:var(--ink-muted);">(${escapeHtml(it.productCode)})</span> ${complete ? '<span style="color:var(--green); font-weight:700;">✅ 완료</span>' : `<span style="color:var(--steel); font-weight:700;">예정 ${expected} / 확인 ${verified}</span>`}</span>
        ${!isGuestMode ? `<button class="btn-sm btn-edit" onclick="closeOverlay('detailOverlay'); openAddLotModal('${id}','${it.id}')">+ LOT 추가</button>` : ''}
      </div>`;
      if(lots.length === 0){
        html += `<div class="hint">아직 확인된 LOT이 없어요</div>`;
      } else {
        lots.forEach(l => {
          const lPhotos = photos.filter(p => p.lotId === l.id);
          const st = l.status || 'A';
          html += `<div class="meta-row" style="margin-bottom:${l.codeMismatch ? '2' : '6'}px;">
            <span>LOT <b>${escapeHtml(l.lot)}</b></span>
            <span>유효기간 <b>${escapeHtml(l.expiryDate||'-')}</b></span>
            <span>수량 <b>${escapeHtml(String(l.quantity))}</b></span>
            <span style="font-size:9.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st]||'var(--ink-muted)'}; padding:2px 7px; border-radius:10px;">${st}</span>
            ${!isGuestMode ? `<button class="btn-sm btn-del" onclick="deleteLotFromItem('${id}','${it.id}','${l.id}')">삭제</button>` : ''}
          </div>
          ${l.codeMismatch ? `<div style="font-size:11px; font-weight:700; color:var(--danger); margin-bottom:6px;">⚠️ ${escapeHtml(l.codeMismatch.source)}로 스캔된 코드(${escapeHtml(l.codeMismatch.scannedCode)})가 예정 제품코드(${escapeHtml(l.codeMismatch.expectedCode)})와 달라요</div>` : ''}
          ${l.blockBatch ? `<div style="font-size:11px; font-weight:700; color:var(--steel-dark); margin-bottom:6px;">🚫 블락배치 LOT (상태 ${escapeHtml(l.blockBatch.status)})${l.blockBatch.memo ? ' · ' + escapeHtml(l.blockBatch.memo) : ''}</div>` : ''}`;
          if(lPhotos.length > 0){
            html += `<div class="cert-gallery">` + lPhotos.map(p => `
              <div class="cert-gallery-item">
                <img src="${p.data}" alt="실물사진" onclick="window.open('${p.data}','_blank')">
                <div class="cert-gallery-meta">
                  <span>📦 LOT ${escapeHtml(l.lot)} 사진 · ${p.uploadedAt ? fmtDate(p.uploadedAt) : ''}</span>
                  ${!isGuestMode ? `<button class="btn-sm btn-del" onclick="deletePhotoFromDetail('${id}','${p.id}')">삭제</button>` : ''}
                </div>
              </div>`).join('') + `</div>`;
          }
        });
      }
      return;
    }
    const itPhotos = photos.filter(p => p.itemId === it.id && !p.lotId);
    const st = it.status || 'A';
    html += `<div class="item-section-title" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
      <span>📦 ${escapeHtml(it.productName || it.productCode || '제품명 미입력')} · LOT ${escapeHtml(it.lot || '-')} <span style="font-size:10.5px; font-weight:700; color:#fff; background:${ITEM_STATUS_COLOR[st] || 'var(--ink-muted)'}; padding:2px 7px; border-radius:10px; margin-left:4px;">${st} · ${ITEM_STATUS_LABEL[st] || st}</span></span>
      ${!isGuestMode ? `<span style="display:flex; gap:6px;">
        <button class="btn-sm btn-edit" onclick="closeOverlay('detailOverlay'); openEditItemModal('${id}','${it.id}')">수정</button>
        <button class="btn-sm btn-del" onclick="deleteItemFromRecord('${id}','${it.id}')">삭제</button>
      </span>` : ''}
    </div>
    <div class="meta-row" style="margin-bottom:8px;">
      ${it.productCode ? `<span>제품코드 <b>${escapeHtml(it.productCode)}</b></span>` : ''}
      ${it.expiryDate ? `<span>유효기간 <b>${escapeHtml(it.expiryDate)}</b></span>` : ''}
      ${it.quantity ? `<span>수량 <b>${escapeHtml(it.quantity)}</b></span>` : ''}
    </div>`;
    if(itPhotos.length === 0){
      html += `<div class="hint">첨부된 실물사진이 없어요</div>`;
    } else {
      html += `<div class="cert-gallery">` + itPhotos.map(p => `
        <div class="cert-gallery-item">
          <img src="${p.data}" alt="실물사진" onclick="window.open('${p.data}','_blank')">
          <div class="cert-gallery-meta">
            <span>📦 실물사진 · ${p.uploadedAt ? fmtDate(p.uploadedAt) : ''}</span>
            ${!isGuestMode ? `<button class="btn-sm btn-del" onclick="deletePhotoFromDetail('${id}','${p.id}')">삭제</button>` : ''}
          </div>
        </div>`).join('') + `</div>`;
    }
  });

  if(its.length === 0 && receiptPhotos.length === 0 && isGuestMode){
    html = `<div class="hint" style="text-align:center; padding:20px;">등록된 품목·사진이 없어요</div>`;
  } else if(its.length === 0){
    html += `<div class="hint" style="text-align:center; padding:12px 0;">등록된 품목이 없어요</div>`;
  }
  body.innerHTML = html;
  const uploadReceiptFile = async (file)=>{
    const reader = new FileReader();
    reader.onload = async (e)=>{
      showToast('인수증 사진 업로드 중...');
      const c = await compressPhoto(e.target.result);
      const pid = await window.fbAddPhoto(id, null, 'receipt', c);
      if(pid){
        const rec = records.find(r => r.id === id);
        if(rec){ rec.photoCount = (rec.photoCount || 0) + 1; await window.fbUpdateRecord(id, { photoCount: rec.photoCount }); render(); }
        showToast('인수증 사진이 첨부됐어요');
        openDetail(id);
      } else {
        showToast('업로드에 실패했어요');
      }
    };
    reader.readAsDataURL(file);
  };
  const receiptCameraInput = document.getElementById('detailReceiptCameraInput');
  const receiptGalleryInput = document.getElementById('detailReceiptGalleryInput');
  if(receiptCameraInput) receiptCameraInput.addEventListener('change', ()=>{ if(receiptCameraInput.files.length) uploadReceiptFile(receiptCameraInput.files[0]); });
  if(receiptGalleryInput) receiptGalleryInput.addEventListener('change', ()=>{ if(receiptGalleryInput.files.length) uploadReceiptFile(receiptGalleryInput.files[0]); });
}

function deletePhotoFromDetail(recordId, photoId){
  showAppConfirm('이 사진을 삭제할까요? 삭제하면 되돌릴 수 없어요.', '삭제', async ()=>{
    const ok = await window.fbDeletePhoto(photoId);
    if(ok){
      const rec = records.find(r => r.id === recordId);
      if(rec && typeof rec.photoCount === 'number'){
        rec.photoCount = Math.max(0, rec.photoCount - 1);
        await window.fbUpdateRecord(recordId, { photoCount: rec.photoCount });
      }
      showToast('사진 삭제 완료');
      openDetail(recordId);
    } else {
      showToast('삭제에 실패했어요');
    }
  });
}
