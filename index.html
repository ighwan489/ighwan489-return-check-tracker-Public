// 예정외로 추가했던 품목을 통째로 삭제 (현장 상황이 바뀌어서 취소되거나, 담당자가 잘못 추가했을 때)
async function deleteUnexpectedItem(recordId, itemId){
  const rec = records.find(r => r.id === recordId);
  if(!rec) return;
  const its = itemsOf(rec);
  const it = its.find(x => x.id === itemId);
  if(!it) return;
  const lotCount = Array.isArray(it.lots) ? it.lots.length : 0;
  showAppConfirm(
    `"${it.productName || it.productCode}" 예정외 품목을 삭제할까요?${lotCount > 0 ? `\n등록된 LOT ${lotCount}건과 첨부사진도 같이 삭제돼요.` : ''}\n삭제하면 되돌릴 수 없어요.`,
    '삭제',
    async ()=>{
      const remaining = its.filter(x => x.id !== itemId);
      rec.items = remaining;
      render();
      closeOverlay('inspectOverlay');
      const ok = await window.fbUpdateRecord(recordId, { items: remaining });
      try{
        const photos = await window.fbGetPhotos(recordId);
        const orphan = photos.filter(p => p.itemId === itemId);
        for(const p of orphan){ await window.fbDeletePhoto(p.id); }
        if(orphan.length > 0 && typeof rec.photoCount === 'number'){
          rec.photoCount = Math.max(0, rec.photoCount - orphan.length);
          await window.fbUpdateRecord(recordId, { photoCount: rec.photoCount });
        }
      }catch(e){ console.warn('예정외 품목 사진 정리 실패:', e); }
      showToast(ok ? '예정외 품목이 삭제됐어요' : '삭제됐지만 저장에 실패했어요');
      openInspectModal(recordId);
    }
  );
}

function deleteLotFromItem(recordId, itemId, lotId){
  showAppConfirm('이 LOT을 삭제할까요? 첨부사진도 같이 삭제되고 되돌릴 수 없어요.', '삭제', async ()=>{
    const rec = records.find(r => r.id === recordId);
    if(!rec) return;
    const its = itemsOf(rec);
    const it = its.find(x => x.id === itemId);
    if(!it || !Array.isArray(it.lots)) return;
    it.lots = it.lots.filter(l => l.id !== lotId);
    rec.items = its;
    render();
    const ok = await window.fbUpdateRecord(recordId, { items: its });
    const photos = await window.fbGetPhotos(recordId);
    const orphan = photos.filter(p => p.lotId === lotId);
    for(const p of orphan){ await window.fbDeletePhoto(p.id); }
    if(orphan.length > 0 && typeof rec.photoCount === 'number'){
      rec.photoCount = Math.max(0, rec.photoCount - orphan.length);
      await window.fbUpdateRecord(recordId, { photoCount: rec.photoCount });
    }
    showToast(ok ? 'LOT 삭제 완료' : '삭제됐지만 일부 실패했어요');
    openInspectModal(recordId);
  });
}

let lotDraftGen = 0;
let lotDraftPhotos = [];
let lotDraftMismatch = null; // 이 LOT을 추가하는 동안 감지된 제품코드 불일치 정보 (있으면 LOT에 같이 저장돼서 검수완료 시에도 계속 보임)
let lotDraftBlockBatch = null; // 이 LOT이 블락배치 마스터와 매칭됐을 때의 {status, memo}
let lotFieldAutoFilled = false;
let expFieldAutoFilled = false;

// LOT 추가 모달의 "제품코드 확인 검색" - 사용자가 직접 코드 일부를 검색해서 실물과 대조할 수 있게 함.
// OCR/바코드가 짧은 뒷자리만 읽어서 애매한 경우에도 여기서 직접 확인·선택 가능.
function renderAlCodeSearchResult(query, expectedCode){
  const el = document.getElementById('al_codeSearchResult');
  if(!el) return;
  const q = (query || '').trim();
  if(!q){ el.style.display = 'none'; el.innerHTML = ''; return; }
  const normQ = normalizeCodeForMatch(q);
  const matches = (productCatalogCache || []).filter(c =>
    normalizeCodeForMatch(c.code).includes(normQ) || (c.name || '').toUpperCase().includes(q.toUpperCase())
  ).slice(0, 8);
  if(matches.length === 0){ el.style.display = 'block'; el.innerHTML = `<div class="hint">일치하는 제품마스터 항목이 없어요</div>`; return; }
  el.style.display = 'block';
  el.innerHTML = matches.map(c => {
    const isExpected = normalizeCodeForMatch(c.code) === normalizeCodeForMatch(expectedCode);
    return `<div class="suggest-item" data-code="${escapeHtml(c.code)}" style="cursor:pointer; padding:7px 10px; border:1px solid ${isExpected ? 'var(--green)' : 'var(--line)'}; border-radius:8px; margin-bottom:5px; font-size:12.5px;">
      <b>${escapeHtml(c.code)}</b> ${isExpected ? '<span style="color:var(--green); font-weight:700;">· 예정 코드와 일치</span>' : ''}
      <div style="color:var(--ink-muted); font-size:11.5px;">${escapeHtml(c.name || '')}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-code]').forEach(elx => {
    elx.addEventListener('click', async ()=>{
      const chosenCode = elx.dataset.code;
      const resultEl = document.getElementById('al_resultMsg');
      if(normalizeCodeForMatch(chosenCode) === normalizeCodeForMatch(expectedCode)){
        lotDraftMismatch = null;
        if(resultEl){ resultEl.style.display = 'block'; resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--green); background:var(--green-bg); padding:8px 10px; border-radius:8px;">✅ 선택하신 코드(${escapeHtml(chosenCode)})가 예정 제품코드와 일치해요</div>`; }
      } else {
        lotDraftMismatch = { scannedCode: chosenCode, expectedCode, source: '수동확인' };
        if(resultEl){ resultEl.style.display = 'block'; resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--danger); background:#FBEAE8; padding:8px 10px; border-radius:8px;">⚠️ 선택하신 코드(${escapeHtml(chosenCode)})가 예정 제품코드(${escapeHtml(expectedCode)})와 달라요</div>`; }
      }
      const lotEl = document.getElementById('al_lot');
      if(lotEl && lotEl.value.trim()) await checkBlockBatchForLot([chosenCode, expectedCode], lotEl.value.trim());
      showToast('제품코드 확인 결과가 반영됐어요');
    });
  });
}

async function openAddLotModal(recordId, itemId){
  closeOverlay('addLotOverlay');
  const rec = records.find(r => r.id === recordId);
  if(!rec) return;
  const its = itemsOf(rec);
  const it = its.find(x => x.id === itemId);
  if(!it) return;
  lotDraftPhotos = [];
  lotDraftMismatch = null;
  lotDraftBlockBatch = null;
  lotFieldAutoFilled = false; // LOT 필드가 사용자 직접입력이 아니라 OCR/바코드 자동입력인지 - 재촬영 시 덮어쓸지 판단용
  expFieldAutoFilled = false;
  lotDraftGen++;
  const myGen = lotDraftGen;

  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'addLotOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>LOT 추가 · ${escapeHtml(it.productName || it.productCode)}</h2>
    <div class="hint">제품코드 <b>${escapeHtml(it.productCode)}</b>가 실물과 맞는지 사진으로 대조해요. 예정 ${escapeHtml(String(it.expectedQuantity||''))}개 / 현재 확인 ${itemVerifiedQty(it)}개</div>
    <div class="photo-thumbs" id="al_thumbs"></div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="photo-add-btn" id="al_addPhotoCameraBtn" style="width:auto; flex:1; height:44px; border-radius:9px; font-size:13px; gap:6px;">📷 촬영</button>
      <button class="photo-add-btn" id="al_addPhotoGalleryBtn" style="width:auto; flex:1; height:44px; border-radius:9px; font-size:13px; gap:6px;">🖼 앨범</button>
    </div>
    <input type="file" id="al_photoCameraInput" accept="image/*" capture="environment" style="display:none;">
    <input type="file" id="al_photoGalleryInput" accept="image/*" style="display:none;">
    <div id="al_progress" style="display:none;"><div class="ocr-progress">🔄 분석 중...</div></div>
    <div id="al_resultMsg" style="display:none;"></div>
    <div id="al_blockBatchBanner" style="display:none;"></div>
    <div class="field" style="position:relative;">
      <label>제품코드 확인 (검색해서 대조)</label>
      <input id="al_codeSearch" type="text" autocomplete="off" placeholder="제품코드 뒷자리로 검색해서 실물과 대조해보세요">
      <div id="al_codeSearchResult" style="display:none; margin-top:6px;"></div>
    </div>
    <div class="field" style="margin-top:14px;"><label>제조번호(LOT) *</label><input id="al_lot" type="text" autocomplete="off" placeholder="실물 라벨의 LOT 번호"></div>
    <div id="al_lotCandidates" style="display:none; margin:-4px 0 10px;"></div>
    <div class="field"><label>유효기간</label><input id="al_expiryDate" type="text" autocomplete="off" placeholder="예: 2028.03 → 2028.03.31"></div>
    <div class="field"><label>수량 *</label><input id="al_quantity" type="text" autocomplete="off" placeholder="예: 5"></div>
    <div class="field"><label>상태값</label>
      <select id="al_status">${Object.keys(ITEM_STATUS_LABEL).map(k=>`<option value="${k}" ${k==='A'?'selected':''}>${k} · ${ITEM_STATUS_LABEL[k]}</option>`).join('')}</select>
    </div>
    <div class="err" id="al_err">LOT과 수량은 필수예요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('addLotOverlay')">취소</button>
      <button class="btn-submit" id="al_saveBtn">이 LOT 추가</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('addLotOverlay'); });

  // 사용자가 직접 타이핑하면 그 순간부터는 "자동입력됨" 상태를 해제해서, 이후 재촬영해도 덮어쓰지 않음
  let bbCheckTimer = null;
  document.getElementById('al_lot').addEventListener('input', (e)=>{
    lotFieldAutoFilled = false;
    clearTimeout(bbCheckTimer);
    const val = e.target.value;
    bbCheckTimer = setTimeout(()=> checkBlockBatchForLot([it.productCode, lotDraftMismatch?.scannedCode], val), 400);
  });
  document.getElementById('al_expiryDate').addEventListener('input', ()=>{ expFieldAutoFilled = false; });

  window.fbListCatalogItems().then(list => { productCatalogCache = list; });
  document.getElementById('al_codeSearch').addEventListener('input', (e)=> renderAlCodeSearchResult(e.target.value, it.productCode));

  const cameraBtn = document.getElementById('al_addPhotoCameraBtn');
  const galleryBtn = document.getElementById('al_addPhotoGalleryBtn');
  const cameraInput = document.getElementById('al_photoCameraInput');
  const galleryInput = document.getElementById('al_photoGalleryInput');
  cameraBtn.addEventListener('click', ()=> cameraInput.click());
  galleryBtn.addEventListener('click', ()=> galleryInput.click());
  const handleLotPhotoChange = (srcInput)=>{
    if(!srcInput.files.length) return;
    const file = srcInput.files[0];
    const reader = new FileReader();
    reader.onload = async (e)=>{
      if(lotDraftGen !== myGen) return;
      const dataUrl = e.target.result;
      const pidx = lotDraftPhotos.length;
      lotDraftPhotos.push({ data: dataUrl, rawText: '' });
      renderAlThumbs();
      const prog = document.getElementById('al_progress');
      const resMsg = document.getElementById('al_resultMsg');
      if(resMsg) resMsg.style.display = 'none';
      if(prog) prog.style.display = 'block';
      const text = await runOcr(dataUrl);
      if(lotDraftGen !== myGen) return;
      lotDraftPhotos[pidx].rawText = text;
      if(prog) prog.style.display = 'none';

      // 실제 바코드 그래픽 디코딩 시도 (텍스트 OCR보다 훨씬 정확함 - 성공하면 최우선 적용)
      const barcodeRaw = await decodeBarcodeFromImage(dataUrl);
      if(lotDraftGen !== myGen) return;
      const bcApply = await applyBarcodeGraphicResult(barcodeRaw, it, myGen);
      if(lotDraftGen !== myGen) return;
      let barcodeDecodeFailed = bcApply.failed;
      let barcodeFound = bcApply.found;

      const combined = lotDraftPhotos.map(p=>p.rawText).join('\n');
      let found = [...barcodeFound];
      const lotEl = document.getElementById('al_lot');
      const expEl = document.getElementById('al_expiryDate');
      if(!lotEl || !expEl) return;

      const codeGuess = extractProductCodeGuess(combined);
      let resolvedCodeGuess = codeGuess;
      let codeSource = '텍스트';
      if(!resolvedCodeGuess){
        // "REF"/"제품코드" 같은 라벨을 못 찾았으면, 바코드 밑에 찍힌 (01)GTIN 코드로 제품마스터 조회를 시도함
        const gs1Text = extractGs1FromOcrText(combined);
        if(gs1Text.gtin){
          const masterHit = await window.fbGetProductMaster(gs1Text.gtin.slice(-6));
          if(masterHit && masterHit.productCode){
            resolvedCodeGuess = masterHit.productCode;
            codeSource = 'GS1코드';
          }
        }
      }
      let mismatchWarn = '';
      let ambiguousCodeInfo = null;
      if(resolvedCodeGuess){
        const matchResult = compareCodeMatch(resolvedCodeGuess, it.productCode, 6);
        if(matchResult === 'match'){
          found.push(`제품코드 일치 확인${codeSource === 'GS1코드' ? ' (GS1코드)' : ''}`);
        } else if(matchResult === 'ambiguous'){
          ambiguousCodeInfo = { scannedCode: resolvedCodeGuess, expectedCode: it.productCode };
        } else {
          mismatchWarn = `⚠️ 사진에서 읽은 코드(${escapeHtml(resolvedCodeGuess)})가 예정 제품코드(${escapeHtml(it.productCode)})와 달라요 - 실물을 다시 확인해주세요!`;
          lotDraftMismatch = { scannedCode: resolvedCodeGuess, expectedCode: it.productCode, source: codeSource };
        }
      }

      const lotCandEl = document.getElementById('al_lotCandidates');
      if(!lotEl.value.trim() || lotFieldAutoFilled){
        const lotGuess = extractLotGuess(combined);
        if(lotGuess){ lotEl.value = lotGuess; lotFieldAutoFilled = true; found.push(`LOT ${lotGuess}`); if(lotCandEl){ lotCandEl.style.display='none'; lotCandEl.innerHTML=''; } await checkBlockBatchForLot(it.productCode, lotGuess); }
        else if(lotCandEl){
          const candidates = extractLotCandidates(combined, it.productCode);
          if(candidates.length > 0){
            lotCandEl.style.display = 'block';
            lotCandEl.innerHTML = `<div class="hint" style="margin-bottom:4px;">🔎 후보 (탭해서 선택):</div>` +
              candidates.map((c,ci)=>`<span class="suggest-item" style="display:inline-block; width:auto; border:1px solid var(--line); border-radius:16px; padding:5px 12px; margin:2px 4px 2px 0;" data-c="${ci}">${escapeHtml(c)}</span>`).join('');
            lotCandEl.querySelectorAll('[data-c]').forEach(elx=>{
              elx.addEventListener('click', ()=>{ lotEl.value = candidates[parseInt(elx.dataset.c,10)]; lotFieldAutoFilled = false; lotCandEl.style.display='none'; lotCandEl.innerHTML=''; checkBlockBatchForLot(it.productCode, lotEl.value); });
            });
          }
        }
      }
      if(!expEl.value.trim() || expFieldAutoFilled){
        const dateGuess = extractExpiryGuess(combined);
        if(dateGuess){ expEl.value = dateGuess; expFieldAutoFilled = true; found.push(`유효기간 ${dateGuess}`); }
      }

      // 예정 제품코드와 불일치가 감지됐다면 실제 스캔된 코드도 후보에 포함해서 블락배치 최종 대조
      // (사진 처리 도중 여러 단계를 거치므로, 모든 판정이 끝난 이 시점에 한 번 더 확실하게 확인함)
      const finalLotValue = lotEl.value.trim();
      const bbCandidates = [it.productCode];
      if(lotDraftMismatch && lotDraftMismatch.scannedCode) bbCandidates.push(lotDraftMismatch.scannedCode);
      if(finalLotValue) await checkBlockBatchForLot(bbCandidates, finalLotValue);

      const resultEl = document.getElementById('al_resultMsg');
      if(resultEl){
        resultEl.style.display = 'block';
        const debugHtml = `<details style="margin-top:8px;"><summary style="font-size:11.5px; color:var(--ink-muted); cursor:pointer; font-weight:600;">🔍 OCR 원문 보기 (디버그용)</summary><pre style="white-space:pre-wrap; font-size:10.5px; color:var(--ink-muted); background:#F7F8FA; padding:10px; border-radius:8px; margin-top:6px; max-height:180px; overflow-y:auto; font-family:'JetBrains Mono',monospace;">${escapeHtml(combined||'(없음)')}</pre></details>`;
        const cropRetryBtnId = `bcCropRetryBtn_${pidx}_${myGen}`;
        const barcodeFailNote = barcodeDecodeFailed
          ? `<div style="font-size:11.5px; font-weight:600; color:var(--amber); background:var(--amber-bg); padding:7px 10px; border-radius:8px; margin-top:6px;">
              📷 바코드 막대 인식은 실패했어요 (텍스트 인식으로만 채워졌어요) - 바코드 주변에 여백을 두고 정면에서 다시 찍으면 인식률이 올라가요
              <button type="button" id="${cropRetryBtnId}" style="display:block; width:100%; margin-top:7px; padding:8px; border-radius:7px; border:1px dashed var(--amber); background:#fff; color:var(--amber); font-weight:700; font-size:11.5px; cursor:pointer;">✂️ 바코드 부분만 잘라서 재시도</button>
            </div>`
          : '';
        if(ambiguousCodeInfo){
          resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--amber); background:var(--amber-bg); padding:8px 10px; border-radius:8px;">🔎 코드 뒷자리만 인식됐어요(${escapeHtml(ambiguousCodeInfo.scannedCode)}) - 위 "제품코드 확인" 검색창에서 실제 코드를 찾아 선택해주세요</div>${barcodeFailNote}${debugHtml}`;
          const codeSearchInput = document.getElementById('al_codeSearch');
          if(codeSearchInput && !codeSearchInput.value.trim()){
            codeSearchInput.value = ambiguousCodeInfo.scannedCode;
            renderAlCodeSearchResult(ambiguousCodeInfo.scannedCode, it.productCode);
          }
        } else if(mismatchWarn){
          resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--danger); background:#FBEAE8; padding:8px 10px; border-radius:8px;">${mismatchWarn}</div>${barcodeFailNote}${debugHtml}`;
        } else if(found.length > 0){
          resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--green); background:var(--green-bg); padding:8px 10px; border-radius:8px;">✅ ${escapeHtml(found.join(' · '))}</div>${barcodeFailNote}${debugHtml}`;
        } else {
          resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--ink-muted); background:#F1F3F5; padding:8px 10px; border-radius:8px;">인식된 정보가 없어요 - 직접 입력해주세요</div>${barcodeFailNote}${debugHtml}`;
        }
        if(barcodeDecodeFailed){
          const cropBtn = document.getElementById(cropRetryBtnId);
          if(cropBtn){
            cropBtn.addEventListener('click', ()=>{
              openBarcodeCropRetry(dataUrl, async (croppedCode)=>{
                if(lotDraftGen !== myGen) return;
                const retryApply = await applyBarcodeGraphicResult(croppedCode, it, myGen);
                if(lotDraftGen !== myGen) return;
                if(!retryApply.failed && retryApply.found.length > 0){
                  showToast('바코드 재인식 성공!');
                  const debugHtmlNow = resultEl.querySelector('details') ? resultEl.querySelector('details').outerHTML : '';
                  resultEl.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--green); background:var(--green-bg); padding:8px 10px; border-radius:8px;">✅ ${escapeHtml(retryApply.found.join(' · '))} (잘라서 재인식)</div>${debugHtmlNow}`;
                } else {
                  showToast('바코드는 읽었지만 값을 못 뽑아냈어요');
                }
              });
            });
          }
        }
      }
      srcInput.value = '';
    };
    reader.readAsDataURL(file);
  };
  cameraInput.addEventListener('change', ()=> handleLotPhotoChange(cameraInput));
  galleryInput.addEventListener('change', ()=> handleLotPhotoChange(galleryInput));

  document.getElementById('al_saveBtn').addEventListener('click', async ()=>{
    const lot = document.getElementById('al_lot').value.trim();
    const quantity = document.getElementById('al_quantity').value.trim();
    if(!lot || !quantity){ document.getElementById('al_err').style.display = 'block'; return; }
    const expiryDate = document.getElementById('al_expiryDate').value.trim();
    const status = document.getElementById('al_status').value;
    const newLot = { id: genId(), lot, expiryDate, quantity, status };
    if(lotDraftMismatch){ newLot.codeMismatch = lotDraftMismatch; }
    if(lotDraftBlockBatch){ newLot.blockBatch = lotDraftBlockBatch; }
    if(!Array.isArray(it.lots)) it.lots = [];
    it.lots.push(newLot);
    rec.items = its;
    render();
    closeOverlay('addLotOverlay');

    const ok = await window.fbUpdateRecord(recordId, { items: its });
    let uploaded = 0;
    for(const p of lotDraftPhotos){
      const c = await compressPhoto(p.data);
      const pid = await window.fbAddPhoto(recordId, itemId, 'product', c, newLot.id);
      if(pid) uploaded++;
    }
    if(uploaded > 0){
      rec.photoCount = (rec.photoCount || 0) + uploaded;
      await window.fbUpdateRecord(recordId, { photoCount: rec.photoCount });
    }
    showToast(ok ? 'LOT이 추가됐어요' : '추가됐지만 저장에 일부 실패했어요');
    openInspectModal(recordId);
  });
}

// ===================== 실물없는 반품 빠른 등록 (부족분 - 사유를 남기고 수량만 채움) ===================== //
// LOT=XXXXX 고정, 유효기간 공란, 상태값 D(부적합) 고정, 비고 "실물없는 반품" 자동입력.
// 사진 없이 수량만 입력하면 되도록 별도의 가벼운 모달로 분리함 (LOT 추가 모달과 다른 용도라 섞지 않음).
async function openNoPhysicalModal(recordId, itemId){
  closeOverlay('noPhysicalOverlay');
  const rec = records.find(r => r.id === recordId);
  if(!rec) return;
  const its = itemsOf(rec);
  const it = its.find(x => x.id === itemId);
  if(!it) return;
  const expected = parseFloat(it.expectedQuantity) || 0;
  const verified = itemVerifiedQty(it);
  const remaining = Math.max(0, expected - verified);

  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'noPhysicalOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>📦 실물없는 반품 등록</h2>
    <div class="hint" style="margin-bottom:10px;"><b>${escapeHtml(it.productName || it.productCode)}</b> · 실물이 도착하지 않은 수량만큼 등록해요. LOT은 "XXXXX", 상태값은 D(부적합)로 자동 고정되고 비고에 사유가 남아요. 사진은 필요 없어요.</div>
    <div class="field"><label>수량 *</label><input id="np_qty" type="text" autocomplete="off" placeholder="예: 5" value="${remaining > 0 ? remaining : ''}"></div>
    <div class="field"><label>비고</label><input id="np_memo" type="text" autocomplete="off" value="실물없는 반품"></div>
    <div class="err" id="np_err">수량을 입력해주세요</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeOverlay('noPhysicalOverlay')">취소</button>
      <button class="btn-submit" style="background:var(--danger);" id="np_saveBtn">등록</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('noPhysicalOverlay'); });

  document.getElementById('np_saveBtn').addEventListener('click', async ()=>{
    const qty = document.getElementById('np_qty').value.trim();
    if(!qty || parseFloat(qty) <= 0){ document.getElementById('np_err').style.display = 'block'; return; }
    const memo = document.getElementById('np_memo').value.trim() || '실물없는 반품';
    const newLot = { id: genId(), lot: 'XXXXX', expiryDate: '', quantity: qty, status: 'D', memo };
    if(!Array.isArray(it.lots)) it.lots = [];
    it.lots.push(newLot);
    rec.items = its;
    render();
    closeOverlay('noPhysicalOverlay');
    const ok = await window.fbUpdateRecord(recordId, { items: its });
    showToast(ok ? '실물없는 반품으로 등록됐어요' : '등록됐지만 저장에 일부 실패했어요');
    if(document.getElementById('insp_itemsList')) renderInspectItemsList(recordId);
  });
}

function renderAlThumbs(){

// ===================== 등록 마법사 (4단계, 3단계=품목 반복 추가) ===================== //

let wz = null;

function resetWizardState(){
  wz = {
    step: 1,
    receiptImage: null, receiptRawText: '',
    returnNumber: '', hospitalName: '', partnerCode: '',
    zoomImage: null, zoomRawText: '',
    items: [],   // 확정된 품목: {id, productCode, productName, lot, expiryDate, quantity, status, photos:[{data, rawText}]}
    draft: { productCode:'', productName:'', lot:'', expiryDate:'', quantity:'', status:'A', photos:[], gtinLast6:'', masterMatched:false, masterOriginalCode:'' }, // 입력 중인 품목
    draftGen: 0, // 품목(draft) 세대 ID - 늦게 끝난 OCR 결과가 다른 품목에 잘못 들어가는 것을 방지
    editingItemId: null, // 품목 수정 중이면 해당 id
    memo: ''
  };
}

function openWizardModal(){
  closeOverlay('wizardOverlay');
  resetWizardState();
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'wizardOverlay';
  overlay.innerHTML = `<div class="modal" id="wizardModal"></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('wizardOverlay'); });
  renderWizardStep();
}

function wizardStepsBarHtml(){
  const labels = ['인수증 촬영', '반품번호 확인', '품목 등록', '최종 확인'];
  return `<div class="wizard-steps">${labels.map((l,i)=>{
    const n = i+1;
    const cls = n < wz.step ? 'done' : (n === wz.step ? 'active' : '');
    return `<div class="ws ${cls}"></div>`;
  }).join('')}</div>
  <div class="step-label">${wz.step}/4 단계 · ${labels[wz.step-1]}</div>`;
}

function renderWizardStep(){
  const modal = document.getElementById('wizardModal');
  if(!modal) return;
  if(wz.step === 1) return renderWizardStep1(modal);
  if(wz.step === 2) return renderWizardStep2(modal);
  if(wz.step === 3) return renderWizardStep3(modal);
  if(wz.step === 4) return renderWizardStep4(modal);
}

// ---- Step 1: 인수증 전체 촬영 ---- //
function renderWizardStep1(modal){

  // 파트너 마스터 검색 - 코드/이름으로 필터링해서 선택 (OCR로 반품처를 읽지 않음)

// ---- Step 3: 품목 반복 등록 (제품 여러개, 같은 제품도 LOT별로 여러 줄 가능) ---- //
function renderWizardStep3(modal){

      </div>

      <div class="field"><label>제품명</label><input id="wz_it_productName" type="text" autocomplete="off" value="${escapeHtml(wz.draft.productName)}" placeholder="제품 마스터에서 선택하면 자동으로 채워져요"></div>
      <div class="field"><label>제조번호(LOT) *</label><input id="wz_it_lot" type="text" autocomplete="off" value="${escapeHtml(wz.draft.lot)}" placeholder="실물 라벨의 LOT 번호"></div>
      <div id="wz_it_lotCandidates" style="display:none; margin:-4px 0 10px;"></div>
      <div class="field"><label>유효기간</label><input id="wz_it_expiryDate" type="text" autocomplete="off" value="${escapeHtml(wz.draft.expiryDate)}" placeholder="예: 2028.03 → 자동으로 2028.03.31"></div>
      <div class="field"><label>수량</label><input id="wz_it_quantity" type="text" autocomplete="off" value="${escapeHtml(wz.draft.quantity)}" placeholder="예: 15"></div>
      <div class="field"><label>상태값</label>
        <select id="wz_it_status">
          ${Object.keys(ITEM_STATUS_LABEL).map(k => `<option value="${k}" ${wz.draft.status === k ? 'selected' : ''}>${k} · ${ITEM_STATUS_LABEL[k]}</option>`).join('')}
        </select>
      </div>
      <div class="hint">📌 자동 인식된 값은 참고용이에요. 실물과 반드시 대조해서 확인·수정해주세요.</div>
      <div class="err" id="wz_it_err">사진 1장 이상 + 제조번호(LOT)는 필수예요</div>
      <div class="modal-actions" style="margin-top:12px;">
        ${wz.editingItemId ? `<button class="btn-cancel" onclick="wzCancelEditItem()">수정 취소</button>` : ''}
        <button class="btn-submit amber" id="wzAddItemBtn">${wz.editingItemId ? '수정 완료 · 목록에 반영' : '✓ 이 품목 목록에 추가'}</button>

      <button class="btn-submit" id="wz3NextBtn">다음 단계</button>

  renderWzItemsList();
  renderWzDraftThumbs();

  // 제품 마스터 검색 - 직접 검색/타이핑 선택도, OCR 추천 선택도 같은 목록을 공유함
  window.fbListCatalogItems().then(list => { productCatalogCache = list; });
  const codeInput = document.getElementById('wz_it_productCode');
  const codeSuggest = document.getElementById('wz_it_productSuggest');
  const nameInputForFill = document.getElementById('wz_it_productName');
  codeInput.addEventListener('input', ()=>{
    renderSuggestBox(productCatalogCache, codeInput.value, codeSuggest, codeInput, (item)=> item.code);
  });
  codeInput.addEventListener('itemselected', (e)=>{
    if(e.detail && e.detail.name){ nameInputForFill.value = e.detail.name; } // 제품 선택 시 제품명은 항상 마스터 값으로 채움
    const rec = document.getElementById('wz_it_catalogRecommend');
    if(rec){ rec.style.display = 'none'; rec.innerHTML = ''; }
  });
  codeInput.addEventListener('focus', ()=>{
    if(codeInput.value.trim()) renderSuggestBox(productCatalogCache, codeInput.value, codeSuggest, codeInput, (item)=> item.code);
  });
  document.addEventListener('click', function hideOnOutside(e){
    if(!codeSuggest.contains(e.target) && e.target !== codeInput){ codeSuggest.style.display = 'none'; }
  });

  const addBtn = document.getElementById('wzAddPhotoBtn');
  const input = document.getElementById('wzDraftPhotoInput');
  addBtn.addEventListener('click', ()=> input.click());
  input.addEventListener('change', ()=>{
    if(!input.files.length) return;
    const file = input.files[0];
    const genAtStart = wz.draftGen; // 이 사진 캡처를 시작한 시점의 품목 세대 - 나중에 결과 적용 전 재확인용
    const reader = new FileReader();
    reader.onload = async (e)=>{
      if(wz.draftGen !== genAtStart) return; // 그 사이 품목이 바뀌었으면(추가/취소/수정) 중단
      const dataUrl = e.target.result;
      const idx = wz.draft.photos.length;
      wz.draft.photos.push({ data: dataUrl, rawText: '' });
      renderWzDraftThumbs();
      const progWrap = document.getElementById('wzDraftProgressWrap');
      const resultEl3 = document.getElementById('wzDraftResultMsg');
      if(resultEl3) resultEl3.style.display = 'none';
      if(progWrap){ progWrap.style.display = 'block'; document.getElementById('wzDraftProgress').textContent = `🔄 사진 ${idx+1} 분석 중... (몇 초 걸려요, 기다리지 않고 바로 손으로 입력하셔도 돼요)`; }

      const text = await runOcr(dataUrl);
      if(wz.draftGen !== genAtStart) return; // OCR 끝난 시점에도 재확인 - 그 사이 다른 품목으로 넘어갔으면 결과 버림
      if(idx < wz.draft.photos.length) wz.draft.photos[idx].rawText = text;
      if(progWrap) progWrap.style.display = 'none';

      const codeEl = document.getElementById('wz_it_productCode');
      const nameEl = document.getElementById('wz_it_productName');
      const lotEl = document.getElementById('wz_it_lot');
      const expEl = document.getElementById('wz_it_expiryDate');
      if(!codeEl || !lotEl || !expEl) return; // 화면이 이미 다른 단계/품목으로 넘어간 경우 DOM 없음

      const combined = wz.draft.photos.map(p=>p.rawText).join('\n');
      let found3 = [];
      const lotCandidatesEl = document.getElementById('wz_it_lotCandidates');

      // 1순위: 제품코드(REF) 라벨 기반 추출
      // 2순위: LOT/제조번호 라벨 기반 추출 (라벨 못 찾으면 무작위 숫자 넣지 않음 - 대신 후보 칩으로 제안)
      if(!lotEl.value.trim()){
        const lotGuess = extractLotGuess(combined);
        if(lotGuess){
          lotEl.value = lotGuess;
          found3.push(`LOT ${lotGuess}`);
          if(lotCandidatesEl){ lotCandidatesEl.style.display = 'none'; lotCandidatesEl.innerHTML = ''; }
        } else if(lotCandidatesEl){
          const candidates = extractLotCandidates(combined, codeEl.value.trim());
          if(candidates.length > 0){
            lotCandidatesEl.style.display = 'block';
            lotCandidatesEl.innerHTML = `<div class="hint" style="margin-bottom:4px;">🔎 LOT 라벨을 못 찾았어요 - 사진에서 발견된 후보예요 (탭해서 선택):</div>` +
              candidates.map((c, i) => `<span class="suggest-item" style="display:inline-block; width:auto; border:1px solid var(--line); border-radius:16px; padding:5px 12px; margin:2px 4px 2px 0;" data-cand="${i}">${escapeHtml(c)}</span>`).join('');
            lotCandidatesEl.querySelectorAll('[data-cand]').forEach(el=>{
              el.addEventListener('click', ()=>{
                lotEl.value = candidates[parseInt(el.dataset.cand, 10)];
                lotCandidatesEl.style.display = 'none';
                lotCandidatesEl.innerHTML = '';
              });
            });
          }
        }
      }
      // 3순위: 유효기간(EXP) 라벨 기반 추출 - 월까지만 있으면 자동으로 그 달 말일로 채움, MFG 날짜는 무시
      if(!expEl.value.trim()){
        const dateGuess = extractExpiryGuess(combined);
        if(dateGuess){ expEl.value = dateGuess; found3.push(`유효기간 ${dateGuess}`); }
      }

      // 바코드(GTIN) 끝 6자리로 제품코드 마스터 자동 조회 - 등록해둔 매핑이 있으면 최우선으로 채움
      const gtin = extractGtinCandidate(combined);
      let masterHit = null;
      if(gtin){
        wz.draft.gtinLast6 = gtin.slice(-6);
        masterHit = await window.fbGetProductMaster(wz.draft.gtinLast6);
        if(wz.draftGen !== genAtStart) return; // 마스터 조회 중에도 품목이 바뀌었을 수 있음
      }
      const recommendEl = document.getElementById('wz_it_catalogRecommend');
      if(recommendEl){ recommendEl.style.display = 'none'; recommendEl.innerHTML = ''; }

      if(masterHit && masterHit.productCode){
        codeEl.value = masterHit.productCode;
        let enrichedName = masterHit.productName;
        if(!enrichedName){
          const catalogHit = productCatalogCache.find(c => c.code === masterHit.productCode);
          if(catalogHit) enrichedName = catalogHit.name;
        }
        if(enrichedName && !nameEl.value.trim()) nameEl.value = enrichedName;
        wz.draft.masterMatched = true;
        wz.draft.masterOriginalCode = masterHit.productCode;
        found3.push(`제품코드 ${masterHit.productCode} (바코드매핑)`);
      } else if(!codeEl.value.trim()){
        // OCR 후보 코드를 제품 마스터와 비교 - 정확일치면 바로 채우고, 유사후보만 있으면 추천으로 보여줌 (자동 확정 안함)
        const codeGuess = extractProductCodeGuess(combined);
        if(codeGuess){
          const catalogMatches = findCatalogMatches(productCatalogCache, codeGuess, 5);
          const exactHit = catalogMatches.find(m => m.score === 0);
          if(exactHit){
            codeEl.value = exactHit.code;
            if(!nameEl.value.trim()) nameEl.value = exactHit.name;
            found3.push(`제품코드 ${exactHit.code} (제품마스터 일치)`);
          } else {
            codeEl.value = codeGuess; // OCR 원본값은 참고용으로 일단 넣어둠
            found3.push(`제품코드(추정) ${codeGuess} - 아래 추천 확인`);
            if(catalogMatches.length > 0) renderCatalogRecommend(catalogMatches, codeEl, nameEl, recommendEl);
          }
        } else {
          // 코드 후보 자체가 없으면 OCR 전체 텍스트에서 제품명 단어로 후보를 찾아봄
          const nameMatches = findCatalogMatchesByName(productCatalogCache, combined, 5);
          if(nameMatches.length > 0){
            found3.push('제품코드는 못 찾았지만 제품명으로 후보를 찾았어요 - 아래 추천 확인');
            renderCatalogRecommend(nameMatches, codeEl, nameEl, recommendEl);
          }
        }
      }

      const resultEl3b = document.getElementById('wzDraftResultMsg');
      if(resultEl3b){
        resultEl3b.style.display = 'block';
        const debugHtml3 = `<details style="margin-top:8px;">
          <summary style="font-size:11.5px; color:var(--ink-muted); cursor:pointer; font-weight:600;">🔍 OCR이 실제로 읽은 텍스트 보기 (디버그용)</summary>
          <pre style="white-space:pre-wrap; font-size:10.5px; color:var(--ink-muted); background:#F7F8FA; padding:10px; border-radius:8px; margin-top:6px; max-height:180px; overflow-y:auto; font-family:'JetBrains Mono',monospace;">${escapeHtml(combined || '(인식된 텍스트 없음)')}</pre>
        </details>`;
        if(found3.length > 0){
          resultEl3b.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--green); background:var(--green-bg); padding:8px 10px; border-radius:8px; margin-top:8px;">✅ 자동 인식: ${escapeHtml(found3.join(' · '))} - 실물과 대조해서 확인해주세요</div>${debugHtml3}`;
        } else {
          resultEl3b.innerHTML = `<div style="font-size:12.5px; font-weight:600; color:var(--danger); background:#FBEAE8; padding:8px 10px; border-radius:8px; margin-top:8px;">⚠️ 자동 인식되지 않았어요 - 실물 라벨을 보고 직접 입력해주세요</div>${debugHtml3}`;
        }
      }
      input.value = '';
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('wzAddItemBtn').addEventListener('click', wzCommitDraftItem);

  document.getElementById('wz3NextBtn').addEventListener('click', ()=>{
    const draftHasContent = wz.draft.photos.length > 0 || document.getElementById('wz_it_lot').value.trim() || document.getElementById('wz_it_productName').value.trim();

// LOT 라벨을 아예 못 찾았을 때 - 자동으로 채우지는 않고, 날짜/이미 쓰인 제품코드를 제외한 알파벳+숫자 토큰들을
// "추천 후보"로 보여줌 (탭하면 채워짐). 확신 없는 값을 자동확정하지 않기 위한 보조 기능.
function extractLotCandidates(text, excludeCode){
  if(!text) return [];
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const dateLike = /^20\d{2}[-.\/]\d{1,2}([-.\/]\d{1,2})?$/;
  const excludeUp = (excludeCode || '').toUpperCase();
  const seen = new Set();
  const candidates = [];
  for(const line of lines){
    const matches = line.match(/[A-Za-z0-9]+(?:[-\/.][A-Za-z0-9]+)*/g) || [];
    for(const m of matches){
      const clean = m.toUpperCase();
      const alnumLen = clean.replace(/[-\/.]/g, '').length;
      if(alnumLen < 5 || alnumLen > 14) continue;
      if(dateLike.test(m)) continue;
      if(excludeUp && clean === excludeUp) continue;
      if(seen.has(clean)) continue;
      seen.add(clean);
      candidates.push(clean);
      if(candidates.length >= 5) return candidates;
    }
  }
  return candidates;
}

// OCR 후보와 제품 마스터가 정확히 일치하지 않을 때 - 비슷한 후보들을 보여주고 사용자가 직접 선택하게 함 (자동 확정 안함)
function renderCatalogRecommend(matches, codeEl, nameEl, container){
  if(!container || !matches || matches.length === 0) return;
  container.style.display = 'block';
  container.innerHTML = `
    <div style="font-size:12px; font-weight:700; color:var(--steel-dark); margin-bottom:6px;">🔎 비슷한 제품 (제품 마스터에서 찾음 - 맞으면 선택해주세요)</div>
    ${matches.map((m, i) => `
      <div class="suggest-item" style="border:1px solid var(--line); border-radius:8px; margin-bottom:6px;" data-ridx="${i}">
        ${escapeHtml(m.code)} · ${escapeHtml(m.name)}
      </div>`).join('')}
  `;
  container.querySelectorAll('[data-ridx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const m = matches[parseInt(el.dataset.ridx, 10)];
      codeEl.value = m.code;
      nameEl.value = m.name;
      container.style.display = 'none';
      container.innerHTML = '';
      showToast(`${m.code} 선택했어요`);
    });
  });
}

function wzCommitDraftItem(){
  wzReadDraftFieldsFromDom();
  if(wz.draft.photos.length === 0 || !wz.draft.lot){
    document.getElementById('wz_it_err').style.display = 'block';
    return;
  }
  const committed = { ...wz.draft };
  if(wz.editingItemId){
    const idx = wz.items.findIndex(it => it.id === wz.editingItemId);
    if(idx !== -1){
      wz.items[idx] = { id: wz.editingItemId, ...wz.draft, photos: wz.draft.photos };
    }
    wz.editingItemId = null;
  } else {
    wz.items.push({ id: genId(), ...wz.draft, photos: wz.draft.photos });
  }
  wz.draft = freshDraft();
  wz.draftGen++; // 새 세대 시작 - 이전 품목에 대한 늦은 OCR 응답은 이제 전부 무시됨
  document.getElementById('wz3_err').style.display = 'none';
  renderWizardStep3(document.getElementById('wizardModal'));
  showToast('품목이 목록에 추가됐어요 - 다음 품목을 이어서 촬영해주세요');

  // 바코드는 인식됐는데 마스터에 없거나(신규) 마스터 값과 다르게 수정한 경우 - 다음부터 자동인식되도록 등록 제안
  if(committed.gtinLast6 && committed.productCode){
    const needsSave = !committed.masterMatched || (committed.masterOriginalCode && committed.masterOriginalCode !== committed.productCode);
    if(needsSave){
      const msg = committed.masterMatched
        ? `이 바코드의 마스터 제품코드가 "${committed.masterOriginalCode}"였는데 "${committed.productCode}"로 수정하셨어요.\n마스터를 새 값으로 업데이트할까요?`
        : `이 바코드(끝 6자리: ${committed.gtinLast6})를 제품코드 "${committed.productCode}"로 마스터에 등록해서 다음부터 자동 인식되게 할까요?`;
      showAppConfirm(msg, '마스터 등록', async ()=>{
        const ok = await window.fbSaveProductMaster(committed.gtinLast6, committed.productCode, committed.productName, '', myName);
        showToast(ok ? '마스터에 등록됐어요 - 다음부터 자동 인식돼요' : '마스터 등록에 실패했어요');
      });
    }
  }
}

  const itemPhotoTotal = wz.items.reduce((sum, it) => sum + it.photos.length, 0);

  const rec = {
    id, returnNumber: wz.returnNumber, hospitalName: wz.hospitalName, partnerCode: wz.partnerCode || '',
    memo,
    items: wz.items.map(it => ({ id: it.id, productCode: it.productCode, productName: it.productName, lot: it.lot, expiryDate: it.expiryDate, quantity: it.quantity, status: it.status || 'A' })),
    status: 'pending', registeredBy: by, registeredAt: now,
    confirmedBy: null, confirmedAt: null, confirmMemo: null,
    photoCount: totalPhotos
  };
  records.push(rec);
  render();
  closeOverlay('wizardOverlay');
  await saveMyName(by);
  const ok = await window.fbAddRecord(rec);

  try{
    const receiptCompressed = await compressPhoto(wz.receiptImage);
    await window.fbAddPhoto(id, null, 'receipt', receiptCompressed);
    if(wz.zoomImage){
      const zoomCompressed = await compressPhoto(wz.zoomImage);

      for(const p of it.photos){
        const c = await compressPhoto(p.data);
        await window.fbAddPhoto(id, it.id, 'product', c);
      }
    }
    showToast(ok ? '반품 등록 완료' : '등록됐지만 일부 저장에 실패했어요');
  }catch(e){
    console.error('사진 업로드 실패:', e);
    showToast('기록은 등록됐지만 일부 사진 업로드에 실패했어요');
  }
}

function exportToExcel(){
  const list = getFiltered();
  if(list.length === 0){ showToast('내보낼 항목이 없어요'); return; }
  const rows = [];
  list.forEach(r => {
    const its = itemsOf(r);
    const base = {
      '반품번호': r.returnNumber || '', '상태': STATUS_LABEL[r.status] || r.status,
      '병원명': r.hospitalName || '',
      '등록자': r.registeredBy || '', '등록일시': r.registeredAt ? fmtDate(r.registeredAt) : '',
      '검수자': r.confirmedBy || '', '검수일시': r.confirmedAt ? fmtDate(r.confirmedAt) : '', '메모': r.memo || ''
    };
    if(its.length === 0){
      rows.push({ ...base, '제품코드':'', '제품명':'', '예정수량':'', '제조번호':'', '유효기간':'', '수량':'', '품목상태값':'', 'LOT비고':'' });
    } else {
      its.forEach(it => {
        if(isExcelItem(it)){
          const lots = Array.isArray(it.lots) ? it.lots : [];
          if(lots.length === 0){
            rows.push({ ...base, '제품코드': it.productCode||'', '제품명': it.productName||'', '예정수량': it.expectedQuantity||'', '제조번호':'(미확인)', '유효기간':'', '수량':'', '품목상태값':'', 'LOT비고':'' });
          } else {
            lots.forEach(l => {
              const st = l.status || 'A';
              rows.push({ ...base, '제품코드': it.productCode||'', '제품명': it.productName||'', '예정수량': it.expectedQuantity||'', '제조번호': l.lot||'', '유효기간': l.expiryDate||'', '수량': l.quantity||'', '품목상태값': `${st} (${ITEM_STATUS_LABEL[st] || st})`, 'LOT비고': l.memo || '' });
            });
          }
        } else {
          const st = it.status || 'A';
          rows.push({ ...base, '제품코드': it.productCode||'', '제품명': it.productName||'', '예정수량':'', '제조번호': it.lot||'', '유효기간': it.expiryDate||'', '수량': it.quantity||'', '품목상태값': `${st} (${ITEM_STATUS_LABEL[st] || st})`, 'LOT비고': it.memo || '' });
        }
      });
    }
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:10},{wch:20},{wch:14},{wch:10},{wch:16},{wch:10},{wch:16},{wch:24},{wch:22},{wch:10},{wch:14},{wch:12},{wch:8},{wch:16},{wch:18}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '반품검수기록');
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  XLSX.writeFile(wb, `반품검수기록_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.xlsx`);
  showToast(`${rows.length}건 엑셀로 다운로드 완료`);
}

// ===================== 엑셀 내보내기 (반품레포트 양식) ===================== //
// 반품번호(주문번호) → 제품코드 → LOT 순으로 오름차순 정렬해서, 같은 제품이라도 LOT이 다르면 줄을 나눠서 내보냄.
// 반품 사유 / QREM발송예정 / 비고는 항상 빈칸으로 남겨서 엑셀에서 직접 채우도록 함.

// 파트너마스터는 수천 건일 수 있어서(반품처 목록 전체 조회) 다운로드마다 매번 새로 불러오면 느려짐.
// 5분 이내 재요청이면 캐시를 재사용해서 반품 건수와 무관하게 이 부분 대기시간을 줄임.
let partnerListFetchCache = { data: null, at: 0 };
async function getPartnerListCached(){
  const now = Date.now();
  if(partnerListFetchCache.data && (now - partnerListFetchCache.at) < 5 * 60 * 1000){
    return partnerListFetchCache.data;
  }
  const list = await window.fbListPartnerMaster();
  partnerListFetchCache = { data: list, at: now };
  return list;
}

async function exportToCompanyFormat(){
  const list = getFiltered();
  if(list.length === 0){ showToast('내보낼 항목이 없어요'); return; }
  showToast('엑셀 만드는 중...');

  // 반품번호 등록 시 이미 partnerCode가 정상적으로 박혀있는 카드는 파트너마스터를 다시 조회할 필요가 없음.
  // 코드가 비어있는 옛날 방식 기록이 하나라도 섞여있을 때만(드묾) 보정용으로 파트너 목록을 불러옴.
  const needsPartnerLookup = list.some(r => !r.partnerCode);
  const partnerList = needsPartnerLookup ? await getPartnerListCached() : [];
  if(needsPartnerLookup) partnerMasterCache = partnerList;

  const rows = [];

  list.forEach(r => {
    const receivedDate = r.confirmedAt ? fmtDate(r.confirmedAt).split(' ')[0] : '';
    const { code: partnerCode, name: partnerName } = r.partnerCode
      ? { code: r.partnerCode, name: r.hospitalName || '' }
      : resolvePartnerForRecord(r, partnerList);
    itemsOf(r).forEach(it => {
      const lots = isExcelItem(it)
        ? (Array.isArray(it.lots) ? it.lots : [])
        : [{ lot: it.lot || '', expiryDate: it.expiryDate || '', quantity: it.quantity || '', status: it.status || '' }];

      lots.forEach(l => {
        const mismatch = l.codeMismatch;
        const block = l.blockBatch;
        const noteParts = [];
        if(l.memo) noteParts.push(l.memo);
        if(mismatch) noteParts.push(`${mismatch.expectedCode}에서 ${mismatch.scannedCode}로 변경됨`);
        if(block) noteParts.push(block.memo && block.memo.trim() ? block.memo.trim() : '블락배치');
        rows.push({
          vals: [receivedDate, r.returnNumber || '', partnerCode, partnerName, it.productCode || '', it.productName || '',
            l.lot || '', l.expiryDate || '', 'X', l.status || '', l.quantity || '', '', '', noteParts.join(' / '), mismatch ? mismatch.scannedCode : ''],
          highlightType: block ? 'block' : (mismatch ? 'mismatch' : '')
        });
      });
    });
  });

  if(rows.length === 0){ showToast('내보낼 품목이 없어요'); return; }

  // 반품번호(vals[1]) → 제품코드(vals[4]) → LOT(vals[6]) 오름차순 정렬
  rows.sort((a, b) => {
    const rn = String(a.vals[1]).localeCompare(String(b.vals[1]), 'ko');
    if(rn !== 0) return rn;
    const pc = String(a.vals[4]).localeCompare(String(b.vals[4]), 'ko');
    if(pc !== 0) return pc;
    return String(a.vals[6]).localeCompare(String(b.vals[6]), 'ko');
  });

  const headerOrder = ['입고일자','주문번호','배송처코드','배송처명','제품코드','제품명','LOT','유효기간','기존','변경','수량','반품 사유','QREM발송예정','비고','확인된제품코드'];
  const colWidths = [12,14,14,24,12,30,14,12,8,8,8,14,16,20,14];

  // ExcelJS는 셀 배경색을 실제로 저장 지원함 (SheetJS 무료버전은 스타일 저장을 지원 안 해서 안 보였던 것)
  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet('반품레포트');
  sheet.columns = headerOrder.map((h, i) => ({ header: h, key: 'c' + i, width: colWidths[i] }));

  // 블락배치: 진한 파랑(텍스트2, 60% 밝게 근사) / 제품코드 다름(정품 확인됨): 노랑
  const FILL_BLOCK = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB4C6E7' } };
  const FILL_MISMATCH = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFFF00' } };

  rows.forEach(row => {
    const excelRow = sheet.addRow(row.vals);
    if(row.highlightType){
      const fill = row.highlightType === 'block' ? FILL_BLOCK : FILL_MISMATCH;
      excelRow.eachCell({ includeEmpty: true }, cell => { cell.fill = fill; });
    }
  });
  sheet.getRow(1).font = { bold: true };

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const filename = `반품레포트양식_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.xlsx`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 30000);
  showToast(`${rows.length}건 반품레포트 양식으로 다운로드 완료`);
}

// ===================== 사진 백업 다운로드 (zip) ===================== //
// 사이트(Firestore)에 사진이 계속 쌓이기만 하는 한계가 있어서, 반품번호_반품처 폴더 > 제품별 폴더
// 구조로 사진을 묶어 로컬에 백업할 수 있게 함. 체크박스로 선택한 게 있으면 선택 건만, 없으면
// 현재 필터·검색 상태의 전체 목록을 대상으로 함.
function sanitizeFileName(name){
  return String(name || '').replace(/[\\/:*?"<>|]/g, '_').trim().slice(0, 60) || '이름없음';
}

async function exportPhotoBackupZip(){
  const list = selectedIds.size > 0 ? records.filter(r => selectedIds.has(r.id)) : getFiltered();
  if(list.length === 0){ showToast('다운로드할 항목이 없어요'); return; }
  if(!window.JSZip){ showToast('zip 라이브러리를 불러오지 못했어요 - 새로고침 후 다시 시도해주세요'); return; }

  const totalPhotoCount = list.reduce((s, r) => s + (r.photoCount || 0), 0);
  if(totalPhotoCount === 0){ showToast('선택된 건들에 사진이 없어요'); return; }

  showToast(`사진 백업 준비 중... (0/${list.length}건)`);
  const zip = new JSZip();
  let doneRecords = 0;
  let totalPhotos = 0;

  for(const rec of list){
    const photos = await window.fbGetPhotos(rec.id);
    doneRecords++;
    if(photos.length === 0) continue;
    const its = itemsOf(rec);
    const folderName = sanitizeFileName(`${rec.returnNumber || '반품번호미확인'}_${rec.hospitalName || ''}`);
    const folder = zip.folder(folderName);
    // 같은 파일명이 겹치지 않도록 폴더별 카운터 사용
    const nameCounters = {};
    photos.forEach(p => {
      if(!p.data || typeof p.data !== 'string' || !p.data.includes(',')) return;
      const base64 = p.data.split(',')[1];
      const ext = p.data.includes('image/png') ? 'png' : 'jpg';
      let targetFolder = folder;
      let pathKey = folderName;
      let baseName;
      if(p.type === 'receipt'){
        baseName = '인수증';
      } else if(p.itemId){
        const it = its.find(x => x.id === p.itemId);
        const subName = sanitizeFileName(it ? `${it.productCode || ''}_${it.productName || ''}` : '품목미상');
        targetFolder = folder.folder(subName);
        pathKey = folderName + '/' + subName;
        const lotVal = it && Array.isArray(it.lots) ? (it.lots.find(l => l.id === p.lotId)?.lot) : null;
        baseName = lotVal ? sanitizeFileName(lotVal) : '실물사진';
      } else {
        baseName = '기타사진';
      }
      const key = `${pathKey}::${baseName}`;
      nameCounters[key] = (nameCounters[key] || 0) + 1;
      const fileName = `${baseName}_${nameCounters[key]}.${ext}`;
      targetFolder.file(fileName, base64, { base64: true });
      totalPhotos++;
    });
    if(doneRecords % 5 === 0 || doneRecords === list.length){
      showToast(`사진 백업 준비 중... (${doneRecords}/${list.length}건)`);
    }
  }

  if(totalPhotos === 0){ showToast('내려받을 사진이 없어요'); return; }

  showToast('zip 압축 중... 사진이 많으면 시간이 좀 걸려요');
  try{
    const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const filename = `반품사진백업_${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.zip`;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 30000);
    showToast(`사진 ${totalPhotos}장(${list.length}건) zip 다운로드 완료`);
  }catch(e){
    console.error('zip 생성 실패:', e);
    showToast('zip 만들다가 실패했어요 - 사진이 너무 많으면 검색으로 건수를 줄여서 다시 시도해보세요');
  }
}

async function runOldPhotoCompression(){
  const CUTOFF_DAYS = 90;
  const cutoff = Date.now() - CUTOFF_DAYS * 86400000;
  const targets = records.filter(r => r.status === 'confirmed' && r.confirmedAt && new Date(r.confirmedAt).getTime() < cutoff);

  if(targets.length === 0){
    showAppConfirm(`검수완료된 지 ${CUTOFF_DAYS}일 넘은 기록이 없어요. 정리할 게 없습니다.`, '확인', ()=>{});
    return;
  }

  showAppConfirm(
    `검수완료된 지 ${CUTOFF_DAYS}일 넘은 반품 건 ${targets.length}건의 첨부사진을 더 작게 압축할게요.\n(이미 충분히 작은 사진은 건드리지 않아요)\n시간이 좀 걸릴 수 있어요. 진행할까요?`,
    '압축 실행',
    async ()=>{
      showToast(`${targets.length}건 처리 중...`);
      let photoCount = 0, compressedCount = 0, beforeTotal = 0, afterTotal = 0;
      for(const r of targets){
        const photos = await window.fbGetPhotos(r.id);
        for(const p of photos){
          if(!p.data || typeof p.data !== 'string') continue;
          photoCount++;
          beforeTotal += p.data.length;
          try{
            const recompressed = await resizeImageToDataUrl(p.data, 700, 'jpeg', 0.4);
            if(recompressed.length < p.data.length){
              const ok = await window.fbUpdatePhotoData(p.id, recompressed);
              if(ok){ compressedCount++; afterTotal += recompressed.length; }
              else afterTotal += p.data.length;
            } else {
              afterTotal += p.data.length;
            }
          }catch(e){ console.warn('사진 재압축 실패:', e); afterTotal += p.data.length; }
        }
      }
      const savedMB = ((beforeTotal - afterTotal) / 1024 / 1024 * 0.73).toFixed(1); // base64 -> 실제 바이트 환산(약 0.73배)
      await window.fbAddMaintenanceLog({
        type: '오래된 사진 압축 정리',
        by: myName || '',
        totalCount: photoCount,
        successCount: compressedCount,
        details: [`대상 반품 ${targets.length}건 · 사진 ${photoCount}장 중 ${compressedCount}장 압축 · 약 ${savedMB}MB 절약`]
      });
      showAppConfirm(`완료! 반품 ${targets.length}건 · 사진 ${photoCount}장 중 ${compressedCount}장을 압축해서 약 ${savedMB}MB 절약했어요.`, '확인', ()=>{});
    }
  );
}

// 제품코드+LOT으로 블락배치 마스터와 대조. 실물검수 중 자주 호출되므로 캐시를 우선 쓰고, 캐시가 비어있으면 새로 불러옴.
async function findBlockBatchMatch(productCode, lot){
  if(!productCode || !lot) return null;
  if(!blockBatchCache || blockBatchCache.length === 0){
    blockBatchCache = await window.fbListBlockBatch();
  }
  const norm = s => (s||'').toString().toUpperCase().replace(/[\s\-_.\/]/g, '');
  const nc = norm(productCode), nl = norm(lot);
  return blockBatchCache.find(b => norm(b.productCode) === nc && norm(b.lot) === nl) || null;
}

// LOT 추가 모달에서 제품코드+LOT이 확정될 때마다 블락배치 마스터와 대조 - 매칭되면 상태값을 강제로 맞춰주고 배너 표시
// productCodes는 배열 - 예정 제품코드와, 불일치가 감지됐다면 실제 스캔된 코드도 같이 넘겨서 둘 다 대조함
// (블락배치가 "예정과 다른 제품"으로 등록돼 있는 경우도 있어서, 예정코드만 보면 놓칠 수 있음)
async function checkBlockBatchForLot(productCodes, lotValue){
  const banner = document.getElementById('al_blockBatchBanner');
  const statusEl = document.getElementById('al_status');
  if(!banner) return;
  const candidates = (Array.isArray(productCodes) ? productCodes : [productCodes]).filter(Boolean);
  let match = null;
  for(const code of candidates){
    match = await findBlockBatchMatch(code, lotValue);
    if(match) break;
  }
  if(match){
    lotDraftBlockBatch = { status: match.status, memo: match.memo || '' };
    if(statusEl){ statusEl.value = match.status; statusEl.disabled = true; }
    banner.style.display = 'block';
    banner.innerHTML = `<div style="font-size:12.5px; font-weight:700; color:var(--danger); background:#FBEAE8; padding:8px 10px; border-radius:8px; margin-bottom:2px;">🚫 블락배치 LOT이에요! 상태값이 <b>${escapeHtml(match.status)}</b>로 자동 설정되고 잠겼어요${match.memo ? ' · ' + escapeHtml(match.memo) : ''}</div>`;
  } else {
    lotDraftBlockBatch = null;
    if(statusEl) statusEl.disabled = false;
    banner.style.display = 'none';
    banner.innerHTML = '';
  }
}

// 코드가 비어있는(=예전 방식으로 등록된) 기록들을 찾아서 hospitalName에 남은 코드 접두어로 partnerCode를 채워주고
// hospitalName도 마스터의 깨끗한 이름으로 정리해줌. 실제 Firestore에 저장까지 반영하는 일회성 정리 도구.
async function runPartnerCodeRepair(){
  const partnerList = await window.fbListPartnerMaster();
  partnerMasterCache = partnerList;
  const targets = records.filter(r => !r.partnerCode && (r.hospitalName || '').trim());
  const fixable = targets.map(r => ({ r, before: r.hospitalName || '', resolved: resolvePartnerForRecord(r, partnerList) })).filter(x => x.resolved.code);

  if(fixable.length === 0){
    showAppConfirm(`코드가 비어있는 기록 ${targets.length}건 중 파트너마스터에서 매칭되는 코드가 없어요. 정리할 항목이 없습니다.`, '확인', ()=>{});
    return;
  }

  showAppConfirm(
    `배송처코드가 비어있는 기록 중 ${fixable.length}건을 파트너마스터로 자동 보정할 수 있어요.\n(배송처명도 "코드 이름" 중복 텍스트에서 깨끗한 이름으로 정리돼요)\n지금 정리할까요?`,
    '정리 실행',
    async ()=>{
      showToast(`${fixable.length}건 정리 중...`);
      const results = [];
      for(const { r, before, resolved } of fixable){
        r.partnerCode = resolved.code;
        r.hospitalName = resolved.name;
        const ok = await window.fbUpdateRecord(r.id, { partnerCode: resolved.code, hospitalName: resolved.name });
        results.push({ returnNumber: r.returnNumber || '', before, afterCode: resolved.code, afterName: resolved.name, ok });
      }
      render();
      const successCount = results.filter(x => x.ok).length;
      await window.fbAddMaintenanceLog({
        type: '배송처코드 일괄 정리',
        by: myName || '',
        totalCount: results.length,
        successCount,
        details: results.map(x => `${x.returnNumber}: "${x.before}" → ${x.afterCode} · ${x.afterName}${x.ok ? '' : ' (실패)'}`)
      });
      showPartnerRepairResult(results);
    }
  );
}

function showPartnerRepairResult(results){
  closeOverlay('repairResultOverlay');
  const successCount = results.filter(x => x.ok).length;
  const overlay = document.createElement('div');
  overlay.className = 'overlay'; overlay.id = 'repairResultOverlay';
  overlay.innerHTML = `<div class="modal">
    <h2>배송처코드 정리 결과</h2>
    <div class="preview-summary" style="margin-bottom:10px;">총 <b>${results.length}</b>건 중 <b>${successCount}</b>건 정리 완료</div>
    <div class="preview-wrap">
      <table class="preview-table">
        <thead><tr><th>반품번호</th><th>정리 전</th><th>정리 후</th><th></th></tr></thead>
        <tbody>
          ${results.map(x => `
            <tr>
              <td class="pv-lot">${escapeHtml(x.returnNumber)}</td>
              <td style="color:var(--ink-muted);">${escapeHtml(x.before)}</td>
              <td>${escapeHtml(x.afterCode)} · ${escapeHtml(x.afterName)}</td>
              <td>${x.ok ? '✅' : '<span style=\"color:var(--danger);\">❌ 실패</span>'}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <div class="modal-actions"><button class="btn-cancel" style="flex:1;" onclick="closeOverlay('repairResultOverlay')">닫기</button></div>
  </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeOverlay('repairResultOverlay'); });
}

// FAB 토글식 확장메뉴: 평소엔 + 버튼만 보이고, 누르면 라벨과 함께 하위 메뉴가 펼쳐짐
(function initFabToggle(){
  const toggleBtn = document.getElementById('fabToggleBtn');
  const menu = document.getElementById('fabMenu');
  const backdrop = document.getElementById('fabBackdrop');
  if(!toggleBtn || !menu || !backdrop) return;
  function closeFabMenu(){
    menu.classList.remove('open');
    toggleBtn.classList.remove('open');
    backdrop.classList.remove('open');
  }
  function toggleFabMenu(){
    const willOpen = !menu.classList.contains('open');
    menu.classList.toggle('open', willOpen);
    toggleBtn.classList.toggle('open', willOpen);
    backdrop.classList.toggle('open', willOpen);
  }
  toggleBtn.addEventListener('click', toggleFabMenu);
  backdrop.addEventListener('click', closeFabMenu);
  menu.querySelectorAll('.fab-item button').forEach(btn => btn.addEventListener('click', closeFabMenu));
})();

function showLoginScreen(){
  document.getElementById('app').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'setup-screen'; el.id = 'loginScreen';
  el.innerHTML = `<div class="setup-box" style="text-align:center;">
    <div class="setup-icon">🔒</div>
    <h2>비밀번호 입력</h2>
    <p>팀 공용 비밀번호를 입력하면 들어갈 수 있어요.</p>
    <input class="login-input" id="loginPw" type="password" placeholder="비밀번호">
    <div class="login-err" id="loginErr">비밀번호가 틀렸어요. 다시 확인해주세요.</div>
    <button class="btn-submit" style="width:100%; margin-top:14px;" id="loginBtn">입장</button>
    <button class="btn-cancel" style="width:100%; margin-top:10px;" id="guestBtn">게스트로 둘러보기 (조회 전용)</button>
    <div class="login-err" id="guestErr">게스트 접속에 실패했어요. 잠시 후 다시 시도해주세요.</div>
  </div>`;
  document.body.appendChild(el);

  const submit = async ()=>{
    const pw = document.getElementById('loginPw').value;
    if(!pw) return;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');
    err.style.display = 'none'; btn.textContent = '확인 중...'; btn.disabled = true;
    const ok = await window.fbLogin(pw);
    if(ok){ el.remove(); document.getElementById('app').style.display = ''; }
    else { err.style.display = 'block'; btn.textContent = '입장'; btn.disabled = false; }
  };
  document.getElementById('loginBtn').addEventListener('click', submit);
  document.getElementById('loginPw').addEventListener('keydown', (e)=>{ if(e.key === 'Enter') submit(); });
  document.getElementById('loginPw').focus();

  document.getElementById('guestBtn').addEventListener('click', async ()=>{
    const gbtn = document.getElementById('guestBtn');
    const gerr = document.getElementById('guestErr');
    gerr.style.display = 'none'; gbtn.textContent = '접속 중...'; gbtn.disabled = true;
    const ok = await window.fbGuestLogin();
    if(ok){ el.remove(); document.getElementById('app').style.display = ''; }
    else { gerr.style.display = 'block'; gbtn.textContent = '게스트로 둘러보기 (조회 전용)'; gbtn.disabled = false; }
  });
}

(async function init(){
  loadMyName();
  await waitForFirebase();
  if(!window.__firebaseReady){ showSetupNeeded(); return; }
  window.fbOnAuthChange((isLoggedIn, isAnonymous)=>{
    if(isLoggedIn){
      isGuestMode = !!isAnonymous;
      const existingLogin = document.getElementById('loginScreen');
      if(existingLogin) existingLogin.remove();
      document.getElementById('app').style.display = '';
      applyGuestModeUI();
      initRealtimeSync();
    } else {
      isGuestMode = false;
      showLoginScreen();
    }
  });
})();
